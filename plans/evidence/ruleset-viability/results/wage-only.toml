# Ruleset viability experiment, not balanced gameplay content.
# Derived from taxing.toml's shopping/wage/income-tax circuit and funded.toml's
# teaching trade, school, grant, treasury and Life Stages at c38f081.
# Private production still creates sundries without inputs; this is not Outside trade.
# Opening Households/roads are seeded by the runner, not autonomous arrivals.
# Provisional values are retained to expose composition problems before tuning.
# Only income tax and the shopfront rates Rule collect; only school_funding spends.
# Geometry uses funded.toml's 16 floor Tiles/occupant and 3 floor Tiles/place.
# School grant amount and teaching wage are separately authored Money/day/job.
# See ../../base-game-ruleset-viability.md for experiment and verdict.


[[resource]]
name = "sundries"
family = "good"
need = "sustenance"

[[resource]]
name = "repairs"
family = "good"

[[resource]]
name = "money"
family = "money"

[[business]]
name = "grocer"
work_days = 124
open_days = 127
opens_hour = 7
closes_hour = 21
wage_per_day    = 2048
pay_period_days = 7
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[building]]
name = "dwelling"
bins = [
    { resource = "sundries", capacity = 128, owner = "occupant" },
    { resource = "repairs",  capacity = 4 },
]
houses   = true
premises = true
parked = true

[[building]]
name = "shopfront"
bins = [
    { resource = "sundries", capacity = 1024, owner = "business" },
    { resource = "repairs",  capacity = 4 },
    { resource = "money",    owner = "business" },
]
houses   = true
premises = true
business = "grocer"

[[rule]]
name    = "restock"
kind    = "dwelling"
rate    = 8
apply   = { min = 1, max = 4 }
inputs  = [ { scope = "pool", resource = "sundries", amount = 4 } ]
outputs = [ { scope = "local", resource = "sundries", amount = 4 } ]

[[rule]]
name    = "consume"
kind    = "dwelling"
rate    = 256
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "sundries", amount = 4 } ]
outputs = []

[[rule]]
