# The CC0 texture library for Building bodies. scripts/art/materials.py reads this list, fetches each
# texture's 1K colour, OpenGL normal and roughness maps, and writes them beside this file with
# materials.json.
#
# slots          Rows in research/textures/inventory.toml that the texture was kept for.
# tile_metres    Width and height of one tile of the image, in metres.
# measured       Where tile_metres comes from. "Assumed" marks a size nobody has checked.
# paint          The colour map becomes greyscale at linear mean luminance 0.7, so a family's paint
#                colour carries the hue. Otherwise the photograph keeps its colour.
# detile_cycles  Brightness variation up to this many cycles per tile is divided out of the colour
#                map. 4 removes only patches the size of the tile. 7.2 also removes smaller ones.

