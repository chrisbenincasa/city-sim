<svg xmlns="http://www.w3.org/2000/svg" viewBox="760 80 390 285" role="img"><title>D — Roof construction and scale</title><desc>Original explanatory diagrams. Provisional dimensions and source-specific material modules distinguished.</desc><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 6L6 0" stroke="#bbb" stroke-width=".6"/></pattern><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#333"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#252a2e} .small{font-size:12px} .label{font-size:15px} .title{font-size:26px;font-weight:bold}</style><rect width="100%" height="100%" fill="#faf9f5"/><text x="30" y="38" font-size="26">D / Roofs are assemblies, not national silhouettes</text><text x="30" y="65" font-size="14">SOURCE-CONSTRAINED DIAGRAMS · structural sizing is not certified · section scale varies only where labelled</text><text x="40" y="110" font-size="18">Domestic truss study</text><line x1="40" y1="260" x2="40" y2="200" stroke="#343a3e" stroke-width="3"/><line x1="150" y1="260" x2="150" y2="200" stroke="#343a3e" stroke-width="3"/><polygon points="40,200 95.0,174.35307880147508 150,200" fill="#d5d8d3" stroke="#343a3e"/><line x1="40" y1="200" x2="150" y2="200" stroke="#343a3e" stroke-width="1"/><line x1="40.0" y1="200" x2="53.75" y2="193.58826970036876" stroke="#343a3e" stroke-width="1"/><line x1="67.5" y1="200" x2="81.25" y2="180.7648091011063" stroke="#343a3e" stroke-width="1"/><line x1="95.0" y1="200" x2="108.75" y2="180.7648091011063" stroke="#343a3e" stroke-width="1"/><line x1="122.5" y1="200" x2="136.25" y2="193.58826970036876" stroke="#343a3e" stroke-width="1"/><line x1="40" y1="280" x2="150" y2="280" stroke="#343a3e" stroke-width="1"/><line x1="40" y1="276" x2="40" y2="284" stroke="#343a3e" stroke-width="1"/><line x1="150" y1="276" x2="150" y2="284" stroke="#343a3e" stroke-width="1"/><text x="40" y="272" font-size="12">10 m span</text><text x="40" y="320" font-size="14">25° → 2.332 m rise</text><text x="40" y="344" font-size="12">All sections above: 11 px/m</text><text x="415" y="110" font-size="18">Low membrane range study</text><line x1="415" y1="260" x2="415" y2="200" stroke="#343a3e" stroke-width="3"/><line x1="547" y1="260" x2="547" y2="200" stroke="#343a3e" stroke-width="3"/><polygon points="415,200 481.0,187.17089959691057 547,200" fill="#d5d8d3" stroke="#343a3e"/><line x1="415" y1="200" x2="547" y2="200" stroke="#343a3e" stroke-width="1"/><line x1="415" y1="280" x2="547" y2="280" stroke="#343a3e" stroke-width="1"/><line x1="415" y1="276" x2="415" y2="284" stroke="#343a3e" stroke-width="1"/><line x1="547" y1="276" x2="547" y2="284" stroke="#343a3e" stroke-width="1"/><text x="415" y="272" font-size="12">12 m span</text><text x="415" y="320" font-size="14">11° → 1.166 m rise</text><text x="415" y="344" font-size="12">All sections above: 11 px/m</text><text x="790" y="110" font-size="18">Workshop portal study</text><line x1="790" y1="260" x2="790" y2="200" stroke="#343a3e" stroke-width="3"/><line x1="1054" y1="260" x2="1054" y2="200" stroke="#343a3e" stroke-width="3"/><polygon points="790,200 922.0,186.12624094493071 1054,200" fill="#d5d8d3" stroke="#343a3e"/><line x1="790" y1="200" x2="1054" y2="200" stroke="#343a3e" stroke-width="1"/><line x1="790" y1="200" x2="815" y2="190" stroke="#343a3e" stroke-width="5"/><line x1="1054" y1="200" x2="1029" y2="190" stroke="#343a3e" stroke-width="5"/><line x1="790" y1="280" x2="1054" y2="280" stroke="#343a3e" stroke-width="1"/><line x1="790" y1="276" x2="790" y2="284" stroke="#343a3e" stroke-width="1"/><line x1="1054" y1="276" x2="1054" y2="284" stroke="#343a3e" stroke-width="1"/><text x="790" y="272" font-size="12">24 m span</text><text x="790" y="320" font-size="14">6° → 1.261 m rise</text><text x="790" y="344" font-size="12">All sections above: 11 px/m</text><text x="40" y="402" font-size="18">Warm membrane roof / conceptual layer order</text><rect x="40" y="430" width="380" height="20" fill="#5c656c" stroke="#343a3e" stroke-width="1"/><text x="440" y="445" font-size="14">membrane / protection</text><rect x="40" y="458" width="380" height="20" fill="#d4cfb9" stroke="#343a3e" stroke-width="1"/><text x="440" y="473" font-size="14">insulation to falls</text><rect x="40" y="486" width="380" height="20" fill="#777" stroke="#343a3e" stroke-width="1"/><text x="440" y="501" font-size="14">air/vapour layer</text><rect x="40" y="514" width="380" height="20" fill="#a3aaa6" stroke="#343a3e" stroke-width="1"/><text x="440" y="529" font-size="14">deck + supporting joists</text><text x="810" y="402" font-size="16">Edge junction / schematic</text><rect x="865" y="440" width="28" height="105" fill="#c9cbc3" stroke="#343a3e" stroke-width="1"/><rect x="893" y="522" width="215" height="12" fill="#a3aaa6" stroke="#343a3e" stroke-width="1"/><rect x="893" y="502" width="215" height="20" fill="#d4cfb9" stroke="#343a3e" stroke-width="1"/><line x1="893" y1="500" x2="1108" y2="500" stroke="#343a3e" stroke-width="2"/><line x1="893" y1="440" x2="893" y2="500" stroke="#343a3e" stroke-width="2"/><line x1="860" y1="437" x2="899" y2="437" stroke="#343a3e" stroke-width="3"/><line x1="897" y1="500" x2="850" y2="500" stroke="#343a3e" stroke-width="1" marker-end="url(#arrow)"/><line x1="850" y1="500" x2="850" y2="547" stroke="#343a3e" stroke-width="2"/><text x="918" y="467" font-size="11">membrane return</text><text x="918" y="487" font-size="11">outlet through parapet</text><text x="40" y="568" font-size="13">Return membrane up parapet; cap sheds to roof; outlet and overflow remain visible.</text><text x="40" y="590" font-size="12">Layers are exploded, not thickness-scaled. C1/C2 and CA5; climate analysis still required.</text><text x="40" y="640" font-size="18">Human and opening / 70 px per metre</text><circle cx="65" cy="711.5" r="10.5" fill="#333"/><line x1="65" y1="722.0" x2="65" y2="778.0" stroke="#343a3e" stroke-width="2"/><line x1=