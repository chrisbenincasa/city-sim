3a3e" stroke-width="1"/><rect x="881.25" y="787.5" width="107.5" height="32.5" fill="#b1856d" stroke="#343a3e" stroke-width="1"/><text x="600" y="855" font-size="12">215 × 65 mm face + proposed 10 mm joints (MAT1).</text><text x="30" y="883" font-size="12">Near-future roofs retain access and drainage; PV/green roofs need load and waterproofing design. They are not random decals.</text></svg>