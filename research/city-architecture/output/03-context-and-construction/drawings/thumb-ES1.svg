<svg xmlns="http://www.w3.org/2000/svg" viewBox="380 330 380 160" role="img"><title>E — What the sources actually dimension</title><desc>Original dimensional abstractions, with unknown boundaries left open. Source evidence is distinguished from proposed geometry.</desc><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 6L6 0" stroke="#bbb" stroke-width=".6"/></pattern><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#333"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#252a2e} .small{font-size:12px} .label{font-size:15px} .title{font-size:26px;font-weight:bold}</style><rect width="100%" height="100%" fill="#faf9f5"/><text x="30" y="38" font-size="25">E / Evidence controls: preserve what the drawing does not say</text><text x="30" y="64" font-size="14">Original numerical abstractions · not copied plans · open the cited source sheet beside each diagram</text><text x="40" y="108" font-size="18">US1 / South Bend sixplex proposal</text><polygon points="40,150 186.304,150 186.304,296.304 164.35840000000002,296.304 164.35840000000002,391.40160000000003 40,391.40160000000003" fill="#d9dcd5" stroke="#343a3e"/><line x1="40" y1="140" x2="186.304" y2="140" stroke="#343a3e" stroke-width="1"/><line x1="40" y1="136" x2="40" y2="144" stroke="#343a3e" stroke-width="1"/><line x1="186.304" y1="136" x2="186.304" y2="144" stroke="#343a3e" stroke-width="1"/><text x="40" y="132" font-size="12">40 ft / 12.192 m</text><text x="195" y="310" font-size="12">66 ft body</text><text x="40" y="410" font-size="12">Front 40×40 ft + rear 34×26 ft</text><text x="40" y="432" font-size="12">2,484 ft² exterior polygon / floor.</text><text x="40" y="454" font-size="12">Finished-gross schedule differs.</text><text x="400" y="108" font-size="18">NL1 / Amersfoort Type B module</text><rect x="400" y="150" width="61.199999999999996" height="112.80000000000001" fill="#eee" stroke="#343a3e" stroke-width="1"/><line x1="400" y1="150" x2="461.2" y2="150" stroke="#343a3e" stroke-width="2" stroke-dasharray="4 3"/><line x1="400" y1="140" x2="461.2" y2="140" stroke="#343a3e" stroke-width="1"/><line x1="400" y1="136" x2="400" y2="144" stroke="#343a3e" stroke-width="1"/><line x1="461.2" y1="136" x2="461.2" y2="144" stroke="#343a3e" stroke-width="1"/><text x="400" y="132" font-size="12">5.1 m</text><text x="480" y="200" font-size="12">9.4 m depth</text><text x="400" y="280" font-size="12">Beukmaat, not measured external width.</text><text x="400" y="304" font-size="12">109 m² GBO is not gross floor.</text><text x="785" y="108" font-size="18">CA2 / Sacramento court diagram</text><rect x="785" y="150" width="54.864" height="80" fill="#d9dcd5" stroke="#343a3e" stroke-width="1"/><rect x="934.352" y="150" width="54.864" height="80" fill="#d9dcd5" stroke="#343a3e" stroke-width="1"/><line x1="785" y1="230" x2="989.216" y2="230" stroke="#343a3e" stroke-width="1" stroke-dasharray="5 4"/><line x1="785" y1="140" x2="989.216" y2="140" stroke="#343a3e" stroke-width="1"/><line x1="785" y1="136" x2="785" y2="144" stroke="#343a3e" stroke-width="1"/><line x1="989.216" y1="136" x2="989.216" y2="144" stroke="#343a3e" stroke-width="1"/><text x="785" y="132" font-size="12">67 ft / 20.4216 m overall</text><text x="785" y="245" font-size="12">18 ft / 5.4864 m wing fronts</text><text x="785" y="269" font-size="12">Rear depth intentionally unresolved.</text><text x="785" y="293" font-size="12">40 ft refers to front LOT line.</text><text x="400" y="350" font-size="18">ES1 / Mediterranean roof member</text><rect x="400" y="385" width="270" height="35" fill="#d5d8d2" stroke="#343a3e" stroke-width="1"/><rect x="400" y="376" width="270" height="9" fill="#777" stroke="#343a3e" stroke-width="1"/><text x="400" y="449" font-size="12">200 mm one-way RC member (p45).</text><text x="400" y="472" font-size="12">Diagram thickness exaggerated; not floor height.</text><text x="785" y="350" font-size="18">DK1 / Tingbjerg roof pitch</text><polygon points="785,420 845,408.34 905,420" fill="#d5d8d2" stroke="#343a3e"/><text x="930" y="420" font-size="16">11°</text><text x="785" y="449" font-size="12">Pitch documented; 12 m span proposed.</text><text x="785" y="472" font-size="12">Calculated rise 1.166 m, not measured.</text><text x="40" y="535" font-size="20">The conflicts change the modelling decision</text><text x="40" y="575" font-size="15">A schedule area is not necessarily an external-envelope polygon. Keep both numbers with their definitions.</text><text x="40" y="607" font-size="15">A narrow facade wing is not an independently occupied house. The courtyard diagram does not authorize extra tenancies.</text><text x="40" y="639" font-size="15">A construction member thickness is not a floor-to-floor height; a roof angle is not a span capacity.</text><text x="40" y="671" font-size="15">These sources constrain proposals. They do not supply a measured regional probability distribution.</text><text x="30" y="730" font-size="12">Inspection: US1 PDF22/printed21; NL1 PDF15/printed14; CA2 p49; ES1 p45; DK1 p6. Exact URLs and uncertainty in sources.csv.</text></svg>