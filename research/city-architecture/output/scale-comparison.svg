d pitch</text><text x="530" y="1478" class="">The dashed profile is a calculated alternative, NOT an earlier game capture.</text><text x="530" y="1506" class="">Halving the cross-span halves roof rise at fixed pitch. It does not add doors,</text><text x="530" y="1529" class="">create a room plan or drain the new valley. Those are separate model tasks.</text><text x="530" y="1572" class="">The G001 body stays 36 × 20 m in plan and 7 m tall in both cases.</text><text x="530" y="1614" class="tiny">M3 front elevation includes its proposed roof-access headhouse; the upper section cuts midspan.</text></svg>