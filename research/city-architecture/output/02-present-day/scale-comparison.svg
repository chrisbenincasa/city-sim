<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1600" viewBox="0 0 1440 1600" role="img" aria-label="Architecture at the same scale: evidence, game and proposed models"><title>Architecture at the same scale: evidence, game and proposed models</title><rect width="1440" height="1600" fill="#f6f2e9"/><style>text{font-family:Arial,sans-serif;fill:#273e43;font-size:14px}.title{font-size:26px;font-weight:bold}.heading{font-size:19px;font-weight:bold}.small{font-size:12px}</style><text x="40" y="44" class="title">Same ground. Different building logic.</text><text x="40" y="72" class="">Blue = documented control · orange = game · green = proposed section. Model treatments below are PROPOSED; 8 units/metre.</text><text x="40" y="95" class="small">Evidence envelopes are plans, not inferred floor areas. Unknown heights remain unknown. No image-derived measurements.</text><text x="40" y="136" class="heading">G003 game body</text><text x="40" y="158" class="small">d9addc3 / 3 storeys</text><text x="395" y="136" class="heading">US03 sixplex plan</text><text x="395" y="158" class="small">South Bend proposal / 2 storeys</text><text x="750" y="136" class="heading">US01 narrow house</text><text x="750" y="158" class="small">South Bend proposal / 2 storeys</text><text x="1090" y="136" class="heading">NL01 bay/depth control</text><text x="1090" y="158" class="small">Hogekwartier design / 4A and 4B</text><rect x="40" y="180" width="192" height="128" fill="#b88569" stroke="#364c52" stroke-width="1.2"/><path d="M395 180h82.9056v63.3984h14.630399999999995v97.536H395Z" fill="#b8cdd5" stroke="#364c52" stroke-width="1.3"/><rect x="750" y="180" width="48.768" height="68.2752" fill="#b8cdd5" stroke="#364c52" stroke-width="1.2"/><rect x="1090" y="180" width="40.8" height="75.2" fill="none" stroke="#537c8d" stroke-width="1.2" stroke-dasharray="5 3"/><text x="40" y="372" class="small">24×16 m exterior; 384 m² ground.</text><text x="40" y="392" class="small">1,152 m² counted floor; two tenancies.</text><text x="395" y="372" class="small">12.192 m maximum body width;</text><text x="395" y="392" class="small">20.1168 m body depth. Stoop omitted.</text><text x="750" y="372" class="small">6.096×8.5344 m main body.</text><text x="750" y="392" class="small">Porch is outside this rectangle.</text><text x="1090" y="372" class="small">5.1 m beukmaat ×9.4 m depth.</text><text x="1090" y="392" class="small">Dashed: not surveyed exterior walls.</text><text x="40" y="430" class="heading">The roof problem: cross-sections with unchanged wall bodies</text><text x="40" y="458" class="">G003: recorded gable</text><text x="395" y="458" class="">N3: proposed apartment roof</text><text x="750" y="458" class="">G001: recorded paired spans</text><rect x="40" y="541.0" width="128" height="84.0" fill="#b88569" stroke="#364c52" stroke-width="1.2"/><path d="M37.2 541.0L104 508.0L170.8 541.0Z" fill="#657785" stroke="#364c52" stroke-width="1.3"/><rect x="395" y="541.0" width="128" height="84.0" fill="#adc4b5" stroke="#364c52" stroke-width="1.2"/><rect x="395" y="537.4" width="128" height="3.6" fill="#657785" stroke="#364c52" stroke-width="1.2"/><path d="M395 541.0L459 542.6L523 541.0" fill="none" stroke="#364c52" stroke-width="1.3"/><rect x="750" y="569" width="160" height="56" fill="#b88569" stroke="#364c52" stroke-width="1.2"/><path d="M747.2 569L788.6 547.592L830.0 569L871.4000000000001 547.592L912.8000000000001 569Z" fill="#657785" stroke="#364c52" stroke-width="1.3"/><circle cx="200" cy="612.6" r="0.96" fill="#273e43"/><path d="M200 613.8v6.0m0 -5.2l-2.0 3.6m2.0 -3.6l2.0 3.6m-2.0 1.6l-1.76 5.2m1.76 -5.2l1.76 5.2" fill="none" stroke="#364c52" stroke-width="1.3"/><circle cx="555" cy="612.6" r="0.96" fill="#273e43"/><path d="M555 613.8v6.0m0 -5.2l-2.0 3.6m2.0 -3.6l2.0 3.6m-2.0 1.6l-1.76 5.2m1.76 -5.2l1.76 5.2" fill="none" stroke="#364c52" stroke-width="1.3"/><circle cx="935" cy="612.6" r="0.96" fill="#273e43"/><path d="M935 613.8v6.0m0 -5.2l-2.0 3.6m2.0 -3.6l2.0 3.6m-2.0 1