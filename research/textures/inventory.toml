# Texture inventory for the first style preset: present-day US Pacific Northwest.
#
# Each [[item]] is a surface the game needs a material for. `search.py` matches every item
# against the Poly Haven, ambientCG and cgbookcase catalogues and writes candidates.md and
# candidates.html. Edit this file, then rerun the script.
#
# Fields
#   group     Walls, Roofs, Openings, Streets, Land, Industrial, Wear, Construction, Vegetation
#   item      the surface, in plain words
#   serves    the game fact that puts this surface on screen. Drawing pillar 1.3 says every mark
#             reports a fact or is marked invented, so an item with no fact says "invented"
#   priority  1 = first test street and the far band; 2 = full coverage of today's kinds and
#             terrain; 3 = reserved states, props and polish
#   any       search terms; an asset matches when its name, tags or category contain one
#   all       optional terms the asset must also contain
#   not       optional terms that exclude an asset
#   notes     scale, colour or use constraints to check when choosing
#   shortlist optional "Source:asset id" picks that passed a thumbnail look; shown first
#   gap       optional; what the CC0 libraries lack and how to fill it
#
# Licence rule: commit only CC0 files. Poly Haven, ambientCG and cgbookcase are CC0.
# ShareTextures restricts redistribution and automated download, so it is excluded here.

# Walls

[[item]]
id = "W01"
group = "Walls"
item = "Horizontal lap siding, painted"
serves = "Dwelling families: post-war and older houses, the dominant PNW wall"
priority = 1
any = ["siding", "clapboard", "weatherboard", "wood planks painted", "painted wood"]
not = ["floor", "parquet"]
notes = "Board exposure 100 to 180 mm. Paint must divide out so the family colour shows through, like the masonry ratio in plans/0063"
shortlist = ["ambientCG:WoodSiding009", "ambientCG:WoodSiding005", "Poly Haven:brown_planks_07"]

[[item]]
