<!doctype html><html lang="en"><meta charset="utf-8"><title>Information interface — palette choices</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:28px;background:#e5e7e9;color:#263139;font:16px/1.45 system-ui,sans-serif}h1{margin:0;font-size:26px}p{margin:8px 0 20px;max-width:1100px}nav{display:flex;gap:12px;margin-bottom:20px}nav button{font:inherit;padding:8px 16px;border:1px solid #9ba4ac;background:white;border-radius:6px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.option>h2{font-size:20px;margin:0 0 4px}.description{font-size:14px;margin-bottom:16px;min-height:42px}.sample{font-size:calc(16px * var(--scale,1));border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);padding:20px;margin-bottom:20px;box-shadow:0 3px 10px #00000012}.sample.dark{margin-bottom:0}.mode{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}.identity{display:flex;justify-content:space-between;align-items:start}.eyebrow,.meta{font-size:.875em;color:var(--muted)}.title{font-size:1.375em;font-weight:650;line-height:1.3;margin-top:4px}.sub{margin-top:8px}.close{padding:5px 10px;border:1px solid var(--line);border-radius:5px}.section{border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:16px}.heading{padding:10px 12px;background:var(--section);color:var(--sectionInk);font-weight:600}.rows{padding:12px;background:var(--surface)}.row{display:flex;justify-content:space-between;gap:16px;padding:4px 0}.link{color:var(--active);text-decoration:underline;text-underline-offset:3px}.warning{margin-top:16px;border-left:4px solid var(--warn);background:var(--warning);padding:12px;color:var(--warnInk);border-radius:4px}.warning strong{display:block;margin-bottom:4px}.console{border-top:1px solid var(--line);margin-top:20px;padding-top:16px}.controls{display:flex;align-items:center;gap:8px}.control{border:1px solid var(--line);border-radius:5px;padding:6px 12px;background:var(--surface)}.active{background:var(--active);color:var(--onActive);border-color:var(--active)}.speed{padding-right:8px;font-weight:600}.pointer{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.legend{display:flex;gap:14px;margin-top:16px;font-size:14px;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;background:var(--active);border-radius:50%;margin-right:5px}.info{background:var(--sectionInk)}.warn{background:var(--warn)}
@media(max-width:1050px){.grid{grid-template-columns:1fr}.description{min-height:0}}body.only-light .dark,body.only-dark .light{display:none}
</style>
<h1>Three color directions for the information interface</h1>
<p>Same content, layout, spacing and three text sizes in every option. Each uses color for active controls, section headings and attention. Example readings are illustrative; these are design studies, not implemented menus.</p>
<nav><button onclick="document.body.className=''">Both themes</button><button onclick="document.body.className='only-light'">Light</button><button onclick="document.body.className='only-dark'">Dark</button><button onclick="document.body.style.setProperty('--scale','1')">100% type</button><button onclick="document.body.style.setProperty('--scale','1.18')">118% type</button><button onclick="document.body.style.setProperty('--scale','1.5')">150% type</button></nav>
<div class="grid" id="grid"></div>
<script>
const choices=[
{name:'A · Quiet teal',note:'Warm neutral surfaces, teal controls, soft blue headings. Color supports the reading without dominating it.',
light:['#f6f5ef','#ffffff','#233b39','#596b68','#cad4ce','#176c5d','#ffffff','#e4eef0','#315d70','#fbedd1','#926012','#694509'],
dark:['#202e2c','#263633','#eff4ed','#a8bcb4','#465b53','#9ad6bf','#18342b','#2c4048','#b2d4e6','#423b28','#edbf6c','#f1d8a0']},
{name:'B · Civic blue',note:'Cool slate surfaces and stronger blue section bands. The clearest separation between controls, sections and readings.',
light:['#f1f4f8','#ffffff','#243249','#5e6d82','#c4cfdf','#2458a3','#ffffff','#d9e6f7','#214e89','#fff0d6','#a36508','#714606'],
dark:['#202938','#273447','#eff3fb','#a8b8ce','#455976','#82b2ff','#172d50','#304968','#c1dafe','#473a25','#f2c06b','#ffe0a9']},
{name:'C · Warm ledger',note:'Cream or charcoal surfaces, plum headings and olive controls. A warmer, more distinctive tone with the same information roles.',
light:['#f8f1e7','#fffcf6','#40372f','#75685d','#d9c9b6','#536a3b','#ffffff','#eee0e7','#754860','#fae5d7','#a85226','#7f381c'],
dark:['#302a27','#3a322c','#f7efe3','#c3b2a1','#645449','#b7ca91','#2b3a20','#4e3945','#e5bbd2','#51362c','#efad83','#f8d0b4']}
];
const keys=['paper','surface','ink','muted','line','active','onActive','section','sectionInk','warning','warn','warnInk'];
for(const c of choices){const article=document.createElement('article');article.className='option';article.innerHTML=`<h2>${c.name}</h2><div class="description">${c.note}</div>`;
for(const mode of ['light','dark']){const card=document.createElement('section');card.className=`sample ${mode}`;keys.forEach((key,i)=>card.style.setProperty('--'+key,c[mode][i]));card.innerHTML=`<div class="mode">${mode} theme</div><div class="identity"><div><div class="eyebrow">BUILDING · 14</div><div class="title">Dwelling</div></div><span class="close">×</span></div><div class="sub">Occupied places <strong>3 / 3</strong></div><div class="warning"><strong>! Waiting for repairs</strong><span>Repair Goods have not reached this Building.</span></div><div class="section"><div class="heading">▾ Households</div><div class="rows"><div class="row"><span class="link">Household 27 →</span><span class="meta">2 Citizens</span></div><div class="row"><span class="link">Household 31 →</span><span class="meta">1 Citizen</span></div></div></div><div class="section"><div class="heading">▾ Building activity</div><div class="rows"><div class="row"><span>Upkeep</span><span class="meta">Waiting for supply</span></div></div></div><div class="console"><div class="controls"><span class="speed">1×</span><span class="control">◀◀</span><span class="control active">▶</span><span class="control">▶▶</span><span class="control">Layers ▾</span></div><div class="pointer">Dwelling · 2 Households · Waiting for repairs</div></div><div class="legend"><span><i class="dot"></i>Active / link</span><span><i class="dot info"></i>Section</span><span><i class="dot warn"></i>Attention</span></div>`;article.append(card)}document.getElementById('grid').append(article)}
</script></html>
