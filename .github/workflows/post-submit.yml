# The notifying lane. Nobody is waiting at this one, which is what makes an hour affordable --
# docs/adr/0121-the-commit-gate-is-the-assertion-tier-and-a-long-test-runs-post-submit-on-a-machine-that-is-not-yours.md
#
# WARNING, and it is the whole reason this file has a comment: a hosted runner is NOT the reference
# machine. Every timing figure in this corpus names a 2020 six-core i5-10400, powersave,
# single-threaded (adr/0106). This lane may report that an instrument BROKE or that something moved
# against its own history. It may NEVER supply a number that a document quotes -- producing a figure
# stays a deliberate act on the reference machine. See adr/0121 section 4.
name: post-submit

# ⚠ A scheduled workflow runs ONLY on the default branch, and it runs the copy of this file that
# lives there. So this lane does not exist until it is merged to `main`, and editing it on a branch
# changes nothing until that branch lands. workflow_dispatch is the only way to exercise it from
# anywhere else.
on:
  # ⚠ EVERY PUSH TO `main`, as of 2026-08-20 -- adr/0121's amendment. The daily window was set by how
  # long a regression may hide for; it was being set in practice by how long a developer was willing
  # to be blocked, and they were running the 36-minute suite LOCALLY to find out sooner. This lane is
  # notifying rather than blocking, so its cost is a runner-hour and not a developer-minute --
  # adr/0121 section 1's tax argument is about wall clock somebody is WAITING on, and nobody waits
  # here.
  push:
    branches:
      - main
  schedule:
    # 06:00 UTC daily, KEPT as the backstop. A repository with no pushes for a day still wants one
    # reading, and a scheduled run is what survives a branch being the only place work is happening.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      ticks:
        description: 'Ticks for the headless balance run'
        required: false
        default: '1000000'

# One run of this lane at a time, per branch, and a queued one supersedes the one behind it. Three
# pushes in five minutes want the result of the THIRD; running all three would spend three
# runner-hours to answer the same question, which is adr/0121 section 1's tax arriving on the runner
# instead of on the developer.
concurrency:
  group: post-submit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    runs-on: ubuntu-latest
    # The suite is 36m22s on the reference machine and this runner's class is unknown, so the
    # ceiling is generous rather than derived. The first green run is what replaces this guess.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      # Unfiltered: this is the run that includes the instruments, and including them is this
      # lane's entire purpose.
      - name: Whole suite
        run: dotnet test -c Release --no-build

  balance-run:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      # What this catches is a CRASH or a thrown invariant in a long play state -- not a trend.
      # "No collection and no magnitude trending upward at steady state" is asserted by
      # SaveLongRunTests inside the suite above; this run reaches further out in Ticks than any
      # test does and has no assertion of its own beyond the process surviving.
      #
      # A MILLION, which is what CLAUDE.md's Definition of done actually names. It started at
      # 100,000 because nobody had measured what a runner costs; the first dispatch did that job in
      # 5m04s end to end, of which roughly a minute is checkout, SDK and build. A million is
      # therefore an EXTRAPOLATION rather than a measurement -- call it half an hour -- and the run
      # that proves or refutes it is the next one. The 180-minute ceiling has room for being wrong
      # by a factor of five.
      - name: Headless balance run
        run: |
          dotnet run -c Release --no-build --project src/Borough.Headless -- \
            --ruleset rulesets/minimal.toml \
            --ticks ${{ github.event.inputs.ticks || '1000000' }}

      # ⚠ A SECOND BALANCE RUN, AND ON THE ONLY WORLD WHERE THE MAP LAYERS DO ANYTHING. The run above
      # is on minimal.toml, whose Rules emit nothing -- so its Cell table is EMPTY, land value is zero
      # everywhere, and it exercises none of milestone 9. rulesets/fouled.toml is the one shipped file
      # whose Rules emit, and it also carries [traffic] and [households], so it is the only long run
      # that reaches diffusion, the desirability composition and the land value lag at all.
      #
      # A tenth of the Ticks, because it is a far denser world than minimal.toml -- cars, congestion
      # and a diffused field on every land value cadence -- and because the class of regression it is
      # here for is a crash or a thrown invariant, which does not need a million Ticks to surface.
      - name: Headless balance run, on the world that emits
        run: |
          dotnet run -c Release --no-build --project src/Borough.Headless -- \
            --ruleset rulesets/fouled.toml \
            --citizens 4000 \
            --ticks 100000

      # ⚠ A THIRD BALANCE RUN, AND ON THE ONLY WORLD WHERE A TENANCY ENDS. The two runs above condemn
      # Buildings and end no tenancies at all: on both, the PREMISES' `upkeep` starves while the
      # tenants' `restock` keeps their larders full, so milestone 25's mechanism -- a failing tenant
      # losing its lease while the premises stand -- is not reached by either. minimal.toml measures
      # 2,610 condemned against 0 tenancies ended over ten Days. rulesets/evicted.toml is minimal.toml
      # with `restock` and `upkeep` deleted, which moves the failure from the premises to the tenant,
      # and measures 929 tenancies ended against 0 condemned.
      #
      # WHAT IT IS HERE FOR IS A COLLECTION RATHER THAN A CRASH, which makes it different in kind from
      # the two above. A tenant's Rule Instances and Bins live exactly as long as the tenancy
      # (adr/0141, milestone 25 task 2), and this file CYCLES by construction -- a tenancy ends, the
      # Household pools, placement rehouses it, it starves again -- so every turn of that loop creates
      # and destroys them. That is the per-tenancy allocation cycle this project did not previously
      # have, and adr/0006 is the question it has to answer.
      #
      # ⚠ THE RUNNER CANNOT ANSWER IT AND IS NOT ASKED TO. Nothing here reads the census, so this run
      # catches a crash or a thrown invariant like the two above and nothing more. The trend was
      # measured on the reference machine at 131,072 Ticks -- both allocators' slot counts flat at
      # 3,362 and 1,440 under ~1,900 tenancies ending per window -- and a runner is not that machine
      # (adr/0121). ***What this lane buys is that the world stays reachable***, so the next person to
      # take that measurement finds a file that still runs.
      #
      # A tenth of minimal.toml's Ticks, on fouled.toml's reasoning: the loop above turns over in
      # hundreds of Ticks, not hundreds of thousands.
      - name: Headless balance run, on the world where a tenancy ends
        run: |
          dotnet run -c Release --no-build --project src/Borough.Headless -- \
            --ruleset rulesets/evicted.toml \
            --citizens 4000 \
            --ticks 100000
