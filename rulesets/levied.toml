# THE LEVIED RULESET. It is founded.toml with one [[policy]] added, and it models no city either.
#
# Milestone 27 task 9 of plans/0041-the-business-is-a-thing-the-city-contains.md. Its whole job is to
# be THE FIRST SHIPPED FILE IN WHICH A RULE READS A BUSINESS. Every world before it could create a
# Business, capitalise it, tenant it and watch it leave, and NOTHING IN THE RULESET LANGUAGE COULD
# NAME ONE -- `sweeps = "business"` was refused at load with the sentence "a Business has a balance
# and no pass that moves it", and that refusal is what adr/0149 built.
#
# WHAT IS ADDED, AND IT IS FIVE LINES:
#
#   [[policy]]
#   name     = "trade_levy"
#   sweeps   = "business"
#   interval = 2048
#   apply    = { derived = "balance", percent = 1 }
#   transfer = { from = "local", to = "global", resource = "money", amount = 1 }
#
# ⚠ THAT IS DELIBERATELY household_levy WITH ONE WORD CHANGED. The two blocks sit next to each other
# in this file so the diff is the whole demonstration: a Policy's subject is a population, a balance
# is a Bin whoever holds it (adr/0114), and what the engine needs from a subject is a slot count, a
# liveness test and a balance Bin. ***The reason this was not built at milestone 10 task 5 is that
# there were no Businesses***, which is adr/0070 exactly -- an unbuilt mechanism rather than a
# refused one.
#
# ===========================================================================================
# 🔴 WHAT A RUN OF THIS FILE ACTUALLY SHOWS: A LEVY THAT REACHES PART OF WHAT IT SWEEPS.
#
# There are TWO KINDS OF BUSINESS in a world on this file and they are worlds apart in one quantity:
#
#   INSTANTIATED (adr/0148)   every dwelling declares `business = "shop"`, so construction creates
#                             one with the premises. It is capitalised by NOBODY and its balance Bin
#                             opens at ZERO, and it comes down with the premises.
#   FOUNDED (adr/0145)        a Household spent `founding_band` = 400 to open it. These are the only
#                             ones holding money, and the only ones that reach the unpremised pool.
#
# The levy is `derived = "balance"`, so a shop holding zero owes zero applications and the sweep
# passes over it -- which is PolicyEngine's own line about a Household with nothing, arriving on the
# other population. MEASURED at 2,000 Citizens over 6,144 Ticks: 302 live Businesses, of which 177
# hold money and 125 hold nothing. ⚠ SO `considered` EXCEEDS `applied` AND THAT IS THE FILE BEHAVING
# CORRECTLY. A reader who takes the gap for a defect has read `considered` as `eligible`.
#
# ⚠ THE SPLIT MOVES WITH THE RUN AND IS NOT A PROPERTY OF THIS FILE. Founded shops accumulate while
# instantiated ones come and go with their premises -- minimal.toml condemns every dwelling it raises
# -- so the founded share climbs while founding lasts. The figure above names its world and its Tick
# count for that reason. BusinessLevyTests asserts the SHAPE (some are passed over) and never the
# ratio.
#
# ⚠ WHAT BOUNDS THE SHOP COUNT HERE IS THE SOURCE EXHAUSTING AND NOT A SINK FIRING, and it is worth
# knowing before reading the stock as healthy. The give-up bound NEVER fires -- placement re-premises
# a pooled shop long before 30 Days elapse; measured 7,165 premisings and 0 give-ups over 131,072
# Ticks -- so what stops the count climbing is that founding is a MEANS TEST that runs out of means.
# ***THAT BOUND REOPENS THE DAY ANYTHING REFILLS HOUSEHOLD MONEY***, which is milestone 11's gate and
# milestone 26's revenue. `--business` is the picture and BusinessLongRunTests is the assertion.
#
# ***DO NOT QUOTE A COLLECTION FIGURE OUT OF A RUN OF THIS FILE AS ANYTHING ABOUT TAXING TRADE.*** A
# shop here has no revenue -- nothing trades, because Scope.Pool throws -- so its balance is its
# founding capital and nothing else, and a levy on capital-and-nothing-else is a levy on a stock that
# only ever shrinks. What this file demonstrates is that THE RULE CAN READ THE BUSINESS. What a trade
# levy should cost waits on a Business that earns, which is milestone 26.
#
# ===========================================================================================
# THE TWO NUMBERS ARE STOPWATCH SETTINGS AND NEITHER IS A DESIGN CLAIM.
#
#   percent  = 1      One-hundredth of a balance per application. Chosen an ORDER OF MAGNITUDE BELOW
#                     household_levy's 10 because a founded shop holds 400 and nothing refills it:
#                     at 10 the levy takes 40 a Day off a stock with no inflow and the shop is
#                     stripped before it gives up and departs, which would make the file a
#                     demonstration of the levy emptying its own subjects rather than of a Rule
#                     reading one. At 1 the shop is still solvent when it leaves.
#   interval = 2048   One Day, which is household_levy's, unchanged. The two Policies trigger on the
#                     same Tick ON PURPOSE: a Business levy and a Household levy landing together is
#                     what makes the ORDER of the two sweeps observable, and the order is the
#                     declaration order in this file.
#
# 🔴 BOTH ARE UNRATIFIED AND THIS FILE CAN RATIFY NEITHER, for the reason above: a Business with no
# revenue cannot say what a rate on its revenue should be. plans/0002 §D2 holds the row.
#
# Everything below this header is founded.toml unchanged, and its header follows. Read that one for
# what the rest of the file exists to show.
#
# ----------------------------------------------------------------------------------------------
# THE FOUNDED RULESET. It is taxed.toml with a trade to found and a channel that founds it, and it
# models no city either.
#
# Milestone 27 task 8 of plans/0041-the-business-is-a-thing-the-city-contains.md. Its whole job is to
# be THE FIRST SHIPPED FILE IN WHICH THE SIMULATION CREATES A BUSINESS. Every world before it ran with
# an empty `business` table from Tick 0 to the end -- World.CreateBusiness had no production caller at
# all -- so the economic actor this project has been describing since adr/0113 existed only in fixtures
# a test wrote by hand.
#
# WHY taxed.toml AND NOT minimal.toml. The founding channel is a MEANS test: a Household spends part
# of its own balance to capitalise a shop (adr/0145). On minimal.toml every Household holds EXACTLY
# ZERO, so the means test would refuse every candidate and the channel would be inert -- present,
# correct and invisible, which is the defect plans/0040 F43 closed milestone 25 on. taxed.toml is the
# only shipped file that puts money in Households, through [households] opening_balance_min/max.
#
# WHAT IS ADDED, and it is three tables:
#   [[business]] x2   the trades -- bakery and barber, adr/0141's own example, as tenanted.toml
#   [founding]        the channel: what a founder spends, and how often each Household considers it
#   gives_up_after_days on [placement]  THE SINK, and it is REQUIRED here rather than optional
#
# ⚠ THE SINK IS NOT DECORATION AND THE LOADER REFUSES THE FILE WITHOUT IT. [founding] is an inflow
# into the unpremised pool, and without a give-up bound a shop nothing tenanted would sit in that pool
# for ever, which adr/0006 forbids. adr/0130 made this argument for the Unplaced Pool and a gate; it is
# the same sentence about the other pool.
#
# ⚠ AND IT HAS NEVER FIRED. This paragraph said "NOTHING TENANTS A BUSINESS YET -- the placement half
# is milestone 27's remaining work", and adr/0147 shipped that half inside the same milestone. Over
# 131,072 Ticks: 7,165 premisings and ZERO give-ups, because placement finds a pooled shop premises
# long before 30 Days elapse. ***THE LOADER STILL REQUIRES THE BOUND AND SHOULD***: what makes a sink
# mandatory is that the pool has an inflow, not that anything has reached the bound yet -- a world
# where placement cannot keep up is a world this file could produce tomorrow.
#
# ===========================================================================================
# 🔴 WHAT A RUN OF THIS FILE ACTUALLY SHOWS. ⚠ CORRECTED 2026-08-24 BY MILESTONE 27 TASK 10 --
# THIS HEADER DESCRIBED A LEAK, THE LEAK WAS REAL, AND IT WAS A DEFECT RATHER THAN THIS FILE.
#
# What it said: nothing tenants a Business, so every shop founded here waits out gives_up_after_days
# and DEPARTS, exporting its balance through the Hinterland -- household money in, shop, out of the
# city. It named that the steady state and said the header would need rewriting the day the placement
# half shipped. BOTH HALVES OF THAT TURNED OUT WRONG, in opposite directions:
#
#   1. THE PLACEMENT HALF HAD ALREADY SHIPPED. adr/0147, in this same milestone, tenants a pooled
#      Business on the same pass that houses a Household. Measured over 131,072 Ticks at 2,000
#      Citizens: 7,165 premisings and ***ZERO give-ups***. Placement re-premises a pooled shop long
#      before 30 Days elapse, so the sink this header called the steady state HAS NEVER ONCE FIRED.
#
#   2. THE DRAIN IT DESCRIBED WAS HAPPENING ANYWAY, FOR ANOTHER REASON, AND WAS A BUG. adr/0148 had
#      demolition raze "the trade this kind came with" and identify it BY KIND -- and [founding] draws
#      uniformly over every declared trade, so a founded `shop` sat in a dwelling beside the
#      instantiated `shop` and got razed in its place, exporting its 400 through Raze's money-supply
#      write. 23,983 of 354,562 left the city per 20,480 Ticks. adr/0148 is amended and the supply is
#      now FLAT over the same window.
#
# ⚠ THE LESSON IS WORTH MORE THAN THE CORRECTION: A HEADER THAT PREDICTS A LEAK WILL BE BELIEVED BY
# THE NEXT PERSON WHO MEASURES ONE. This file's own prose is why the drain went unexamined for a day --
# somebody looked at a contracting money supply, found a paragraph saying the contraction was on
# purpose, and stopped. ***Naming an expected symptom is how you stop noticing the unexpected one that
# looks identical.***
#
# SO WHAT A RUN ACTUALLY SHOWS is a city that founds shops until it runs out of Households that can
# afford one, tenants nearly all of them, and conserves its money. The bound on the shop count is the
# SOURCE EXHAUSTING rather than any sink firing -- every founding moves money out of a Household and
# employs a Citizen, so each one makes the next less likely. ⚠ THAT BOUND REOPENS THE DAY ANYTHING
# REFILLS HOUSEHOLD MONEY, which is milestone 11's gate and milestone 26's revenue.
#
# ⚠ SO DO NOT QUOTE A MONEY FIGURE OUT OF A RUN OF THIS FILE as anything about the economy. The only
# thing it measures is a means test running out of means.
#
# ===========================================================================================
# THE TWO NUMBERS ARE STOPWATCH SETTINGS AND NEITHER IS A DESIGN CLAIM.
#
#   founding_band    = 400     Households open uniform on [0, 1000], so about 60% can afford one at
#                              Tick 0. Chosen to make the MEANS TEST DISCRIMINATE -- at 0 everybody
#                              founds and the test does nothing (the loader refuses 0 for that
#                              reason); at 1001 nobody ever founds and the channel is inert again.
#                              A value where some can and some cannot is the only kind that shows the
#                              mechanism at all.
#   reconsider_ticks = 8192    Four Days. How long every Household takes to consider founding once.
#                              Set so that foundings are visible in a run somebody will sit through,
#                              which is crowded.toml's stated philosophy for the same job.
#
# 🔴 BOTH ARE UNRATIFIED AND THIS FILE CAN RATIFY NEITHER. plans/0002 §D2 holds the row and names what
# would settle them. A world in which every shop founded then emigrates cannot tell you what a shop
# should cost to open -- the quantity means nothing until a shop can trade, which is milestone 26.
#
# ⚠ THE TRADE IS DRAWN UNIFORMLY over the two declared, which is a decision and not a default
# (PurposeTag.FoundingTrade): a [[business]] declares nothing but its name at task 8, so there is no
# margin and no wage to prefer one over the other, and anything but uniform would be a preference
# nobody argued for.
#
# Everything below this header is taxed.toml unchanged, and its header follows. Read that one for
# what the rest of the file exists to show.
#
# ----------------------------------------------------------------------------------------------
# THE POLICY RULESET -- minimal.toml with money in the city and a circuit that moves it.
#
# ===========================================================================================
# WHY IT EXISTS. Milestone 10 task 5 built the Sweep family's second member: a Policy triggers on an
# interval, sweeps a whole population and moves money between one Bin and another (02 section 4.2).
# MINIMAL.TOML CANNOT DEMONSTRATE IT, and not for want of a table -- every Household in a world on
# that file holds EXACTLY ZERO, because adr/0024 makes the Outside Connection money's only source and
# that is milestone 11. A tax over a city of paupers collects nothing, a transfer pays nothing, and a
# conservation assertion over it holds vacuously. This is the file that circuit is for. It is
# severance.toml's, congested.toml's and diagnosed.toml's precedent exactly, for their reason: a
# mechanism minimal.toml structurally cannot demonstrate needs a file where it does.
#
# IT IS VERBATIM AND APPENDS THREE TABLES. severance.toml and congested.toml keep minimal.toml
# unchanged and append; diagnosed.toml edits one Rule in place and says why. This one appends and
# changes nothing: a [households] table and two [[policy]] tables, marked ADDITION 1 OF 3 through
# 3 OF 3 where they sit. Every Rule, kind, Bin and Resource above them is minimal.toml's, unedited.
#
# ===========================================================================================
# WHERE THE MONEY COMES FROM, AND WHY IT IS A BAND RATHER THAN A FIGURE.
#
# [households] opening_balance_min/max is read by Borough.Core.Entities.SyntheticCity, which is
# reached only by CommandKind.Populate -- a verb no player has (adr/0090's generator/player line).
# It is the ONLY production issuance of money in the build and it is fixture content, not a founding
# balance: adr/0116 deferred THAT for want of a denominator, and this is the populator that already
# invents Households, Buildings and Lots from nothing doing the same thing with their pocket money.
# It goes through World.Endow, which records it in MoneySupply.Issued, so conservation stays exactly
# checkable ACROSS the issuance rather than in spite of it.
#
# A BAND IS WHAT MAKES adr/0115'S INSTRUMENT READABLE AT ALL. That ADR's concern is that
# FloorDiv(readout x percent, 100) is zero below 100/percent, so a percentage tax collects nothing
# from the poorest and the stated rate from everybody else -- a REGRESSIVE outcome produced by
# rounding, in the mechanic adr/0024 requires the game take no position on. It is a DISTRIBUTIONAL
# artefact, so a city where everybody opens with the same figure reads 0% or 100% and measures
# nothing. Uniform over the band, with no shape parameter: a real wealth distribution is skewed and
# a skew is a second decision with a number in it that nothing has measured (adr/0052).
#
# ===========================================================================================
# THE CIRCUIT, AND EVERY NUMBER IN IT IS DERIVED RATHER THAN CHOSEN EXCEPT ONE.
#
#   interval = 2048 on both        one Day. Ticks.PerDay, so it is derived -- 02 section 4.2 makes
#                                  the interval a balance constant ("a Policy paying daily is a
#                                  different city from one paying weekly"), and a Day is the period
#                                  the rest of the simulation is denominated in. Same argument as
#                                  adr/0059's revisit_ticks default, which ships unratified for the
#                                  same reason: there is no free parameter to ratify.
#
#   percent = 10 on the levy       THE DESIGN'S OWN FRACTION. adr/0115 derives money's unit from the
#                                  smallest fraction the design multiplies by, and finds 10% in both
#                                  existing sites -- 02 section 5.6's tatonnement clamp and 02
#                                  section 4.1's apply count. Using it here makes this file's
#                                  flooring threshold EXACTLY that ADR's floor of ten smallest units,
#                                  so the counter reads the discipline rather than a number chosen
#                                  beside it.
#
#   amount = 100 on the rebate     THE ONE CHOSEN NUMBER, and it is chosen to make a branch
#                                  reachable rather than to model anything. See below.
#
#   opening band 0..1000           MEASURED. See the sweep below.
#
# ===========================================================================================
# WHY THE REBATE IS BIGGER THAN THE LEVY, WHICH IS DELIBERATE AND IS THE POINT OF THE FILE.
#
# 02 section 4.2: "A Policy paying out of a treasury that runs dry pays whom it reaches and reports
# where it stopped." adr/0116 chose an EMPTY opening treasury partly to make that branch reachable
# on the first sweep rather than after a long run somebody constructs -- and an empty treasury alone
# does not reach it, because the levy declared above the rebate funds it on the same trigger. What
# reaches it is a rebate the levy cannot cover.
#
# At a mean opening balance of 500 the levy takes about 50 a Household a Day and the rebate owes 100,
# so the treasury runs dry about halfway through every sweep. THAT IS WHAT THE SCAN ROTATION IS FOR:
# under a fixed order the same low-index Households would be paid for the life of the city and the
# tail never, which is the permanent boundary 02 section 4.2's rotation exists to prevent. With the
# rotation it is a gradient, and `sweeps run dry` in --census counts the event.
#
# A CITY THAT PAYS EVERYBODY WOULD DEMONSTRATE LESS, not more: the exhaustion branch would never run
# and the rotation would be decoration.
#
# ===========================================================================================
# WHAT THE CIRCUIT DOES TO THE CITY, WHICH IS THE THING TO WATCH.
#
# A PROPORTIONAL LEVY WITH A FLAT REBATE DRIVES EVERY BALANCE TOWARD THE SAME FIGURE. Take is 0.1b
# and the expected payment is flat, so a Household above the crossing point loses and one below it
# gains, and the distribution collapses toward the mean. The total never moves -- money is conserved
# and this file has no gate -- so what changes is only the SPREAD.
#
# That has a consequence for adr/0115's instrument and it runs in the helpful direction: the rebate
# lifts the poorest OUT of the flooring band, so `floored to zero` is largest on the first sweeps and
# falls. ***A transfer cures the rounding artefact a levy produces***, which is not a claim anybody
# made in advance and is visible in --census in a run of a few Days.
#
# ===========================================================================================
# IT IS A DEMONSTRATION, NOT A CITY. minimal.toml's first line says it models no city and every word
# of that survives here. There is no wage, no price, no rent and nothing to buy, so a balance is a
# number that goes up and down and buys nothing -- which is exactly the state milestone 10 is for:
# the circuit that needs neither a price nor a wage. What a rate should be, who should be exempt and
# what the money is for are content questions for a Ruleset that models a city, and no such Ruleset
# exists yet.
#
# ===========================================================================================
# The minimal Ruleset. It models no city, and it is not the beginning of one.
#
# Slice 7 task 10a of plans/0011-rule-engine-bins-and-rules.md. Its whole job is to be the smallest
# content that makes Bins move, so that the wiring underneath it — a Ruleset reaching a World, a
# Building given its kind's Bins and Rule Instances when it is built, an arming stagger — is exercised
# by a running city rather than by a test that builds the same shape by hand.
#
# WHY IT NAMES NO GOOD. 04 §1's five Goods are Produce, Food, Timber, Materials and Consumer Goods,
# and every one of them is produced by one Building and consumed by another. That crosses an ownership
# boundary, which is the `pool` scope, which is a named hole that throws until Phase 2 brings roads,
# Districts and connectivity. So a Ruleset that could run today and also name a Good would be claiming
# a chain it cannot express. `sundries` is deliberately a word for goods too unimportant to name:
# nothing in this file should be read as a decision about content. Choosing the Goods is decision
# owed 4, and it belongs to task 10b with the chain it is for.
#
# WHY THERE IS NO on_fail CHAIN. A link rescues by relieving the Bin the head failed on, from a source
# the head could not reach. Every source available today is the Building's own Bins, so a chain here
# would be a Rule rescuing itself. adr/0045's ladder starts at the District Pool, and that is task 10b.
#
# WHY IT EMITS NO POLLUTION. Not because it would be unbounded — adr/0051's decay is built, so a `map`
# term is now a stock the environment absorbs and settles at a level proportional to the emission rate.
# It emits nothing because a dwelling is not industry. `02 §2.4` gives industrial pollution point
# sources, and inventing a smokestack here to exercise a code path would be this file claiming
# something about content, which its first line says it does not. The Rule engine's `map` output is
# covered by `RuleEvaluationTests`, and the absorption by `LayerFieldsTests` and `LayerLongRunTests`.
#
# THE GOODS QUANTITIES AND THE BIN CAPACITIES BOTH x4 ON 2026-08-13, AND IT CHANGED NOTHING THIS CITY
# DOES. adr/0094 took TICKS_PER_DAY from 8192 to 2048 and says the Goods quantities scale x4: a Day
# holds a quarter as many firings, so a per-firing `amount` goes x4 to keep the rate in Goods per Day.
# That is airtight and it is only half the edit -- the capacities had to follow, and they follow for a
# DIFFERENT reason, which is the part worth reading.
#
# `amount` AND `capacity` ARE BOTH IN GOODS AND THEY ARE DENOMINATED DIFFERENTLY. `amount` is
# Days-denominated: hold Goods per Day, so the number moves x4. `capacity` is TICKS-denominated: what
# has to hold is FIRINGS HELD -- capacity / (amount x occupants) -- and firings x rate is a DURATION.
# It is written in Goods, so keeping that duration still REQUIRES moving the number, and it moves x4
# only because `amount` did. THE UNIT OF A QUANTITY IS NOT ITS DENOMINATION.
#
# WHAT KEEPING capacity = 12 WOULD HAVE DONE. The larder would have held ONE firing of `consume` where
# it held four. In in-world time the two read identical -- 22.5 minutes of supply either way -- so
# measured in Goods nothing is wrong. Measured in firings held, every Bin in the game shrank by four,
# and a Bin that must be EXACTLY FULL for one `consume` to succeed is a knife edge. It fired
# Invariant.WaiterIsBlockedByTheBinItNames and exposed a live defect in the wake path, filed unfixed as
# plans/0003 queue item 8.
#
# IT IS BEHAVIOUR-NEUTRAL, MEASURED, AND THE COMMIT FIRST CLAIMED OTHERWISE. Running the pre-rescale
# file and this one for 4,096 Ticks gives a BYTE-IDENTICAL 86-line census -- buildings 1,201 -> 642, the
# Unplaced Pool, rule evaluations, Trips, every row. Only the State Hash moved, because Bin levels are
# four times larger. The commit said "a dwelling now holds 90 in-world minutes where it held 22.5, which
# is a change to the world": the digits are right and the comparison was never stated. The larder is
# 4 firings x rate 32 = 128 TICKS, and it was 128 Ticks before the clock moved too. 90-vs-22.5 is HEAD
# against the PRE-CLOCK world, which is adr/0094's cost arriving in one more place, not this edit's.
# plans/0012 Cause 5: a number that is one half of a ratio says which half.
#
# NOTHING HERE CAME OUT OF PROPORTION, because everything in this file is denominated in FIRINGS.
#
# 48 IS A COST DIAL HERE, NOT A BALANCE DIAL, AND THAT IS MEASURED TOO. Swept at 24, 36, 48 and 96, NO
# ROW OF THE CENSUS MOVES; only `rules due` and `rules evaluations` move, and they move UP with capacity
# (20,134 -> 25,023 at the first reading, 48 -> 96), because a deeper larder gives `restock` more
# space to keep working. A BIGGER BUFFER COSTS MORE, NOT LESS. The larder decides nothing because it
# is DEEPER THAN THE BUILDING'S LIFESPAN: nothing in this file produces `repairs`, so `upkeep` condemns
# every dwelling at 64 Ticks and a 128-Tick larder absorbs a shock that never arrives. Restoring 22.5
# in-world minutes would need 2 firings held -- one above a known crash -- or `consume`'s rate quartered,
# which adr/0094 refused on cost. And 22.5 WAS NEVER CHOSEN: it is `capacity = 12` in a file whose first
# line says it models no city (adr/0070).
#
# THE STEADY STATE IS THE POINT, AND IT IS A SURPLUS ONE. Production outruns consumption, so the Bin
# sits near its ceiling and `restock` is the Rule that fails: it sleeps on space, `consume` draws
# and wakes it, it refills and sleeps again. Both Rules move for ever, nothing trends, and no Rule is
# ever wrongly asleep. THE SHORTAGE REGIME IS NOT AVAILABLE AND THAT IS AN ENGINE PROPERTY RATHER THAN
# A TASTE: a recorded shortfall is a deficit at the instant of failure and the wait list wakes on the
# arriving quantity, so a consumer short of 3 is never woken by three arrivals of 1. Producing in a
# quantum at least as large as any consumer's deficit is what makes this file's steady state honest.
# See finding 41.
#
# WHY EVERY DWELLING FALLS DOWN, AND WHY THAT IS NOT A BALANCE MISTAKE. Slice 10 task 7 needs a
# Building that is *continuously* starved, because failure pressure is a duration and a Rule that is
# rescued resets it (adr/0053). Nothing in this file could supply one: the only Rule that fails here
# is `restock`, and it fails on SPACE — the Bin is full, which is the healthy state of a producer
# with nobody to sell to, and the amended adr/0053 reads only starvation. So `upkeep` was added, and
# it draws on a Resource this file deliberately never produces. Every dwelling therefore declines,
# which is total rather than selective because there is one kind and it has one behaviour. A city
# where some Buildings thrive and others do not needs Buildings that differ, which needs content, and
# content is what the first line of this file says it is not. The cycle it does produce is real: a
# condemned dwelling is demolished, its Households go to the Unplaced Pool, its Lot goes vacant, and
# the [[zone_rule]] below raises another — which is the first time anything in this project has both
# built and unbuilt, and the first time slice 5 task 7's `slots` assertion has had a table that churns.
#
# It is deleted rather than grown when task 10b becomes possible.

# The keys below are minimal.toml's and its comments carry their arguments -- read them there.
# What is commented HERE is what this file changes and why.

[[resource]]
name = "sundries"
family = "good"

[[resource]]
name = "repairs"
family = "good"

[[resource]]
name = "money"
family = "money"

[[business]]
name = "shop"
jobs = 8
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[building]]
name = "dwelling"
bins = [
    { resource = "sundries", capacity = 48, owner = "occupant" },
    { resource = "repairs",  capacity = 4 },
]
occupants = 4
business = "shop"

[[rule]]
name    = "restock"
kind    = "dwelling"
rate    = 8
apply   = { min = 1, max = 4 }
inputs  = []
outputs = [ { scope = "local", resource = "sundries", amount = 4 } ]

[[rule]]
name    = "consume"
kind    = "dwelling"
rate    = 32
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "sundries", amount = 4 } ]
outputs = []

[[rule]]
name    = "upkeep"
kind    = "dwelling"
rate    = 16
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "repairs", amount = 4 } ]
outputs = []

[[zone_rule]]
name          = "housing"
kind          = "dwelling"
zone          = 0
interval      = 32
revisit_ticks = 2048

[placement]
interval      = 32
revisit_ticks = 1024
candidates    = 3
# ADDITION 3 OF 3 -- THE SINK, and the loader refuses this file without it. See the header: [founding]
# is an inflow into the unpremised pool and nothing tenants a Business yet, so a bound is what keeps
# adr/0006 satisfied. It is [placement]'s key because adr/0144 has a Business SHARE the Household's
# bound as a declared stand-in rather than author a second one nothing can ratify.
gives_up_after_days = 30
# ADDITION 1 OF 3 -- THE TRADES. adr/0141's own example, and the same two tenanted.toml names. Two
# rather than one because a single trade could not show that the choice is drawn at all.
#
# BOTH EMPLOY SOMEBODY AND THE LOADER REFUSES THIS FILE OTHERWISE. adr/0146: a founder becomes their
# Business's first worker, which is the whole of the labour cost milestone 27 ships -- so a trade
# nobody can work at is a trade nobody can found. The trade is drawn UNIFORMLY, so it is every
# declared one rather than at least one.
#
# THE NUMBERS ARE THE DWELLING'S OWN AND ARE NOT A SECOND CLAIM. Eight is what `shop` above declares,
# derived from the row ratios; the band 6-10 is the same ordinary spread of opening times. A founded
# shop that employed a DIFFERENT number from the shop a dwelling comes with would be asserting
# something about scale that nothing in this file measures.
#
# ⚠ THREE IS DELIBERATE ON `barber` and it is the one number here that is not a copy: a trade the city
# founds and a trade the city is built out of do not have to be the same size, and a file in which
# every trade employs eight could not show that the ceiling is read per trade at all.
[[business]]
name                      = "bakery"
jobs                      = 8
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[business]]
name                      = "barber"
jobs                      = 3
shift_start_earliest_hour = 9
shift_start_latest_hour   = 9
# ADDITION 2 OF 3 -- THE CHANNEL. adr/0145 and its amendment. There is no demand key here and that
# absence IS the decision: a Household founds on its own MEANS and never on the city's NEED, so
# nothing in this table reads shop count, vacancy or anything unsold.
[founding]
founding_band    = 400
reconsider_ticks = 8192

[layers]
noise_range_metres            = 300
noise_intensity_percent       = 400
desirability_pollution_percent = 100
desirability_noise_percent     = 100
pollution_period      = 64
pollution_offset      = 0
land_value_period     = 256
land_value_offset     = 16
kernel_metres         = 1024
pollution_decay_ticks = 2048
land_value_tau        = 8

[roads]
block_tiles                    = 32
arterial_count                 = 0
arterial_junction_tiles        = 512
foot_crossing_every            = 4
foot_paths_per_thousand_blocks = 40
street_speed_kph               = 50
arterial_speed_kph             = 90
walk_speed_kph                 = 5
street_capacity_per_hour       = 3600
arterial_capacity_per_hour     = 12000
foot_path_capacity_per_hour    = 1000

[lots]
lots_per_segment = 5

[trips]
crossing_seconds = 30
commute_fast_minutes = 20
commute_moderate_minutes = 40
commute_budget_minutes = 50

[jobs]
interval      = 32
revisit_ticks = 1024
candidates    = 3
shift_hours_min = 6
shift_hours_max = 10
arrive_early_max_minutes = 15
# ===========================================================================================
# ADDITION 1 OF 3 -- the money in the city. Nothing above this line moved.

[households]
# NOBODY DRIVES, which is minimal.toml's own state said out loud rather than by omission. The table
# has to exist to carry the two keys below and car_ownership_percent is required inside it, so 0 is
# the value that leaves this file behaving exactly as minimal.toml does. adr/0098: 0 is a legitimate
# city -- one before the motor car -- and is not a placeholder.
car_ownership_percent = 0
# WHAT A HOUSEHOLD IS FOUNDED WITH, drawn uniformly per Household at creation and issued through
# World.Endow. See the header for why this is fixture content rather than adr/0116's deferred
# founding balance, and why it is a band.
#
# THE FLOOR IS ZERO ON PURPOSE. A Household that opens with nothing is a Household the levy takes
# nothing from and the rebate lifts, which is the first thing worth watching in this circuit -- and
# it is what makes `floored to zero` read non-zero on the first sweep instead of being a counter
# nobody has ever seen fire.
opening_balance_min = 0
opening_balance_max = 1000
# ===========================================================================================
# ADDITION 2 OF 3 -- the levy. DECLARED FIRST, and the order is load-bearing: a Policy acts where it
# runs (there is no proposal and no settle), so the levy declared above the rebate funds it on the
# same trigger. The same pair in the other order pays out of last Day's remainder.

[[policy]]
name = "household_levy"
sweeps = "household"
interval = 2048
apply = { derived = "balance", percent = 10 }
transfer = { from = "local", to = "global", resource = "money", amount = 1 }
# ===========================================================================================
# ADDITION 3 OF 3 -- the rebate. A FLAT amount, which CONTEXT -> Policy prefers against because a
# flat amount goes stale as the economy grows. It is flat here anyway and the reason is that the
# alternative is worse: a percentage paid OUT of a balance pays the rich most, which is a mechanic
# nobody would author. What CONTEXT actually asks for -- a percentage of gross income below a line --
# needs an income (milestone 15) and a poverty line (a hash-bearing number with no ratifier), and
# adr/0070 says the answer to an unbuilt mechanism is to build it rather than to approximate it.

[[policy]]
name = "household_rebate"
sweeps = "household"
interval = 2048
apply = { min = 100, max = 100 }
transfer = { from = "global", to = "local", resource = "money", amount = 1 }
# ===========================================================================================
# THE ADDITION, AND IT IS THE ONLY LINE IN THIS FILE THAT IS NOT founded.toml'S.
#
# adr/0149, milestone 27 task 9. Compare it against household_levy fifteen lines up: `sweeps` and
# `percent` differ and nothing else does. ⚠ IT IS DECLARED LAST rather than beside its twin because
# declaration order is sweep order within a Tick and therefore hash-bearing -- putting it in the
# middle would move the two Household Policies relative to each other for no reason at all.

[[policy]]
name = "trade_levy"
sweeps = "business"
interval = 2048
apply = { derived = "balance", percent = 1 }
transfer = { from = "local", to = "global", resource = "money", amount = 1 }
