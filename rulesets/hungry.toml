# The hunger Ruleset. It models no city, and it exists to make ONE THING VISIBLE.
#
# `evicted.toml` WITH `[needs]` AND ONE KEY ON ONE RESOURCE, and that diff is the whole content.
# `sundries` declares `need = "sustenance"`, so the Good the tenant's `consume` Rule draws is now a
# Good that feeds a Need -- and `[needs]` says how far the Need moves when an occasion fails and when
# one is met.
#
# WHAT IT EXISTS TO SHOW: adr/0103's accumulator, running. A Household's Sustenance is a RELATIVE
# SCALAR WHERE 0 IS IDEAL and negative values are deficit (CONTEXT.md -> Need, 04 section 2); it falls
# while unmet and recovers when met, so -- 04 section 6 step 6 -- "a dry afternoon and a dry month are
# one mechanism at two depths, and nothing else in this chain has to remember anything."
#
# ⚠ IT IS BUILT ON `evicted.toml` FOR A REASON AND NOT FOR CONVENIENCE. `restock` is deleted here as
# it is there, so the larder is filled by nothing and `consume` starves -- which is the only way any
# shipped world produces a FAILED OCCASION for a Household at all. On `minimal.toml` `consume` always
# succeeds, so the Need would sit pinned at 0 for the length of any run and the mechanism would be
# present, correct and invisible. ***A file that demonstrates an accumulator has to be able to fail.***
#
# ⚠ AND IT RECOVERS, WHICH IS THE HALF A ONE-POLE WORLD CANNOT SHOW. `evicted.toml` cycles by
# construction: a tenancy ends, the Household goes to the Unplaced Pool, placement rehouses it in a
# standing Building whose Bin still holds stock, and `consume` fires again. So Sustenance falls to the
# floor, the tenancy ends, and the rehoused Household climbs back toward zero. Both directions of the
# scalar are reachable in one run, which is what this file buys over its parent.
#
# 🔴 EVERY NUMBER IN `[needs]` IS PROVISIONAL AND WAS CHOSEN BY TASTE. plans/0045 standing order 4
# suspends adr/0052 for the amnesty, so there is no ratifier and no plans/0002 section D row. adr/0102
# authorises no number and never did: what the corpus specifies is the REPRESENTATION and the TRIGGER,
# and it stops there. THE NUMBERS THIS FILE PRODUCES RATIFY NOTHING.
#
# ⚠ THE OCCASION IS A RULE FIRING AND NOT YET A SHOPPING TRIP. 04 section 6 step 4 makes the attempt a
# Trip to one entry on a Provider List (adr/0067), and none of that is built -- no Provider List, no
# per-occasion cursor, and therefore none of the LAG that ADR describes as realism. What is built is a
# Household Rule drawing a Good from its own Bin and failing on supply, which is the same shape: a
# real attempt that really failed. When the Trip ships it replaces the call site and the accumulator
# does not change. ***Do not read a rate off this file and call it shopping.***
#
# ⚠ NOTHING READS THE NEED YET. The reader is 02 section 5.4's comparison against a Hinterland --
# adr/0102's housed Departure, milestone 19 -- and the utility aggregation form is itself still open
# (02 section 5.4 files additive against multiplicative). So a Household here starves to the floor and
# never leaves over it, and that is a missing READER rather than a broken accumulator.
#
# ⚠ TWO OF THE FOUR NEEDS ARE ABSENT AND THAT IS A DECISION. adr/0103 closes the set at Sustenance,
# Satisfaction, Education and Health, and says of the last two that a degradation rule for them is
# "owed and is deliberately UNDESIGNED" -- they are consumed by attending rather than by buying. They
# are undesigned rather than refused (adr/0070), so NOTHING MAY BE REASONED FROM THEIR ABSENCE HERE.
# The loader refuses them by name and says so.
#
# ⚠ SATISFACTION IS DECLARED IN `[needs]` AND FED BY NOTHING IN THIS FILE. There is no Consumer Goods
# Resource here, so its rates are stated and never exercised -- the table requires all four keys
# because a stated table states its keys, and a defaulted rate is a hash-bearing number nobody chose.
# A world that exercises both Needs wants a second Good and is not this file.
#

# The keys below are minimal.toml's and its comments carry their arguments -- read them there.
# What is commented HERE is what this file changes and why.

[needs]
# How far a Need moves on one occasion, and how deep it may go. All five keys are REQUIRED of a file
# that states this table, on [market]'s and [districts]' rule: a stated table states its keys.
#
# 🔴 A DEGRADE IS A RATE PER DAY; A RECOVER IS A STEP PER OCCASION. The first build charged both per
# occasion, and a blocked Rule has exactly ONE -- RuleEngine.Stop sleeps it on the Bin until that Bin
# changes -- so a dry afternoon and a dry month read the same depth. A shortage is a STATE and only a
# duration measures it; a meal is an event. adr/0053 found this for the Building; this is it arriving
# at the Household.
#
# ⚠ EVERY STEP IS POSITIVE AND THE DIRECTION IS THE MECHANISM'S. A degrade always falls and a recover
# always rises, so a sign here would be a second, contradictable spelling of what the code already
# knows. The loader refuses zero and negatives and says why.
#
# 🔴 SUSTENANCE FALLS FASTER THAN IT CLIMBS, AND THAT ASYMMETRY IS THE ONLY DELIBERATE SHAPE IN THIS
# TABLE. 04 section 1: "Food fails fast and hard. A daily Need, and unmet Sustenance degrades a
# Household quickly. This is the chain that produces crises." Four a Day down against one a meal up.
# The 4:1 is chosen by taste and ratifies nothing.
sustenance_degrade = 4
sustenance_recover = 1
# And Satisfaction the other way about -- "Consumer Goods fail slowly and softly. Unmet Satisfaction
# erodes over Days and eventually produces a housed Departure. This is the chain that produces
# decline." Slower to lose and no harder to regain. ⚠ NOTHING IN THIS FILE FEEDS IT; see the header.
satisfaction_degrade = 1
satisfaction_recover = 1
# 🔴 THE FLOOR IS REQUIRED AND IT IS NOT A TUNING CONVENIENCE. A Need that fell for ever would be a
# magnitude trending downward at steady state, which is adr/0006 as adr/0003 extends it to quantities
# -- the one invariant a 100k-Tick run exists to catch. It would fail on this Need rather than on this
# file, in some later milestone, for a reason nobody would look here for.
#
# ⚠ IT IS A DEPTH AND NOT A THRESHOLD. adr/0102 is explicit that there is no threshold under a Need: a
# Household leaves by COMPARISON, and a duration crossing a line is adr/0053's Failure Pressure, the
# BUILDING mechanism, which exists because abandonment has no actor. A Household has one. So this
# number says how destitute a Household can get and says nothing whatever about what it then does.
floor = -1000

[[resource]]
name = "sundries"
family = "good"
# 04 section 1 pairs the Good with the Need. This one key is what makes every `consume` firing and
# every `consume` starvation a shopping occasion for Sustenance.
need = "sustenance"

[[resource]]
name = "repairs"
family = "good"

[[resource]]
name = "money"
family = "money"

[[business]]
name = "shop"
jobs = 8
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[building]]
name = "dwelling"
bins = [
    { resource = "sundries", capacity = 48, owner = "occupant" },
    { resource = "repairs",  capacity = 4 },
]
# HOW MANY DAYS A TENANT'S OWN RULE MAY STARVE CONTINUOUSLY before the tenancy ends and the
# Household is unplaced. adr/0141's TENANT half, and this file is the only shipped world that
# states it.
#
# !! THIS KEY DID NOT EXIST UNTIL MILESTONE 17, AND ITS ABSENCE IS WHAT BROKE THIS FILE. One key --
# `condemn_after` -- armed BOTH verdicts: the premises' and the tenant's. So when decline was
# stripped out of every world that demonstrates something else, this world lost its tenancy churn
# with it, and the ONE FILE WHOSE ENTIRE PURPOSE IS A TENANCY THAT ENDS quietly stopped ending any.
# The tests caught it; nothing in the file said it could happen. adr/0141 split the VERDICT in
# milestone 25 and stopped at the number, which is the half that bit.
#
# !! THE PREMISES THRESHOLD IS STILL ABSENT AND THAT IS THE WHOLE DEMONSTRATION. This file states
# `tenancy_ends_after_days` and NOT `condemn_after_days`, so its tenants fail and its buildings
# stand -- which is the sentence this world exists to be. declining.toml is the mirror: premises
# threshold, no tenant one. NEITHER FILE COULD BE WRITTEN BEFORE THE SPLIT.
#
# !! NO `collapses_after_days` IS OWED HERE, and the loader agrees. That key is required only
# alongside condemn_after_days, because only an abandoned Building leaves a shell. A tenancy that
# ends leaves the premises standing and empty, which placement refills -- so the cycle is bounded
# by the housing stock and needs no sink of its own.
#
# !! ONE DAY IS THE FLOOR THE UNIT ALLOWS, and it is UNRATIFIED -- plans/0002 D1. A dwelling whose
# larder nothing fills is an absence of a mechanism rather than a hardship, so the rate at which
# this world evicts people is not a claim about how long a hungry Household keeps its home.
tenancy_ends_after_days = 1
occupants = 4
business = "shop"
parking = 8

[[rule]]
name    = "consume"
kind    = "dwelling"
rate    = 32
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "sundries", amount = 4 } ]
outputs = []

[[zone_rule]]
name          = "housing"
kind          = "dwelling"
zone          = 0
interval      = 32
revisit_ticks = 2048

[placement]
interval      = 32
revisit_ticks = 1024
candidates    = 3

[layers]
noise_range_metres            = 300
noise_intensity_percent       = 400
desirability_pollution_percent = 100
desirability_noise_percent     = 100
pollution_period      = 64
pollution_offset      = 0
land_value_period     = 256
land_value_offset     = 16
kernel_metres         = 1024
pollution_decay_ticks = 2048
land_value_tau        = 8

[roads]
block_tiles                    = 32
arterial_count                 = 0
arterial_junction_tiles        = 512
foot_crossing_every            = 4
foot_paths_per_thousand_blocks = 40
street_speed_kph               = 50
arterial_speed_kph             = 90
walk_speed_kph                 = 5
street_capacity_per_hour       = 3600
arterial_capacity_per_hour     = 12000
foot_path_capacity_per_hour    = 1000

[lots]
lots_per_segment = 5

[parking]
radius_metres = 400
shed_keeps = 24

[trips]
crossing_seconds = 30
commute_fast_minutes = 20
commute_moderate_minutes = 40
commute_budget_minutes = 50

[jobs]
interval      = 32
revisit_ticks = 1024
candidates    = 3
shift_hours_min = 6
shift_hours_max = 10
arrive_early_max_minutes = 15
