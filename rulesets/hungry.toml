# The hunger Ruleset. It models no city, and it exists to make ONE THING VISIBLE.
#
# `evicted.toml` WITH `[needs]` AND ONE KEY ON ONE RESOURCE, and that diff is the whole content.
# `sundries` declares `need = "sustenance"`, so the Good the tenant's `consume` Rule draws is now a
# Good that feeds a Need -- and `[needs]` says how far the Need moves when an occasion fails and when
# one is met.
#
# WHAT IT EXISTS TO SHOW: adr/0103's accumulator, running. A Household's Sustenance is a RELATIVE
# SCALAR WHERE 0 IS IDEAL and negative values are deficit (CONTEXT.md -> Need, 04 section 2); it falls
# while unmet and recovers when met, so -- 04 section 6 step 6 -- "a dry afternoon and a dry month are
# one mechanism at two depths, and nothing else in this chain has to remember anything."
#
# ⚠ IT IS BUILT ON `evicted.toml` FOR A REASON AND NOT FOR CONVENIENCE. `restock` is deleted here as
# it is there, so the larder is filled by nothing and `consume` starves -- which is the only way any
# shipped world produces a FAILED OCCASION for a Household at all. On `minimal.toml` `consume` always
# succeeds, so the Need would sit pinned at 0 for the length of any run and the mechanism would be
# present, correct and invisible. ***A file that demonstrates an accumulator has to be able to fail.***
#
# ⚠ AND IT RECOVERS, WHICH IS THE HALF A ONE-POLE WORLD CANNOT SHOW. `evicted.toml` cycles by
# construction: a tenancy ends, the Household goes to the Unplaced Pool, placement rehouses it in a
# standing Building whose Bin still holds stock, and `consume` fires again. So Sustenance falls to the
# floor, the tenancy ends, and the rehoused Household climbs back toward zero. Both directions of the
# scalar are reachable in one run, which is what this file buys over its parent.
#
# 🔴 EVERY NUMBER IN `[needs]` IS PROVISIONAL AND WAS CHOSEN BY TASTE. plans/0045 standing order 4
# suspends adr/0052 for the amnesty, so there is no ratifier and no plans/0002 section D row. adr/0102
# authorises no number and never did: what the corpus specifies is the REPRESENTATION and the TRIGGER,
# and it stops there. THE NUMBERS THIS FILE PRODUCES RATIFY NOTHING.
#
# ⚠ THE OCCASION IS A RULE FIRING AND NOT YET A SHOPPING TRIP. 04 section 6 step 4 makes the attempt a
# Trip to one entry on a Provider List (adr/0067), and none of that is built -- no Provider List, no
# per-occasion cursor, and therefore none of the LAG that ADR describes as realism. What is built is a
# Household Rule drawing a Good from its own Bin and failing on supply, which is the same shape: a
# real attempt that really failed. When the Trip ships it replaces the call site and the accumulator
# does not change. ***Do not read a rate off this file and call it shopping.***
#
# ⚠ NOTHING READS THE NEED YET. The reader is 02 section 5.4's comparison against a Hinterland --
# adr/0102's housed Departure, milestone 19 -- and the utility aggregation form is itself still open
# (02 section 5.4 files additive against multiplicative). So a Household here starves to the floor and
# never leaves over it, and that is a missing READER rather than a broken accumulator.
#
# ⚠ TWO OF THE FOUR NEEDS ARE ABSENT AND THAT IS A DECISION. adr/0103 closes the set at Sustenance,
# Satisfaction, Education and Health, and says of the last two that a degradation rule for them is
# "owed and is deliberately UNDESIGNED" -- they are consumed by attending rather than by buying. They
# are undesigned rather than refused (adr/0070), so NOTHING MAY BE REASONED FROM THEIR ABSENCE HERE.
# The loader refuses them by name and says so.
#
# ⚠ SATISFACTION IS DECLARED IN `[needs]` AND FED BY NOTHING IN THIS FILE. There is no Consumer Goods
# Resource here, so its rates are stated and never exercised -- the table requires all four keys
# because a stated table states its keys, and a defaulted rate is a hash-bearing number nobody chose.
# A world that exercises both Needs wants a second Good and is not this file.
#

# The keys below are minimal.toml's and its comments carry their arguments -- read them there.
# What is commented HERE is what this file changes and why.

[needs]
sustenance_degrade = 4
sustenance_recover = 1
satisfaction_degrade = 1
satisfaction_recover = 1
floor = -1000

[[resource]]
name = "sundries"
family = "good"
need = "sustenance"

[[resource]]
name = "repairs"
family = "good"

[[resource]]
name = "money"
family = "money"

[[business]]
name = "shop"
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[building]]
name = "dwelling"
bins = [
    { resource = "sundries", capacity = 48, owner = "occupant" },
    { resource = "repairs",  capacity = 4 },
]
tenancy_ends_after_days = 1
houses   = true
premises = true
# Whether it parks at all -- the count is floor area over [capacity] floor_tiles_per_parking_space.
parked = true
business = "shop"

[[rule]]
name    = "consume"
kind    = "dwelling"
rate    = 32
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "sundries", amount = 4 } ]
outputs = []

[[zone_rule]]
name          = "housing"
kind          = "dwelling"
zone          = 0
interval      = 32
revisit_ticks = 2048

[placement]
interval      = 32
revisit_ticks = 1024
candidates    = 3

[layers]
noise_range_metres            = 300
noise_intensity_percent       = 400
desirability_pollution_percent = 100
desirability_noise_percent     = 100
pollution_period      = 64
pollution_offset      = 0
land_value_period     = 256
land_value_offset     = 16
kernel_metres         = 1024
pollution_decay_ticks = 2048
land_value_tau        = 8

[roads]
block_tiles                    = 32
arterial_count                 = 0
arterial_junction_tiles        = 512
foot_crossing_every            = 4
foot_paths_per_thousand_blocks = 40
street_speed_kph               = 50
arterial_speed_kph             = 90
walk_speed_kph                 = 5
street_capacity_per_hour       = 3600
arterial_capacity_per_hour     = 12000
foot_path_capacity_per_hour    = 1000

[lots]
lots_per_segment = 5
# The most ground a Building leaves on each side of its parcel. A LENGTH and not a fraction, so
# coverage rises with the parcel -- see minimal.toml, which carries the argument.
setback_tiles = 2

[capacity]
# How much floor one tenancy, job or parking space takes, in Tiles -- see minimal.toml, which carries
# the argument and the measurement. A kind says WHETHER it houses; the count derives from the ground,
# and the three rates are what the standing city already said about a detached building, divided.
floor_tiles_per_occupant      = 25
floor_tiles_per_job           = 3
floor_tiles_per_parking_space = 12

[parking]
radius_metres = 400
shed_keeps = 24

[trips]
crossing_seconds = 30
commute_fast_minutes = 20
commute_moderate_minutes = 40
commute_budget_minutes = 50

[jobs]
interval      = 32
revisit_ticks = 1024
candidates    = 3
shift_hours_min = 6
shift_hours_max = 10
arrive_early_max_minutes = 15
