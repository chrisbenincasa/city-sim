# aged.toml -- minimal.toml with FIVE [[life_stage]] tables and the dwelling stock's own SINK.
#
# ⚠ THIS LINE SAID `and nothing else changed` UNTIL 2026-08-31. It now also states
# `abandoned_when_empty_after_days` and `collapses_after_days` on the dwelling kind, and the
# reason is below at length: a city whose population MOVES needs a way to lose a house, and this
# is the only shipped world whose population moves.
#
# THE ONLY SHIPPED FILE IN WHICH THE CITY GENERATES ITS OWN POPULATION. `HouseholdTable.LifeStage` and
# `CitizenTable.Age` were both saved, hashed columns written by NOTHING -- two of the three dead
# columns found in the week the amnesty opened. plans/0046 gives them writers and this file is the
# world that exercises them.
#
# WHAT IT DEMONSTRATES, in the order the stages shipped: a chain with a countdown and a spread
# (stage 1); a terminal stage that DISSOLVES, its estate going to the treasury (stage 2); and
# adr/0011's fertility decision with the spawn that follows it (stage 3); and the WORKING-AGE GATE,
# which keeps a child out of the employment pass and the founding pass (stage 4).
#
# ⚠ THE GATE COSTS THIS WORLD 15% OF ITS LABOUR FORCE, measured here: 1,411 of 1,411 Citizens held a
# job before it and 1,200 of 1,411 after, over 60 Days at 2,000 Citizens. `[[building]] jobs = 8` was
# derived as "1000/360 x 3 = 8.33 Citizens", a ratio that assumes EVERY CITIZEN WORKS -- so that
# derivation no longer holds in a world with demographics, and the number below is inherited rather
# than re-derived. ⚠ THIS FILE DECLARES NO [founding], so the gate's second caller is unreachable
# here; raised.toml is the world that reaches it.
#
# MEASURED at 2,000 Citizens over 400 Days: 720 Households seeded, ALL OF THEM DEAD BY DAY 212, and
# 538 standing at the end -- every one of which was born here. Replacement Rate 1.48.
#
# 🔴 THIS CITY GROWS, AND THIS BLOCK SAID IT DECLINED FOR FIVE DAYS. The sentence that stood here was
# "THIS CITY DECLINES AND THAT IS THE BAND": `young` draws 0..3 children with a mean of 1.5 against a
# threshold of 2.00, so decline was arithmetic on a number in this file. ***THE THRESHOLD WAS WRONG BY
# A FACTOR OF TWO.*** adr/0011 derives it as two children replacing two adults, which is airtight for a
# Household of TWO adults -- and World.SpawnChildren gives EVERY CHILD ITS OWN HOUSEHOLD. Nothing in
# the build pairs anybody, so every Household past the founding generation holds exactly one adult and
# exact replacement is ONE child. `--stages` measures the column now rather than printing a constant,
# and `working age` and the Household count come back EXACTLY EQUAL.
#
# ⚠ SO 1.48 IS 45% GROWTH A GENERATION. Over 1,200 Days the Households go 720 -> ~1,100 and settle,
# bounded by the housing the lattice paved and by [placement] gives_up_after_days rather than by
# fertility. ***A 400-DAY RUN READS AS DECLINE BECAUSE IT CATCHES THE FIRST TROUGH*** -- the founding
# generation of two-adult Households being replaced by one-adult ones. ⚠ Whether children SHOULD pair
# is design, adr/0011 plainly assumes they do, nothing says who pairs with whom, and it is queued in
# plans/0045's `Owed when the freeze lifts`. ***The fertility draw is UNCONDITIONED*** either way --
# adr/0011 wants it conditioned on housing cost, dwelling size and job security, and none of that
# machinery exists (adr/0070: unbuilt, not refused) -- so nothing here is evidence about whether cities
# can afford children.
#
# 🔴 THE FOUR WINDOWS BELOW WERE TOO NARROW AND ARE NOW AS WIDE AS THEIR OWN FLOORS. adr/0011's `W`
# exists to smear the founding cohort so the city does not breathe in lockstep, and at 8-16 Days
# against a ~160-Day life it did not: the busiest transition Day was 7.0x the mean, 116 of 400 Days saw
# none at all, and individual stages went COMPLETELY EMPTY AND REFILLED. It now reads 3.3x with 19 Days
# quiet.
#
# ⚠ THE WINDOW COULD NOT BE WIDENED ALONE, AND THE FLOORS PAID FOR IT. A wake is drawn uniform on
# [floor, floor + width), so the MEAN life is floor + width/2 -- and this file's mean was already 188
# Days against adr/0094's ~190 ceiling for a readable Replacement Rate. Widening at fixed floors would
# have put it at 236. The floors are halved, the widths doubled, and the mean comes back to the 160
# this header claims below -- which it had never actually had, because 160 is the FLOOR of the chain
# and the argument is about the mean.
#
# ⚠ IT DAMPS THE ECHO AND DOES NOT REMOVE IT, AND 400 DAYS CANNOT SEE WHICH. Over 1,200 Days the
# population swing falls 3.67x -> 2.55x -> 1.19x across three 400-Day thirds, where the old windows
# were still swinging 2.47x in their last third. ***A 400-Day run holds two and a half generations and
# cannot tell a damping echo from a standing one.*** Read it with `--stages`.
#
# ⚠ `childless` WAS DECLARED AND UNREACHABLE UNTIL STAGE 3, deliberately, and it is REACHABLE NOW:
# `young`'s zero draw is what routes into it. It was declared before anything could reach it because
# it is what makes `next` an AUTHORED key rather than a derived one -- a chain taken from declaration
# order would route `family` into `childless` and be wrong in a way no refusal could catch.
# ***The stage whose absence would be invisible is the one worth shipping early.***
#
# ⚠ AND IT IS KEPT SEPARATE FROM `empty_nest` THOUGH THE TWO BEHAVE IDENTICALLY, which is adr/0011's
# own instruction and not an oversight: they are DIFFERENT DIAGNOSES. A large childless population
# means the city is too expensive to START a family; a large empty-nest population whose spawned
# Households all became Departures means it is too expensive to STAY in. Same root cause, different
# symptom, different remedy -- and a file that merged them would make the diagnosis unavailable
# for ever after.
#
# 🔴 EVERY NUMBER BELOW IS PROVISIONAL, CHOSEN BY TASTE, WITH NO RATIFIER AND NO plans/0002 §D
# ROW. That is what plans/0045's amnesty suspends adr/0052 in order to allow. They are numbers that
# let the mechanism run and they are nothing more.
#
# WHERE THE ~160 DAYS COMES FROM, AND IT IS THE ONE NUMBER WITH AN ARGUMENT BEHIND IT. The corpus
# states two incompatible lifespans. adr/0011's cost section reasons from "a life spanning on the
# order of a thousand Days". adr/0094's revisit trigger says the Day is too slow if "a twenty-hour
# campaign still does not contain enough generations for Replacement Rate to be readable, which at
# 562 Days means a Life Stage life longer than about 190 Days." A thousand-Day life puts LESS THAN
# ONE GENERATION inside a whole campaign, so Replacement Rate -- the readout the entire mechanism
# exists to produce -- could never be read by a player. adr/0094 wins because it reasons from what a
# person can SEE and adr/0011 reasons from what a machine can AFFORD.
#
# 🔴 ⚠ AND ~190 IS A CEILING ON THE MEAN, WHICH THIS FILE READ AS A CEILING ON THE FLOOR. The sentence
# that stood here was "24+48+48+40 = 160 Days at the floor, inside the ~190". A stage's wake is drawn
# uniform on [duration_days, duration_days + spread_days), so a life is floor + width/2 ON AVERAGE and
# the old table's mean was 188 -- inside the ceiling by two Days rather than by thirty, and with NO
# ROOM AT ALL to widen a window. ***A number that is one end of a distribution says which end.***
# The chain is now 16+32+32+28 = 108 Days at the floor and 160 on the mean, which is what the argument
# above always wanted and what the arithmetic beside it never delivered.
#
# ⚠ `spread_days` IS THE LOAD-BEARING HALF AND IT READS AS DECORATION. Without it every Household
# created at Tick 0 leaves every stage on the same Day for the whole run, so the founding generation
# stays one cohort and the city breathes in lockstep. ***That echo would read as a demographic
# mechanism and is an artefact of world creation.*** ✅ EACH WINDOW IS NOW AS WIDE AS ITS OWN FLOOR,
# measured rather than argued: `busiest ÷ mean` 7.0x -> 3.3x and Days with no transition at all
# 116 -> 19, of 400. ⚠ WIDENING IT IS NOT FREE AND THE FLOORS PAID -- see the ceiling above.
#
# ⚠ ZERO IS ALLOWED FOR `spread_days` and means exactly that lockstep world. It is refused nowhere
# because a file demonstrating the echo is a legitimate thing to author, and because a key whose zero
# is a real answer must not be defaulted.
#
# ⚠ THERE IS NO CALENDAR AND THERE MUST NOT BE ONE. Every duration here is in Days. CONTEXT.md's
# banned vocabulary names "Year", "month" and "season" outright; the precedent for anything wanting a
# longer unit is [[business]] pay_period_days = 7, which is a week because seven Days is a week.
#
# ⚠ THE CHAIN'S LONGEST DRAW IS 63 DAYS (32 + 32 - 1) AND THE WHEEL REACHES 127. ⚠ It was 48 + 16 - 1
# and is the SAME NUMBER by coincidence rather than by construction, which is worth saying out loud
# before somebody reads the equality as a constraint holding. That is not a
# coincidence: EventWheel.CoarseDays was DERIVED from this table -- plans/0036 decision 3 asked for a
# bucket count and could not answer it, because the answer is the longest sleep a consumer takes and
# there was no consumer. 64 is the derived floor and 128 is one doubling of headroom, taken because
# this table is PROVISIONAL and a number chosen by taste will move. RulesetLoader refuses a stage
# whose draw would reach the wheel's period, so the two cannot drift apart silently.
#
# WHAT IT IS NOT: it is not a claim about content. minimal.toml's first line says it models no city
# and that is unchanged -- this file adds a demographic clock to a world of one dwelling kind whose
# larder refills itself. Nothing here should be read as a decision about how long a life is.
# ---------------------------------------------------------------------------------------------------

# The minimal Ruleset. It models no city, and it is not the beginning of one.
#
# Slice 7 task 10a of plans/0011-rule-engine-bins-and-rules.md. Its whole job is to be the smallest
# content that makes Bins move, so that the wiring underneath it — a Ruleset reaching a World, a
# Building given its kind's Bins and Rule Instances when it is built, an arming stagger — is exercised
# by a running city rather than by a test that builds the same shape by hand.
#
# WHY IT NAMES NO GOOD. 04 §1's five Goods are Produce, Food, Timber, Materials and Consumer Goods,
# and every one of them is produced by one Building and consumed by another. That crosses an ownership
# boundary, which is the `pool` scope, which is a named hole that throws until Phase 2 brings roads,
# Districts and connectivity. So a Ruleset that could run today and also name a Good would be claiming
# a chain it cannot express. `sundries` is deliberately a word for goods too unimportant to name:
# nothing in this file should be read as a decision about content. Choosing the Goods is decision
# owed 4, and it belongs to task 10b with the chain it is for.
#
# WHY THERE IS NO on_fail CHAIN. A link rescues by relieving the Bin the head failed on, from a source
# the head could not reach. Every source available today is the Building's own Bins, so a chain here
# would be a Rule rescuing itself. adr/0045's ladder starts at the District Pool, and that is task 10b.
#
# WHY IT EMITS NO POLLUTION. Not because it would be unbounded — adr/0051's decay is built, so a `map`
# term is now a stock the environment absorbs and settles at a level proportional to the emission rate.
# It emits nothing because a dwelling is not industry. `02 §2.4` gives industrial pollution point
# sources, and inventing a smokestack here to exercise a code path would be this file claiming
# something about content, which its first line says it does not. The Rule engine's `map` output is
# covered by `RuleEvaluationTests`, and the absorption by `LayerFieldsTests` and `LayerLongRunTests`.
#
# THE GOODS QUANTITIES AND THE BIN CAPACITIES BOTH x4 ON 2026-08-13, AND IT CHANGED NOTHING THIS CITY
# DOES. adr/0094 took TICKS_PER_DAY from 8192 to 2048 and says the Goods quantities scale x4: a Day
# holds a quarter as many firings, so a per-firing `amount` goes x4 to keep the rate in Goods per Day.
# That is airtight and it is only half the edit -- the capacities had to follow, and they follow for a
# DIFFERENT reason, which is the part worth reading.
#
# `amount` AND `capacity` ARE BOTH IN GOODS AND THEY ARE DENOMINATED DIFFERENTLY. `amount` is
# Days-denominated: hold Goods per Day, so the number moves x4. `capacity` is TICKS-denominated: what
# has to hold is FIRINGS HELD -- capacity / (amount x occupants) -- and firings x rate is a DURATION.
# It is written in Goods, so keeping that duration still REQUIRES moving the number, and it moves x4
# only because `amount` did. THE UNIT OF A QUANTITY IS NOT ITS DENOMINATION.
#
# WHAT KEEPING capacity = 12 WOULD HAVE DONE. The larder would have held ONE firing of `consume` where
# it held four. In in-world time the two read identical -- 22.5 minutes of supply either way -- so
# measured in Goods nothing is wrong. Measured in firings held, every Bin in the game shrank by four,
# and a Bin that must be EXACTLY FULL for one `consume` to succeed is a knife edge. It fired
# Invariant.WaiterIsBlockedByTheBinItNames and exposed a live defect in the wake path, filed unfixed as
# plans/0003 queue item 8.
#
# IT IS BEHAVIOUR-NEUTRAL, MEASURED, AND THE COMMIT FIRST CLAIMED OTHERWISE. Running the pre-rescale
# file and this one for 4,096 Ticks gives a BYTE-IDENTICAL 86-line census -- buildings 1,201 -> 642, the
# Unplaced Pool, rule evaluations, Trips, every row. Only the State Hash moved, because Bin levels are
# four times larger. The commit said "a dwelling now holds 90 in-world minutes where it held 22.5, which
# is a change to the world": the digits are right and the comparison was never stated. The larder is
# 4 firings x rate 32 = 128 TICKS, and it was 128 Ticks before the clock moved too. 90-vs-22.5 is HEAD
# against the PRE-CLOCK world, which is adr/0094's cost arriving in one more place, not this edit's.
# plans/0012 Cause 5: a number that is one half of a ratio says which half.
#
# NOTHING HERE CAME OUT OF PROPORTION, because everything in this file is denominated in FIRINGS.
#
# 48 IS A COST DIAL HERE, NOT A BALANCE DIAL, AND THAT IS MEASURED TOO. Swept at 24, 36, 48 and 96, NO
# ROW OF THE CENSUS MOVES; only `rules due` and `rules evaluations` move, and they move UP with capacity
# (20,134 -> 25,023 at the first reading, 48 -> 96), because a deeper larder gives `restock` more
# space to keep working. A BIGGER BUFFER COSTS MORE, NOT LESS. The larder decides nothing because it
# is DEEPER THAN THE BUILDING'S LIFESPAN: nothing in this file produces `repairs`, so `upkeep` condemns
# every dwelling at 64 Ticks and a 128-Tick larder absorbs a shock that never arrives. Restoring 22.5
# in-world minutes would need 2 firings held -- one above a known crash -- or `consume`'s rate quartered,
# which adr/0094 refused on cost. And 22.5 WAS NEVER CHOSEN: it is `capacity = 12` in a file whose first
# line says it models no city (adr/0070).
#
# THE STEADY STATE IS THE POINT, AND IT IS A SURPLUS ONE. Production outruns consumption, so the Bin
# sits near its ceiling and `restock` is the Rule that fails: it sleeps on space, `consume` draws
# and wakes it, it refills and sleeps again. Both Rules move for ever, nothing trends, and no Rule is
# ever wrongly asleep. THE SHORTAGE REGIME IS NOT AVAILABLE AND THAT IS AN ENGINE PROPERTY RATHER THAN
# A TASTE: a recorded shortfall is a deficit at the instant of failure and the wait list wakes on the
# arriving quantity, so a consumer short of 3 is never woken by three arrivals of 1. Producing in a
# quantum at least as large as any consumer's deficit is what makes this file's steady state honest.
# See finding 41.
#
# WHY EVERY DWELLING FALLS DOWN, AND WHY THAT IS NOT A BALANCE MISTAKE. Slice 10 task 7 needs a
# Building that is *continuously* starved, because failure pressure is a duration and a Rule that is
# rescued resets it (adr/0053). Nothing in this file could supply one: the only Rule that fails here
# is `restock`, and it fails on SPACE — the Bin is full, which is the healthy state of a producer
# with nobody to sell to, and the amended adr/0053 reads only starvation. So `upkeep` was added, and
# it draws on a Resource this file deliberately never produces. Every dwelling therefore declines,
# which is total rather than selective because there is one kind and it has one behaviour. A city
# where some Buildings thrive and others do not needs Buildings that differ, which needs content, and
# content is what the first line of this file says it is not. The cycle it does produce is real: a
# condemned dwelling is demolished, its Households go to the Unplaced Pool, its Lot goes vacant, and
# the [[zone_rule]] below raises another — which is the first time anything in this project has both
# built and unbuilt, and the first time slice 5 task 7's `slots` assertion has had a table that churns.
#
# It is deleted rather than grown when task 10b becomes possible.

# The keys below are minimal.toml's and its comments carry their arguments -- read them there.
# What is commented HERE is what this file changes and why.

[[resource]]
name = "sundries"
family = "good"

[[resource]]
name = "repairs"
family = "good"

[[resource]]
name = "money"
family = "money"

[[business]]
name = "shop"
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[building]]
name = "dwelling"
bins = [
    { resource = "sundries", capacity = 48, owner = "occupant" },
    { resource = "repairs",  capacity = 4 },
]
houses   = true
premises = true
# Whether it parks at all -- the count is floor area over [capacity] floor_tiles_per_parking_space.
parked = true
abandoned_when_empty_after_days = 20
collapses_after_days = 10
business = "shop"

[[rule]]
name    = "restock"
kind    = "dwelling"
rate    = 8
apply   = { min = 1, max = 4 }
inputs  = []
outputs = [ { scope = "local", resource = "sundries", amount = 4 } ]

[[rule]]
name    = "consume"
kind    = "dwelling"
rate    = 32
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "sundries", amount = 4 } ]
outputs = []

[[rule]]
name    = "upkeep"
kind    = "dwelling"
rate    = 16
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "repairs", amount = 4 } ]
outputs = []

[[zone_rule]]
name          = "housing"
kind          = "dwelling"
zone          = 0
interval      = 32
revisit_ticks = 2048

[placement]
interval      = 32
revisit_ticks = 1024
candidates    = 3
gives_up_after_days = 60

[layers]
noise_range_metres            = 300
noise_intensity_percent       = 400
desirability_pollution_percent = 100
desirability_noise_percent     = 100
pollution_period      = 64
pollution_offset      = 0
land_value_period     = 256
land_value_offset     = 16
kernel_metres         = 1024
pollution_decay_ticks = 2048
land_value_tau        = 8

[roads]
block_tiles                    = 32
arterial_count                 = 0
arterial_junction_tiles        = 512
foot_crossing_every            = 4
foot_paths_per_thousand_blocks = 40
street_speed_kph               = 50
arterial_speed_kph             = 90
walk_speed_kph                 = 5
street_capacity_per_hour       = 3600
arterial_capacity_per_hour     = 12000
foot_path_capacity_per_hour    = 1000

[lots]
lots_per_segment = 5
# The most ground a Building leaves on each side of its parcel. A LENGTH and not a fraction, so
# coverage rises with the parcel -- see minimal.toml, which carries the argument.
setback_tiles = 2

[capacity]
# How much floor one tenancy, job or parking space takes, in Tiles -- see minimal.toml, which carries
# the argument and the measurement. A kind says WHETHER it houses; the count derives from the ground,
# and the three rates are what the standing city already said about a detached building, divided.
floor_tiles_per_occupant      = 25
floor_tiles_per_job           = 3
floor_tiles_per_parking_space = 12

[parking]
radius_metres = 400
shed_keeps = 24

[trips]
crossing_seconds = 30
commute_fast_minutes = 20
commute_moderate_minutes = 40
commute_budget_minutes = 50

[jobs]
interval      = 32
revisit_ticks = 1024
candidates    = 3
shift_hours_min = 6
shift_hours_max = 10
arrive_early_max_minutes = 15

[[life_stage]]
name          = "young"
duration_days = 16
spread_days   = 16
next          = "family"
childless     = "childless"
children_min  = 0
children_max  = 3
adult_age_min_days = 1
adult_age_max_days = 160

[[life_stage]]
name          = "family"
duration_days = 32
spread_days   = 32
next          = "mature_family"

[[life_stage]]
name           = "mature_family"
duration_days = 32
spread_days   = 32
next           = "empty_nest"
children_become = "young"

[[life_stage]]
name          = "childless"
duration_days = 28
spread_days   = 24

[[life_stage]]
name          = "empty_nest"
duration_days = 28
spread_days   = 24
