# The waged Ruleset. It is `provisioned.toml` with TWO KEYS ADDED to one trade -- so the diff is the
# whole demonstration -- and it is the first shipped file in which a Business PAYS ANYBODY.
#
# plans/0045 queue item 6, under the amnesty. Every world before it moved money in ONE DIRECTION: a
# Household could be taxed and a Business could be levied, and nothing anywhere paid a wage, so a run
# of provisioned.toml is "a stock being spent down and never replaced" -- that file's own words about
# its own opening balances, and the reason it says no number out of it is evidence about what a
# Household should hold.
#
# ---------------------------------------------------------------------------------------------------
# WHAT IT ADDS. Two keys, on `[[business]] grocer` and nowhere else:
#
#   wage_per_day    = 4096   -- what one job pays for one DAY WORKED, not what lands on payday
#   pay_period_days = 7      -- how many Days between paydays; the payday itself is STAGGERED per
#                               Business off its row id (PurposeTag.WagePayday), so a weekly city
#                               does not move its whole payroll on one Tick
#
# 🔴 BOTH ARE PROVISIONAL, chosen by taste under the amnesty with no ratifier and no plans/0002 §D
# row -- which is what suspending adr/0052 is for. Read them as "a number that lets the mechanism
# run", never as a claim about what work is worth.
#
# ---------------------------------------------------------------------------------------------------
# ⚠ ONLY THE GROCER IS PAID, AND THAT IS THE FILE'S SHARPEST SENTENCE.
# ---------------------------------------------------------------------------------------------------
# There are two trades here. `grocer` tenants the `shopfront`, sells sundries and therefore EARNS.
# `shop` tenants the `dwelling` (adr/0148 instantiates it into every one), employs 8 against the
# grocer's 3, and has no selling Rule at all -- so it earns NOTHING, for ever.
#
# A wage on `shop` would be a wage no shop could ever pay: an unpayable obligation declared against
# the city's entire workforce. So it declares none. ***The trade that earns is the only trade that
# pays***, and what this file demonstrates is a money loop that closes exactly as wide as the revenue
# under it -- which on this world is 3 workers per shopfront and nobody else.
#
# ⚠ SO DO NOT READ A HOUSEHOLD BALANCE HERE AS AN INCOME. Measured at 2,000 Citizens over 60 Days,
# total household money FALLS from ~9.3M to ~0.15M while wages pay ~2.8M into it: the spending is an
# order above the earning, because only a dozen Citizens in the city have a paying job at all. The
# loop is CLOSED and it is NARROW, and those are different claims.
#
# ---------------------------------------------------------------------------------------------------
# ⚠ THE RHYTHM IS THE VARIABLE AND THE INCOME IS NOT.
# ---------------------------------------------------------------------------------------------------
# `wage_per_day` is a DAILY RATE and payday moves it times the Days actually worked, so changing
# `pay_period_days` changes WHEN people are paid and not HOW MUCH. Measured over 60 Days at 2,000
# Citizens, total wages paid: 2,739,220 at a period of 14; 2,756,360 at 7; 2,914,028 at 1 -- a 6%
# spread across a 14x change in the period, and what moves inside it is the lumpiness.
#
# ***That is what makes this file an experiment rather than a demonstration***: change the one key
# and the comparison is attributable, because a lump-sum wage would have changed the income 14x too.
#
# ---------------------------------------------------------------------------------------------------
# ⚠ ARREARS ARE CAPPED AT ONE PERIOD AND THE REST IS FORFEIT, which is adr/0006 arriving in a wage.
# ---------------------------------------------------------------------------------------------------
# A worker accrues from CitizenTable.LastPaidDay and the clock advances only for what was actually
# paid, so a worker at an employer that can never pay would be owed one more Day every Day FOR EVER.
# Measured before the cap existed, on this file at a daily period: one underpaying shop ran a
# shortfall of 8,384 on Day 14 and 499,712 on Day 56, climbing linearly with no ceiling. With the cap
# it oscillates around 12,288 -- three workers, one period, one rate -- and goes no higher.
#
# ⚠ A SHORTFALL IS NOT SUMMABLE ACROSS PAYDAYS. It is what was owed and unpayable AT ONE PAYDAY, and
# an employer that is short every payday reports it every payday. Read the series, never the total.
#
# ---------------------------------------------------------------------------------------------------
# ⚠ IT IS NOT adr/0026's WAGE. That ADR has each Business POST a wage and adjust it by its own fill
# rate -- a price that moves. This is a flat number on a kind, because the posted wage is UNBUILT and
# adr/0070 says an unbuilt mechanism is not a design constraint. When it ships, WageEngine becomes
# where a wage is PAID rather than what it is WORTH, and these two keys go.
#
# ---------------------------------------------------------------------------------------------------
# 🔴 ⚠ EVERY FIGURE ABOVE WAS RE-MEASURED TWICE ON 2026-08-27 BECAUSE THE PARENT MOVED UNDER THIS
# FILE, TWICE, IN TWO DIFFERENT WAYS.
# ---------------------------------------------------------------------------------------------------
# This file was authored against a provisioned.toml whose two premises kinds both stated
# `condemn_after = 4`. Milestone 17 migrated that key to durations (adr/0168) and split the premises
# threshold from the tenant's, so the merged parent condemns the dwelling on `condemn_after_days`
# and ends the shopfront's TENANCY on `tenancy_ends_after_days` instead. ***A derived file inherits
# its parent's city, so it inherits the parent's edits to it*** -- and the honest repair was to
# regenerate this file from the merged parent rather than to translate two keys in place.
#
# The FIRST was the decline migration above. The SECOND was the coarse day wheel (plans/0046 stage
# 0) making a one-Day rate expressible, after which the parent's `rates` levy went `rate` 1024 ->
# 2048 with `amount` 8192 -> 16384 -- the same burden a Day, on a different phase.
#
# What moved across both: household money opens at ~9.3M rather than ~7.8M, closes at ~0.15M, and
# the spread across the three periods narrows from 9% to 6%. ⚠ WHAT DID NOT MOVE, EITHER TIME, IS
# THE ARREARS CAP at 12,288 -- three workers, one period, one rate -- because that is structural
# rather than a property of the city, and it is the one figure here a run cannot talk out of.
#
# ⚠ THE SECOND RE-MEASUREMENT MOVED THE WAGE TOTALS BY UNDER 1% AND IS STILL WORTH HAVING. A levy
# on the shop is not a wage, and the phase change reaches a wage only through which shops are
# solvent on which Day. ***A small movement measured is a different thing from a small movement
# assumed***, and the file cannot tell you which it was unless somebody runs it.
#
# ⚠ THE CLAIMS SURVIVED AND THE DIGITS DID NOT, which is the distinction worth carrying: the loop
# is still closed and still narrow, the rhythm still moves and the income still does not. A reader
# wanting a number out of this file should quote the sentence around it (plans/0012 Cause 5).
#
# ---------------------------------------------------------------------------------------------------
# Everything below is provisioned.toml unchanged, and its reasoning lives THERE rather than being
# copied here -- a copied comment is a second copy that drifts (plans/0012 Cause 1).
# ---------------------------------------------------------------------------------------------------

# The provisioned Ruleset. It is `twinned.toml` with a PROVIDER in it -- a second premises kind, the
# trade that occupies it, and a Zone Rule that raises it on the trade bit -- and it is the first
# shipped file in which anything is built to SELL.
#
# Milestone 26 task 3 of plans/0044-the-purchase-and-the-provider-that-answers-it.md, and it is the
# answer to session W's W-Q4, "which Ruleset carries it" (plans/0043). adr/0135 said the Provider does
# not go in minimal.toml and "needs a Ruleset of its own"; this is that file.
#
# ---------------------------------------------------------------------------------------------------
# 🔴 ⚠ IT LOADS AND IT DOES NOT RUN, AND THAT ASYMMETRY IS THE WHOLE POINT OF SHIPPING IT NOW.
# ---------------------------------------------------------------------------------------------------
# `RulesetLoader.TryScope` accepts `pool`. `RuleEngine.Bin` throws NotSupportedException on
# Scope.Pool -- "the District Pool does not exist ... a pool term is a named hole rather than a Bin
# that is always empty." So this file parses, validates, and refuses to step.
#
# THAT IS AN ACCEPTANCE TEST AND NOT A DEFECT. A named hole that a Ruleset can reach is the evidence
# that the loader and the engine disagree about exactly one thing, and that the one thing is the
# purchase. When task 4 resolves Scope.Pool this file starts running with no edit to it, which is the
# property it exists to have -- ProvisionedRulesetTests asserts both halves.
#
# ⚠ DO NOT "FIX" THE THROW BY GIVING THE SHOP A `local` SOURCE. A shop that stocks its own Bin and
# sells to nobody is a world this build already has (tenanted.toml), and it demonstrates the loader
# rather than a market.
#
# ---------------------------------------------------------------------------------------------------
# WHAT IT ADDS TO twinned.toml. Four things, and everything else below is twinned.toml unchanged --
# its reasoning lives there rather than being copied here, because a copied comment is a second copy
# that drifts (plans/0012 Cause 1).
#
#   1. `[[business]] grocer`  -- the trade. A Business is the actor (adr/0141); the premises is where
#                                it stands.
#   2. `[[building]] shopfront` -- the premises. `occupants = 1`, because the only tenant is the
#                                Business itself: one ceiling counts both kinds of tenant (adr/0147),
#                                and nobody lives in a shop in this file.
#   3. `[[rule]] stock`       -- what fills the seller's own Bin.
#   4. `[[zone_rule]] trade`  -- `zone = 1`, the trade bit adr/0165 paints.
#
# AND ONE EDIT: the dwelling's `restock` takes its sundries from `pool` instead of from nothing.
# ***THAT ONE LINE IS THE WHOLE MILESTONE.*** plans/0043 W15: minimal.toml's `restock` is
# `inputs = []`, four sundries a firing drawn from nowhere, and "that absence is the shop."
#
# ---------------------------------------------------------------------------------------------------
# ⚠ THE SELLER KEEPS ITS STOCK, WHICH IS WHY NOTHING HERE OUTPUTS TO `pool`. adr/0139: a District
# Pool is a MARKET and not a store. The Pool row is a price, a wake target and a list of reachable
# sellers; the Goods stay in the selling Business's own Bin. So `stock` fills a `local` Bin owned by
# the Business, and the only `pool` term in this file is on the BUYER'S side. A file in which the shop
# pushed stock into the Pool would be adr/0013's "pool everything, city-wide" wearing a market's name.
#
# ⚠ THE SHOP'S STOCK COMES FROM NOWHERE, AND THAT IS A STAND-IN RATHER THAN A CHAIN. `stock` is
# `inputs = []`, exactly as minimal.toml's `restock` was, and for the same reason: nothing in this
# build produces sundries, so a shop that bought them would starve on a Pool nobody supplies. ***A
# retailer importing from off-map is what the Hinterland prices below are the ceiling FOR***, and the
# real chain arrives when there is a producer. Do not read this file as a supply chain.
#
# 🔴 ⚠ THE TRADE IS RAISED BY THE WRONG SIGNAL AND THIS FILE CANNOT FIX IT. `ZoneRuleEngine.Create`
# builds only while the Unplaced Pool is non-empty -- which is demand for HOUSING, tier 0, the only
# demand signal that exists. So `trade` below raises a shop because somebody is unhoused, which is not
# a reason to open a shop. adr/0163 replaces that reading with elapsed unserved need in reach, FOR THE
# TRADE RULE ONLY, at milestone 26 task 6. ***Until then every shop this file builds was built for the
# wrong reason***, and no number in it is evidence about siting. This is the same shape crowded.toml's
# header carries about its own emitting kind, and it is worth reading beside this one.
#
# ⚠ A SHOP NOBODY BUYS FROM IS IMMORTAL, and there is no decline Rule here on purpose. plans/0043
# W17: an unsold Bin fills, the Rule stops on Blocking.Space, and RuleEngine.Stop clears the pressure
# clock for every blocking reason but Supply -- deliberately, because a full Bin "is what a
# well-supplied Building with nobody to sell to looks like." The failable Rule that kills a shop is a
# money-consuming one, it needs adr/0166's Business Rules, and it is TASK 7 -- which is also where
# `condemn_after` RETURNS to this file, at a value chosen for a trade rather than inherited from a
# dwelling.
#
# ⚠ THIS FILE DECLARED `condemn_after` ON BOTH KINDS UNTIL MILESTONE 17 AND NOW DECLARES IT ON
# NEITHER. It stood at 4 in all eighteen shipped files and no author had ever set it to anything
# else, which is adr/0164's test -- `would a designer ever set this?` -- answered by the tree rather
# than argued. It mattered here because a condemned Building no longer vanishes: abandonment leaves a
# SHELL standing (adr/0091), so every world was demonstrating blight on its way to demonstrating
# whatever it was built for. Decline now lives in declining.toml and in diagnosed.toml, and a key
# arrives with the mechanism that needs it rather than ahead of it.
#
# ---------------------------------------------------------------------------------------------------
# ⚠ THE COMMERCIAL LAND IS AT A FIXED STRIDE AND THAT IS NOT HOW ANY CITY IS ZONED. adr/0165 requires
# this sentence and SyntheticCity carries the same one: one block in `TradeBlockStride` is permitted
# to a trade, scattered on a diagonal, because the alternative -- keying it on distance from the
# centre -- would look immediately right and would encode a LOCATION THEORY into world creation at the
# same moment adr/0163 puts location in demand's hands. ***A demonstration file's job is to exercise a
# mechanism, not to resemble a city.*** The stride is unratified and lives in plans/0002 §D1; it also
# SATURATES above 8, so it is not the dial it looks like.
#
# 🔴 THE NUMBERS THIS FILE PRODUCES RATIFY NOTHING, AND IT CANNOT RATIFY EVEN ITS OWN. Nothing steps:
# the first firing of `restock` throws. So every price sits at its ceiling, every consumption bucket is
# zero, no shop earns anything, and the `[market]` damping below is as inert here as it is on
# twinned.toml. ⚠ IT IS ALSO adr/0163's NAMED RATIFIER and cannot serve as one yet -- those two §D2
# numbers name "milestone 26's own demonstration Ruleset" as the world, which is this file, and the
# earliest run that could ratify them is task 9's.
#
# WHY twinned.toml AND NOT minimal.toml. Two reasons, and the second is a refusal at load. A District
# needs two centres or the derivation is untestable (that file's header says why); and
# RulesetLoader.RefuseUnpricedGoods demands a `[[hinterland]] prices` entry for EVERY declared Good in
# any file that states `[districts]`, because a District opens a Pool per Good and the Hinterland's
# price is its only ceiling -- so an unpriced Good is free everywhere, for ever. This file declares no
# new Good for exactly that reason: `sundries` is what the shop sells and it is already priced below.
# ---------------------------------------------------------------------------------------------------

# The keys below are minimal.toml's and its comments carry their arguments -- read them there.
# What is commented HERE is what this file changes and why.

[[resource]]
name = "sundries"
family = "good"

[[resource]]
name = "repairs"
family = "good"

[[resource]]
name = "money"
family = "money"

[[business]]
name = "shop"
jobs = 8
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[business]]
name = "grocer"
jobs = 3
wage_per_day    = 4096
pay_period_days = 7
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[building]]
name = "dwelling"
condemn_after_days      = 1
tenancy_ends_after_days = 1
collapses_after_days    = 1
bins = [
    { resource = "sundries", capacity = 48, owner = "occupant" },
    { resource = "repairs",  capacity = 4 },
]
occupants = 4
business = "shop"
parking = 8

[[building]]
name = "shopfront"
bins = [
    { resource = "sundries", capacity = 96, owner = "business" },
    { resource = "repairs",  capacity = 4 },
    { resource = "money",    owner = "business" },
]
tenancy_ends_after_days = 2
occupants = 1
business = "grocer"

[[rule]]
name    = "restock"
kind    = "dwelling"
rate    = 8
apply   = { min = 1, max = 4 }
inputs  = [ { scope = "pool", resource = "sundries", amount = 4 } ]
outputs = [ { scope = "local", resource = "sundries", amount = 4 } ]

[[rule]]
name    = "consume"
kind    = "dwelling"
rate    = 32
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "sundries", amount = 4 } ]
outputs = []

[[rule]]
name    = "upkeep"
kind    = "dwelling"
rate    = 16
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "repairs", amount = 4 } ]
outputs = []

[[rule]]
name    = "stock"
kind    = "shopfront"
rate    = 8
apply   = { min = 1, max = 4 }
inputs  = []
outputs = [ { scope = "local", resource = "sundries", amount = 8 } ]

[[rule]]
name    = "rates"
kind    = "shopfront"
rate    = 2048
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local",  resource = "money", amount = 16384 } ]
outputs = [ { scope = "global", resource = "money", amount = 16384 } ]

[[zone_rule]]
name          = "housing"
kind          = "dwelling"
zone          = 0
interval      = 32
revisit_ticks = 2048

[[zone_rule]]
name          = "trade"
kind          = "shopfront"
zone          = 1
interval      = 32
revisit_ticks = 2048
build_threshold_days = 1
cooldown_days        = 1

[placement]
interval      = 32
revisit_ticks = 1024
candidates    = 3

[layers]
noise_range_metres            = 300
noise_intensity_percent       = 400
desirability_pollution_percent = 100
desirability_noise_percent     = 100
pollution_period      = 64
pollution_offset      = 0
land_value_period     = 256
land_value_offset     = 16
kernel_metres         = 1024
pollution_decay_ticks = 2048
land_value_tau        = 8

[roads]
block_tiles                    = 32
arterial_count                 = 0
arterial_junction_tiles        = 512
foot_crossing_every            = 4
foot_paths_per_thousand_blocks = 40
street_speed_kph               = 50
arterial_speed_kph             = 90
walk_speed_kph                 = 5
street_capacity_per_hour       = 3600
arterial_capacity_per_hour     = 12000
foot_path_capacity_per_hour    = 1000

[lots]
lots_per_segment = 5

[parking]
radius_metres = 400
shed_keeps = 24

[trips]
crossing_seconds = 30
commute_fast_minutes = 20
commute_moderate_minutes = 40
commute_budget_minutes = 50

[jobs]
interval      = 32
revisit_ticks = 1024
candidates    = 3
shift_hours_min = 6
shift_hours_max = 10
arrive_early_max_minutes = 15

[households]
car_ownership_percent = 0
opening_balance_min = 0
opening_balance_max = 25600

[[lattice]]
origin_east_tiles  = 0
origin_north_tiles = 0

[[lattice]]
origin_east_tiles  = 2048
origin_north_tiles = 0

[districts]
prominence_percent = 50
revisit_ticks = 2048
hysteresis_percent = 50
migrate_cells = 16

[[hinterland]]
edge = "north"
emigrant_balance_min = 0
emigrant_balance_max = 0
prices = [
  { resource = "sundries", price = 100 },
  { resource = "repairs",  price = 250 },
]

[[hinterland]]
edge = "east"
emigrant_balance_min = 0
emigrant_balance_max = 0
prices = [
  { resource = "sundries", price = 120 },
  { resource = "repairs",  price = 200 },
]

[market]
decay_percent = 50
move_cap_percent = 10
