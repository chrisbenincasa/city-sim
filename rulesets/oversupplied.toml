# ===================================================================================================
# oversupplied.toml -- `provisioned.toml` with TWO KEYS DELETED, and the deletion is the whole
# demonstration.
#
# THE DIFF: the `trade` [[zone_rule]] loses `build_threshold_days` and `cooldown_days`. That drops it
# from adr/0163's TIER 1 back to TIER 0 -- `UnplacedPool.Count != 0`, which is demand for HOMES used
# as a proxy for demand for SHOPS -- so the city builds a shopfront on every trade Lot it draws,
# until it runs out of trade Lots.
#
# WHAT IT EXISTS TO SHOW: **a shop going broke because there are too many shops.**
#
# 🔴 AND WHY IT HAD TO BE A SEPARATE FILE. adr/0170 makes a shop SELECTED rather than sited: the
# birth signal is coarse, and bankruptcy prunes what should not have been built. ***Selection needs
# OVER-SUPPLY.*** A shop with no competitor sells everything it makes, earns comfortably, and pays
# its levy for ever -- so if the city builds only what demand justifies, nothing is ever pruned and
# the death half is inert.
#
# ⚠ THAT IS EXACTLY WHAT TIER 1 IS FOR, so the two mechanisms pull against each other and this world
# is too small to show both. ⚠ EVERY NUMBER IN THIS HEADER IS AT 2,000 CITIZENS over 131,072 Ticks on
# the reference machine, and the counts move a lot with population -- at 40,000 the same two arms are
# 655 shops against 18. ***Quote the sentence and never the digits.*** Measured on `provisioned.toml`
# at 2,000 Citizens: under tier 0 the city builds 20 shops
# against ~18 vacant trade Lots -- pinned at the Lot ceiling, maximum over-build -- and shops compete
# and the weakest fail. Under tier 1 it builds 4, and **no shop ever earns a levy's worth and later
# fails**, over 131,072 Ticks. The arithmetic says why: at `consume` rate 32 taking 4 sundries, ~237
# Households draw ~30 sundries a Tick, one `stock` Rule makes 1 a Tick, so feeding this city takes
# ~30 shops and there are not 30 Lots to put them on. ***The city is LOT-LIMITED, and tier 0 was
# already at the ceiling.***
#
# ⚠ SO WHAT THIS FILE DEMONSTRATES IS A PROPERTY OF A SATURATED MARKET AND NOT OF THE BUILD RULE.
# Do not read its shop count as a recommendation, and do not read `provisioned.toml`'s as a defect:
# they are the same city with the birth signal moved, which is why this is a two-key diff and not a
# new world.
#
# 🔴 THE NUMBERS THIS FILE PRODUCES RATIFY NOTHING. A shop here has no cost of goods, no rent, no
# wage bill and no capital -- adr/0169's levy is the only outgoing that exists, and it is a levy on
# capital rather than on revenue because a founded balance is all a shop ever holds. So *how many
# shops fail* is a fact about a stand-in cost, not about an economy. Read adr/0169 before quoting a
# money figure out of a run of this.
#
# ⚠ EVERYTHING ELSE IS `provisioned.toml`'s and its header governs: the stride is not how any city is
# zoned, `tenancy_ends_after_days`'s rope, the levy's level and why it was raised
# from a value at which nothing could fail. Read that file first.
# ===================================================================================================

# The provisioned Ruleset. It is `twinned.toml` with a PROVIDER in it -- a second premises kind, the
# trade that occupies it, and a Zone Rule that raises it on the trade bit -- and it is the first
# shipped file in which anything is built to SELL.
#
# Milestone 26 task 3 of plans/0044-the-purchase-and-the-provider-that-answers-it.md, and it is the
# answer to session W's W-Q4, "which Ruleset carries it" (plans/0043). adr/0135 said the Provider does
# not go in minimal.toml and "needs a Ruleset of its own"; this is that file.
#
# ---------------------------------------------------------------------------------------------------
# 🔴 ⚠ IT LOADS AND IT DOES NOT RUN, AND THAT ASYMMETRY IS THE WHOLE POINT OF SHIPPING IT NOW.
# ---------------------------------------------------------------------------------------------------
# `RulesetLoader.TryScope` accepts `pool`. `RuleEngine.Bin` throws NotSupportedException on
# Scope.Pool -- "the District Pool does not exist ... a pool term is a named hole rather than a Bin
# that is always empty." So this file parses, validates, and refuses to step.
#
# THAT IS AN ACCEPTANCE TEST AND NOT A DEFECT. A named hole that a Ruleset can reach is the evidence
# that the loader and the engine disagree about exactly one thing, and that the one thing is the
# purchase. When task 4 resolves Scope.Pool this file starts running with no edit to it, which is the
# property it exists to have -- ProvisionedRulesetTests asserts both halves.
#
# ⚠ DO NOT "FIX" THE THROW BY GIVING THE SHOP A `local` SOURCE. A shop that stocks its own Bin and
# sells to nobody is a world this build already has (tenanted.toml), and it demonstrates the loader
# rather than a market.
#
# ---------------------------------------------------------------------------------------------------
# WHAT IT ADDS TO twinned.toml. Four things, and everything else below is twinned.toml unchanged --
# its reasoning lives there rather than being copied here, because a copied comment is a second copy
# that drifts (plans/0012 Cause 1).
#
#   1. `[[business]] grocer`  -- the trade. A Business is the actor (adr/0141); the premises is where
#                                it stands.
#   2. `[[building]] shopfront` -- the premises. `occupants = 1`, because the only tenant is the
#                                Business itself: one ceiling counts both kinds of tenant (adr/0147),
#                                and nobody lives in a shop in this file.
#   3. `[[rule]] stock`       -- what fills the seller's own Bin.
#   4. `[[zone_rule]] trade`  -- `zone = 1`, the trade bit adr/0165 paints.
#
# AND ONE EDIT: the dwelling's `restock` takes its sundries from `pool` instead of from nothing.
# ***THAT ONE LINE IS THE WHOLE MILESTONE.*** plans/0043 W15: minimal.toml's `restock` is
# `inputs = []`, four sundries a firing drawn from nowhere, and "that absence is the shop."
#
# ---------------------------------------------------------------------------------------------------
# ⚠ THE SELLER KEEPS ITS STOCK, WHICH IS WHY NOTHING HERE OUTPUTS TO `pool`. adr/0139: a District
# Pool is a MARKET and not a store. The Pool row is a price, a wake target and a list of reachable
# sellers; the Goods stay in the selling Business's own Bin. So `stock` fills a `local` Bin owned by
# the Business, and the only `pool` term in this file is on the BUYER'S side. A file in which the shop
# pushed stock into the Pool would be adr/0013's "pool everything, city-wide" wearing a market's name.
#
# ⚠ THE SHOP'S STOCK COMES FROM NOWHERE, AND THAT IS A STAND-IN RATHER THAN A CHAIN. `stock` is
# `inputs = []`, exactly as minimal.toml's `restock` was, and for the same reason: nothing in this
# build produces sundries, so a shop that bought them would starve on a Pool nobody supplies. ***A
# retailer importing from off-map is what the Hinterland prices below are the ceiling FOR***, and the
# real chain arrives when there is a producer. Do not read this file as a supply chain.
#
# 🔴 ⚠ THE TRADE IS RAISED BY THE WRONG SIGNAL AND THIS FILE CANNOT FIX IT. `ZoneRuleEngine.Create`
# builds only while the Unplaced Pool is non-empty -- which is demand for HOUSING, tier 0, the only
# demand signal that exists. So `trade` below raises a shop because somebody is unhoused, which is not
# a reason to open a shop. adr/0163 replaces that reading with elapsed unserved need in reach, FOR THE
# TRADE RULE ONLY, at milestone 26 task 6. ***Until then every shop this file builds was built for the
# wrong reason***, and no number in it is evidence about siting. This is the same shape crowded.toml's
# header carries about its own emitting kind, and it is worth reading beside this one.
#
# ⚠ A SHOP NOBODY BUYS FROM IS IMMORTAL, and there is no decline Rule here on purpose. plans/0043
# W17: an unsold Bin fills, the Rule stops on Blocking.Space, and RuleEngine.Stop clears the pressure
# clock for every blocking reason but Supply -- deliberately, because a full Bin "is what a
# well-supplied Building with nobody to sell to looks like." The failable Rule that kills a shop is a
# money-consuming one, it needs adr/0166's Business Rules, and it is TASK 7 -- which is also where
# a PREMISES threshold returns to this kind, at a value chosen for a trade rather than inherited
# from a dwelling. What the `shopfront` kind states below is the TENANCY threshold and not that
# one; `rates` is the only Rule here that can starve, and what runs out of rope is the shop.
#
# ---------------------------------------------------------------------------------------------------
# ⚠ THE COMMERCIAL LAND IS AT A FIXED STRIDE AND THAT IS NOT HOW ANY CITY IS ZONED. adr/0165 requires
# this sentence and SyntheticCity carries the same one: one block in `TradeBlockStride` is permitted
# to a trade, scattered on a diagonal, because the alternative -- keying it on distance from the
# centre -- would look immediately right and would encode a LOCATION THEORY into world creation at the
# same moment adr/0163 puts location in demand's hands. ***A demonstration file's job is to exercise a
# mechanism, not to resemble a city.*** The stride is unratified and lives in plans/0002 §D1; it also
# SATURATES above 8, so it is not the dial it looks like.
#
# 🔴 THE NUMBERS THIS FILE PRODUCES RATIFY NOTHING, AND IT CANNOT RATIFY EVEN ITS OWN. Nothing steps:
# the first firing of `restock` throws. So every price sits at its ceiling, every consumption bucket is
# zero, no shop earns anything, and the `[market]` damping below is as inert here as it is on
# twinned.toml. ⚠ IT IS ALSO adr/0163's NAMED RATIFIER and cannot serve as one yet -- those two §D2
# numbers name "milestone 26's own demonstration Ruleset" as the world, which is this file, and the
# earliest run that could ratify them is task 9's.
#
# WHY twinned.toml AND NOT minimal.toml. Two reasons, and the second is a refusal at load. A District
# needs two centres or the derivation is untestable (that file's header says why); and
# RulesetLoader.RefuseUnpricedGoods demands a `[[hinterland]] prices` entry for EVERY declared Good in
# any file that states `[districts]`, because a District opens a Pool per Good and the Hinterland's
# price is its only ceiling -- so an unpriced Good is free everywhere, for ever. This file declares no
# new Good for exactly that reason: `sundries` is what the shop sells and it is already priced below.
# ---------------------------------------------------------------------------------------------------

# The keys below are minimal.toml's and its comments carry their arguments -- read them there.
# What is commented HERE is what this file changes and why.

[[resource]]
name = "sundries"
family = "good"

[[resource]]
name = "repairs"
family = "good"

[[resource]]
name = "money"
family = "money"
# `owner = "occupant"` is adr/0141's line -- the larder goes with the family, the roof does not -- so
# `sundries` is one Bin per Household and `repairs` is one per Building. The premises still declare
# the ceiling. minimal.toml's dwelling carries the argument and what it changes about the city.
# ---------------------------------------------------------------------------------------------------
# THE TRADE. adr/0141 gave `jobs`, the Shift band and the wage to the BUSINESS rather than to the
# premises; adr/0148 removed the first two from [[building]] rather than leaving them parsed and
# unread. THE WAGE IS NOT HERE: that is adr/0026 at milestone 15, and a `wage` key is refused until
# there is something to pay it out of.
#
# THE COMMENTS BELOW ARE THE ONES THAT STOOD ON [[building]], moved verbatim with their numbers. Read
# them as a property of the TRADE now -- "a Building of this kind" has become "a Business of this
# trade", and the derivations are untouched because the arithmetic did not move.
# ---------------------------------------------------------------------------------------------------
[[business]]
name = "shop"
jobs = 8
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10
# ---------------------------------------------------------------------------------------------------
# THE PROVIDER'S TRADE. Milestone 26 task 3, and it is a SECOND trade rather than a second use of
# `shop` above, because that one comes with a dwelling (adr/0148) and is a shopkeeper living over the
# premises. This one occupies a premises of its own and nobody lives there.
#
# ⚠ `jobs` IS 3 AND NOT 8, and it is derived rather than chosen the same way the dwelling's is: a
# shopfront holds one tenant, that tenant is this Business, and a corner grocer is not an eight-person
# workplace. It counts CITIZENS and never Households (adr/0141).
#
# THE WAGE IS NOT HERE, on twinned.toml's own reason: that is adr/0026 at milestone 15, and a `wage`
# key is refused until there is something to pay it out of.
# ---------------------------------------------------------------------------------------------------
[[business]]
name = "grocer"
jobs = 3
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[building]]
name = "dwelling"
# 🔴 MIGRATED FROM `condemn_after = 4` BY MILESTONE 17 (adr/0168), AND UNLIKE THE `shopfront` KIND
# BELOW ***THE QUANTITY DID NOT SURVIVE***. That key had no header defending it here: it stood at 4
# in all eighteen shipped files and no author ever set it, which is adr/0164's `would a designer ever
# set this?` answered by the tree. What it BOUGHT was invisible and differed per verdict --
#
#   premises, via `upkeep` at rate 16:  4 x 16 =  64 Ticks  (45 in-world minutes)
#   tenant,   via `restock` at rate  8:  4 x  8 =  32 Ticks  (22 in-world minutes)
#
# -- and a Day is 2,048 Ticks, so NEITHER IS EXPRESSIBLE ANY MORE. That is the unit doing its job
# rather than an obstacle: adr/0168 chose the Day precisely so that forty-five minutes is unwritable.
#
# 🔴 ⚠ THE 32-TICK TENANT CLOCK WAS EVICTING HOUSEHOLDS BEFORE THE MARKET COULD EXIST. `restock`
# buys from a District Pool, and no District exists until `[districts] revisit_ticks` = 2048 -- so
# every Household in this file starved by construction for the first 2,048 Ticks and was turned out
# after 32 of them. ***That is the same rope the `shopfront` kind is given deliberately, and the
# dwelling was never given it.*** The value below is the first authorable duration that reaches past
# the watershed, which is the shopfront header's own reasoning applied to the other kind.
#
# 🔴 THE THREE NUMBERS BELOW ARE UNRATIFIED and are recorded in plans/0002 §D1. They are the FLOOR of
# the unit rather than a chosen quantity -- the honest migration of a value that was smaller than the
# unit permits -- and a floor is not an argument. ⚠ Do not read the condemnation count of a run of
# this file as a claim about decline: `upkeep` draws `repairs`, nothing on this file produces any, so
# every dwelling is condemned with probability 1 and the threshold sets only the cycle time.
condemn_after_days      = 1
tenancy_ends_after_days = 1
collapses_after_days    = 1
bins = [
    { resource = "sundries", capacity = 48, owner = "occupant" },
    { resource = "repairs",  capacity = 4 },
]
occupants = 4
business = "shop"
parking = 8
# ---------------------------------------------------------------------------------------------------
# THE PROVIDER'S PREMISES. Milestone 26 task 3.
#
# ⚠ ITS SUNDRIES BIN IS `owner = "business"`, AND THAT KEY IS WHAT MAKES THIS A SELLER. adr/0141's
# line is that a tenant owns what leaves with it and the premises own the capacity -- so the stock
# belongs to the Business and goes with it when the tenancy ends, while the shelf space is a property
# of the building. Task 1 of this milestone added the third BinTenancy for it (adr/0166).
#
# ⚠ `occupants = 1` BECAUSE THE ONLY TENANT IS THE BUSINESS. One ceiling counts both kinds of tenant
# (adr/0147), and the Business instantiated with this kind takes the single slot -- so a Household can
# never be placed here, and PlacementEngine never looks: adr/0165's split puts this kind on the trade
# bit and Space.ZonedLots keeps a house-hunter's draw on land that admits a dwelling.
#
# ⚠ NO `condemn_after`, AND ITS ABSENCE IS THE SAME POINT ITS PRESENCE USED TO MAKE. See the header:
# an unsold Bin stops on Blocking.Space and the pressure clock is cleared for every reason but
# Supply, so a shop nobody buys from is immortal whether or not the key is stated. It was declared
# here until milestone 17 "so the mechanism has somewhere to land"; adr/0164 is why it is not --
# a key nothing can reach is a key no designer can have an opinion about. It returns at task 7 with
# the money-consuming Rule that can fail, at a value chosen for a trade.
#
# ⚠ NO `parking` KEY, and that is an omission with a reason rather than a default: a Car Park is
# supply at a Building (adr/0120), a shopper is not a mechanism this build has, and the only trips
# that exist are commutes. Declaring shed capacity for customers nobody simulates would be a number
# with no consumer.
# ---------------------------------------------------------------------------------------------------
[[building]]
name = "shopfront"
bins = [
    { resource = "sundries", capacity = 96, owner = "business" },
    { resource = "repairs",  capacity = 4 },
    { resource = "money",    owner = "business" },
]
# THE ROPE, MIGRATED FROM `condemn_after = 4` BY MILESTONE 17 (adr/0168), AND THE QUANTITY SURVIVED
# THE UNIT CHANGE. `rates` fires every 1,024 Ticks, so four missed firings was 4,096 Ticks and 4,096
# Ticks is two Days. The number below buys the same rope the `rates` header reasons for; only the
# spelling moved. Read that header -- grep `THE SLACK IS` -- for what the rope is FOR.
#
# ⚠ IT IS THE **TENANCY** THRESHOLD AND NOT THE PREMISES ONE, which is the half adr/0168 exists to
# separate. `rates` consumes `local money`, a balance belongs to a Business and never to a Building
# (adr/0113), so RulesetLoader.ApplyTenancies derives the SHOP as the payer: it is the shop that runs
# out of rope, and what ends is its tenancy. The premises stand and placement re-lets them.
#
# ⚠ NO `condemn_after_days` ON THIS KIND, and its absence is a reading rather than an omission. The
# only other Rule here is `stock`, which has no inputs and therefore cannot fail on supply -- it can
# block on `Space` alone, and RuleEngine.Stop CLEARS the pressure clock on every reason but supply.
# ***A premises threshold on this kind would arm on nothing.***
tenancy_ends_after_days = 2
occupants = 1
business = "grocer"
# ---------------------------------------------------------------------------------------------------
# 🔴 THE ONE EDIT, AND IT IS THE WHOLE MILESTONE. On every other shipped file `restock` is
# `inputs = []` -- four sundries a firing, drawn from nothing. Here the larder is filled by BUYING,
# and `pool` is the term that crosses an ownership boundary: the Good moves one way and money the
# other at the prevailing price, settled atomically with the Rule (adr/0050).
#
# ⚠ THIS LINE IS WHY THE FILE DOES NOT RUN. RuleEngine.Bin throws on Scope.Pool. Everything else here
# would step today.
#
# ⚠ AND IT IS ALSO THE DEMAND SIGNAL, WHICH COSTS NOTHING BECAUSE THE PURCHASE CREATES IT
# (plans/0043 W15). A Household with no reachable seller fails this Rule and STARVES -- and starvation
# is already a Blocking reason, a wait list and a StarvedSince clock. adr/0163's tier 1 reads elapsed
# unserved need off those rows. No new record, no new column, no new mechanism.
# ---------------------------------------------------------------------------------------------------
[[rule]]
name    = "restock"
kind    = "dwelling"
rate    = 8
apply   = { min = 1, max = 4 }
inputs  = [ { scope = "pool", resource = "sundries", amount = 4 } ]
outputs = [ { scope = "local", resource = "sundries", amount = 4 } ]

[[rule]]
name    = "consume"
kind    = "dwelling"
rate    = 32
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "sundries", amount = 4 } ]
outputs = []

[[rule]]
name    = "upkeep"
kind    = "dwelling"
rate    = 16
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "repairs", amount = 4 } ]
outputs = []
# ---------------------------------------------------------------------------------------------------
# WHAT FILLS THE SELLER'S OWN BIN. `inputs = []` for the header's reason: nothing in this build
# produces sundries, so a shop that bought them would starve on a Pool nobody supplies. This is a
# retailer importing from off-map, which is what the Hinterland prices are the ceiling for.
#
# ⚠ IT OUTPUTS `local` AND NOT `pool`, and that is adr/0139 rather than an oversight -- a Pool is a
# market and not a store, so stock stays with the seller and a buyer's `pool` term comes to find it.
#
# ⚠ ITS TENANCY IS DERIVED AND NOT DECLARED. The Bin it names is `owner = "business"`, so
# RuleDefinition.Tenancy resolves to Business and this Rule Instance lives exactly as long as the
# grocer's tenancy (adr/0166). There is no `[[rule]]` key for it and adr/0141 is unamended.
# ---------------------------------------------------------------------------------------------------
[[rule]]
name    = "stock"
kind    = "shopfront"
rate    = 8
apply   = { min = 1, max = 4 }
inputs  = []
outputs = [ { scope = "local", resource = "sundries", amount = 8 } ]
# ---------------------------------------------------------------------------------------------------
# 🔴 THE DECLINE HALF, AND IT IS A RECURRING COST RATHER THAN A FAILURE TO SELL.
#
# ⚠ A SHOP NOBODY BUYS FROM IS IMMORTAL, and that is why this Rule exists. Unsold stock fills the
# `sundries` Bin, so `stock` stops on `Blocking.Space` -- and `RuleEngine.Stop` CLEARS the failure
# pressure clock for every blocking reason that is not `Blocking.Supply`, deliberately, because a full
# Bin is what a well-supplied Building with nobody to sell to looks like. So a trade cannot be made to
# churn by failing to SELL; it must go short of something it CONSUMES (adr/0163, corrected the day it
# was written; adr/0166).
#
# ⚠ IT IS TWO TERMS AND NOT ONE, and that is adr/0024 rather than a style. Money is conserved -- never
# created or destroyed inside the city -- so a local money input with no counterparty is REFUSED at
# load by RulesetLoader's refusal 4 -- *"a cost paid to nobody is a leak, not a cost"*, which is the
# loader's own message and not a sentence in adr/0024. The counterparty here is the treasury, which
# makes this a LEVY on a trade and not rent to a landlord: nothing in this build owns premises, and
# writing rent would name an actor that does not exist (adr/0070 -- classify it, and this one is
# `unbuilt`). ⚠ Cost of goods to a supplier is the SUCCESSOR and is named in adr/0169 with its
# trigger; it is not written here because nothing sells to a grocer.
#
# ⚠ THE MONEY BIN ON THE KIND ABOVE IS WHAT ROUTES THIS RULE TO THE BUSINESS. `ApplyTenancies` reads a
# Rule's local terms against the kind's declared Bins to decide whose Rule it is, so without that line
# the only local term is `money`, no declaration matches, and the subject defaults to the PREMISES --
# which holds no money (adr/0113) and would throw. ⚠ It does NOT open a second balance:
# `World.FitBusiness` guards with `FindOwnerBin(...).IsNone`, so it finds the one `World.OpenBalance`
# already made.
#
# 🔴 BOTH NUMBERS ARE UNRATIFIED and plans/0002 §D1 holds them.
#
# ⚠ `rate = 1024` IS HALF A DAY BECAUSE A DAY IS NOT EXPRESSIBLE. A rate is a reschedule interval and
# the loader refuses anything at or beyond `WHEEL_SIZE`, which is 2048 -- a rate of exactly one Day
# would re-arm into the Event Wheel bucket it just came off. So *a daily levy* cannot be written, and
# the nearest thing that can is twice a day at half the money. ***The burden is the Day's and the
# period is the wheel's***, which is worth knowing before reading either digit as a design intent.
#
# ⚠ `amount` IS A SHARE OF A MEASURED REVENUE AND NOT A GUESS, and the measurement is the point.
# Twenty shopfronts on this file at 2,000 Citizens earn between **5.2 and 62.6 money a Tick**, median
# ~32 -- a **19x spread**, and that spread is LOCATION: a shop with hungry Households in reach sells
# and one without does not. 8,192 twice a Day is ~25% of the median, which fails the weakest **2 of
# 20** and leaves the rest trading. ***So bankruptcy here is a TAIL event rather than the normal
# outcome***, which is what makes it worth distinguishing from starvation at all.
#
# 🔴 THE FIRST VALUE WRITTEN HERE WAS 2,048 AND NOTHING EVER FAILED. At ~6% of revenue the levy was
# unfailable, so the mechanism was present, correct and **unobservable** -- the exact shape this
# corpus keeps filing, a producer shipped without a consequence. ⚠ A trade whose total recurring cost
# is 6% of its takings is not a trade. ***The number was not too small for the test; it was wrong
# about the world.***
#
# ⚠ Read the sentence rather than the digits: what is claimed is a *share of a measured median*, and
# that median moves the moment anything else about this file does -- the stride, the arrival rate, the
# import ceiling or the number of shopfronts.
#
# ⚠ THE SLACK IS `tenancy_ends_after_days = 2` ON THE `shopfront` KIND, and it is doing real work here. A shopfront opens at a ZERO
# balance (adr/0148 instantiates the kind's trade; nothing founds on this file), and it cannot sell
# until a District exists at `[districts] revisit_ticks` = 2048. So its first levies fail by
# construction. ***Two Days is 4,096 Ticks of rope, which reaches past the watershed*** -- and
# adr/0053's recovery is TOTAL, so the first successful levy clears the clock outright.
#
# ⚠ THIS PARAGRAPH READ `THE SLACK IS condemn_after = 4` AND ITS SUM WAS `four missed firings at 1024
# is 4,096 Ticks`. Milestone 17 re-authored the threshold as a duration (adr/0168) and the QUANTITY IS
# UNCHANGED -- 4 x 1024 = 4,096 = two Days -- but the DERIVATION is not, and restating the key without
# restating the sum would have left a header reasoning from a rate the number no longer depends on.
# ***The rope is now stated directly, so retuning `rate` below cannot silently move it*** -- which is
# adr/0059 and adr/0130's `author the duration, derive the count`, and the whole reason this key
# changed.
# ---------------------------------------------------------------------------------------------------
[[rule]]
name    = "rates"
kind    = "shopfront"
rate    = 1024
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local",  resource = "money", amount = 8192 } ]
outputs = [ { scope = "global", resource = "money", amount = 8192 } ]

[[zone_rule]]
name          = "housing"
kind          = "dwelling"
zone          = 0
interval      = 32
revisit_ticks = 2048
# ---------------------------------------------------------------------------------------------------
# THE SECOND ZONE RULE, AND `zone = 1` IS THE TRADE BIT. adr/0165 makes a Zone a permission set over
# Building kinds and paints bit 1 on one block in TradeBlockStride; ZoneRuleDefinition.Admits is
# `1 << zone`, so this rule looks only at land permitted to a trade and the housing rule above looks
# only at land permitted to a dwelling. ***The split is exclusive, so the two never contend for a
# Lot.***
#
# 🔴 ⚠ IT IS RAISED BY DEMAND FOR HOUSING, WHICH IS THE WRONG SIGNAL, AND THE HEADER SAYS SO AT
# LENGTH. ZoneRuleEngine.Create builds while the Unplaced Pool is non-empty; that is tier 0 and the
# only demand signal that exists. Task 6 replaces it FOR THIS RULE ONLY with adr/0163's elapsed
# unserved need in reach, and the housing rule stays tier 0.
#
# ⚠ THE CADENCE IS THE HOUSING RULE'S, COPIED, AND THAT IS A PLACEHOLDER RATHER THAN A CHOICE. Nothing
# has measured what interval a trade should be evaluated at, and authoring a different number here
# would be a second unratified hash-bearing number chosen against no consumer (adr/0052). It moves
# when task 6 gives it a signal worth pacing.
# ---------------------------------------------------------------------------------------------------
[[zone_rule]]
name          = "trade"
kind          = "shopfront"
zone          = 1
interval      = 32
revisit_ticks = 2048

[placement]
interval      = 32
revisit_ticks = 1024
candidates    = 3

[layers]
noise_range_metres            = 300
noise_intensity_percent       = 400
desirability_pollution_percent = 100
desirability_noise_percent     = 100
