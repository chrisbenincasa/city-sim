# choosy.toml -- declining.toml with FIVE [[life_stage]] tables and TEN centrality keys.
#
# THE FIRST SHIPPED WORLD IN WHICH TWO IDENTICAL HOUSEHOLDS WANT DIFFERENT THINGS. Every world before
# it housed a family in the first dwelling with room in it: PlacementEngine.TryHouse drew three Lots
# and took the first that was standing, unabandoned and not full. No score, no rejection, no second
# thought -- adr/0069 says so itself, "no acceptance filter, no sampler bias, no scored choice, no
# mu". A Household had nothing to want with.
#
# WHAT IT DEMONSTRATES: adr/0027. A Life Stage supplies a BASE and a WIDTH; each Household draws its
# own position inside them; the position PERSISTS FOR LIFE while the stage's range moves under it.
# "Someone who always valued quiet still values quiet once they have children."
#
# 🔴 ⚠ IT IS BUILT ON declining.toml AND NOT ON aged.toml, AND THAT IS THE WHOLE REASON THIS FILE
# LOOKS LIKE THIS. The obvious base was aged.toml -- minimal.toml plus the same five stages -- and it
# was built that way first. IT DEMONSTRATED NOTHING: measured, the Unplaced Pool was EMPTY ON EVERY
# ONE OF 20,480 TICKS, so TryHouse never ran, no taste was ever consulted, and the file produced a
# State Hash identical to aged.toml's at every sample. ***A preference about where to live is
# unreachable in a world where nobody is looking for somewhere to live.***
#
# The Pool is filled by Households LOSING A HOME, and minimal.toml stopped condemning anything at
# milestone 17 (adr/0164). declining.toml is the smallest shipped world that condemns, so it is the
# smallest one in which a family is ever rehoused -- and rehousing is precisely the moment a
# preference is worth having. ⚠ THE STAGE NUMBERS BELOW ARE aged.toml'S PRE-2026-08-31 ONES, which
# is why the arithmetic in the next sentence no longer matches that file: plans/0045 row 13 halved
# its floors and doubled its spreads, and scoped the edit there.
# ⚠ THE SLOW PATH WOULD HAVE WORKED AND IS NOT A FIX: the chain here
# reaches `children_become` only after 24 + 48 + 48 = 120 Days, which is 245,760 Ticks, and a
# demonstration nobody will sit through is not one.
#
# ⚠ THE WIDTH IS THE DESIGN AND THE BASE IS THE DETAIL, which is the opposite of how the pair reads.
# A width answers "how much is this demographic a demographic" -- a narrow stage behaves predictably
# in aggregate, a wide one produces divergent behaviour from identical circumstances. This file
# authors adr/0027's own worked example:
#
#     empty_nest    30..90   WIDEST. Real retirement choices genuinely diverge: some downsize into
#                            walkable centres, others leave for somewhere quiet. Under a stage
#                            CONSTANT one of those has to lose and the map only ever produces the
#                            winner. ***The disagreement about which way retirees move was the
#                            evidence that this is a range and not a value.***
#     family        30..40   NARROWEST. Schools matter to nearly all of them.
#     mature_family 25..40
#     young         60..90   Leans central, fairly varied.
#     childless     65..90   Leans central and stays there.
#
# ⚠ NOTHING HERE IS A CLAIM ABOUT REAL HOUSEHOLDS. All ten numbers are PROVISIONAL, chosen by taste,
# naming no ratifier and opening no plans/0002 §D row -- plans/0045 standing order 4 suspends
# adr/0052 for exactly this. 🔴 WHAT WOULD RATIFY ONE IS A CITY WITH A HOUSING MARKET IN IT: a
# preference for the centre is only meaningful against something that makes the centre cost more, and
# `rent` is UNBUILT -- adr/0070, a mechanism nobody has written rather than evidence about what the
# preference should be. ***THE NUMBERS THIS FILE PRODUCES RATIFY NOTHING.***
#
# ⚠ THE AXIS IS SPACE AGAINST CENTRALITY AND IT IS ONE OF THREE. adr/0027 names quiet-against-variety
# and rent-against-commute too, and neither is built. Centrality shipped first because it is the only
# one the world can already measure: distance to the nearest [[lattice]] origin needs no new state,
# where quiet needs a pollution Layer that is zero on every shipped file but fouled.toml, and rent
# needs a price a dwelling does not have.
#
# ⚠ A NEUTRAL HOUSEHOLD IS NOT A SPECIAL CASE. Placement scores `distance * (2T - 1)` and takes the
# smallest, so a base of 50 with a width of 0 weighs exactly zero, every candidate ties, and the
# family takes the dwelling the old first-with-room accept would have given it. That is why the other
# 29 shipped Rulesets produce the same city, State Hash for State Hash, with this mechanism in the
# build -- and why the gate is "does any stage state an opinion" rather than "does this Household
# have one". A city of neutral Households would make the same CHOICE and consume a different number
# of DRAWS.
#
# ⚠ IT IS A COMPARISON AND NEVER A THRESHOLD. Nothing refuses a dwelling. A Household takes the best
# of the three it was shown, which is adr/0017 satisficing rather than optimising; a family that
# dislikes all three still moves in. A preference that could refuse would fill the Unplaced Pool for
# a reason no Ruleset authored, and on a file with no gives_up_after_days it would fill it for ever.

# The keys below are minimal.toml's and its comments carry their arguments -- read them there.
# What is commented HERE is what this file changes and why.

[[resource]]
name = "sundries"
family = "good"

[[resource]]
name = "repairs"
family = "good"

[[resource]]
name = "money"
family = "money"

[[business]]
name = "shop"
jobs = 8
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[building]]
name = "dwelling"
bins = [
    { resource = "sundries", capacity = 48, owner = "occupant" },
    { resource = "repairs",  capacity = 4 },
]
# HOW MANY DAYS A PREMISES RULE MAY STARVE CONTINUOUSLY before the Building is condemned and
# abandoned. adr/0141's premises half; the tenant half is `tenancy_ends_after_days`, which this
# file does not state because its tenants are fed.
#
# !! IT WAS `condemn_after = 4` AND THAT WAS 45 IN-WORLD MINUTES. The old key counted FIRINGS a
# starved Rule may miss, so its value had to be read against the Rule's own `rate` to mean
# anything: 4 missed firings of `upkeep` at rate 16 is 64 Ticks. Nothing on the page said so, the
# value stood at 4 in all eighteen shipped files, and NO AUTHOR EVER CHANGED IT -- because no
# author could see what it said. A dwelling here lived about half an in-world Day.
#
# So milestone 17 authored the felt quantity and derived the count, which is adr/0059 and
# adr/0130's rule arriving at the one key that had gone the other way. THE FLOOR IS NOW ONE DAY
# AND 45 MINUTES IS NOT EXPRESSIBLE AT ALL, which is the point of the unit rather than a side
# effect of it.
#
# !! UNRATIFIED, and plans/0002 D1 holds it. This is a stopwatch setting: what it dials with
# `collapses_after_days` is WHAT SHARE OF THE CITY IS DERELICT at steady state, and that share is
# a ratio of the two -- roughly blight / (life + blight). QUOTE THE CENSUS AND NEVER THE
# ARITHMETIC: this file's header carries the measured numbers and an earlier version of it
# carried a paper figure that was wrong by a factor of two.
condemn_after_days = 2
# The sink for what condemn_after_days creates: how many Days the empty shell stands before it
# collapses and the Lot returns to vacant (adr/0091, milestone 17). REQUIRED wherever
# condemn_after is stated -- a kind that can be abandoned and cannot collapse accumulates
# shells for ever, which is adr/0006, and the loader refuses it.
#
# !! A STOPWATCH SETTING AND NOT A DESIGN CLAIM, exactly as crowded.toml's two are. What this
# number actually dials, together with condemn_after_days above, is WHAT SHARE OF THE CITY IS
# DERELICT at steady state -- because the share is a RATIO of the two and not a property of
# either. A shell that stands 1 Day in a city whose Buildings live 2 is a third of the stock; the
# same 1 Day against a life of half a Day is two thirds, which is what this file measured when
# the threshold above was 45 minutes.
#
# !! ONE DAY IS THE FLOOR THE UNIT ALLOWS and it is chosen so the demonstration demonstrates:
# a shell that a short run can watch appear, stand and fall. A city a player would live in
# wants a gentler failure rate AND a longer blight, and that pair is UNRATIFIED with no world
# to settle it -- plans/0002 D1, ratified by the first play session in which somebody watches
# a district decline, which is adr/0091's own ratifier for the clearance price.
collapses_after_days = 1
occupants = 4
business = "shop"
parking = 8

[[rule]]
name    = "restock"
kind    = "dwelling"
rate    = 8
apply   = { min = 1, max = 4 }
inputs  = []
outputs = [ { scope = "local", resource = "sundries", amount = 4 } ]

[[rule]]
name    = "consume"
kind    = "dwelling"
rate    = 32
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "sundries", amount = 4 } ]
outputs = []

[[rule]]
name    = "upkeep"
kind    = "dwelling"
rate    = 16
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "repairs", amount = 4 } ]
outputs = []

[[zone_rule]]
name          = "housing"
kind          = "dwelling"
zone          = 0
interval      = 32
revisit_ticks = 2048

[placement]
interval      = 32
revisit_ticks = 1024
candidates    = 3
# REQUIRED HERE AND ABSENT FROM declining.toml, and the loader is what said so. A [[life_stage]]
# stating `children_become` sends grown children into the Unplaced Pool, which is a door into it
# exactly as a gate kind is -- and a Pool with a door and no give-up rule grows without bound, which
# adr/0006 forbids. The refusal arrives at LOAD rather than as a slow leak nobody watches, which is
# the whole point of putting a bound a Ruleset can violate in the loader.
#
# 🔴 PROVISIONAL, chosen by taste, no ratifier and no plans/0002 §D row (plans/0045 standing order 4).
# It is bordered.toml's value, taken because it is the only other shipped number of this shape and
# not because anything measured it here.
gives_up_after_days = 120

[layers]
noise_range_metres            = 300
noise_intensity_percent       = 400
desirability_pollution_percent = 100
desirability_noise_percent     = 100
pollution_period      = 64
pollution_offset      = 0
land_value_period     = 256
land_value_offset     = 16
kernel_metres         = 1024
pollution_decay_ticks = 2048
land_value_tau        = 8

[roads]
block_tiles                    = 32
arterial_count                 = 0
arterial_junction_tiles        = 512
foot_crossing_every            = 4
foot_paths_per_thousand_blocks = 40
street_speed_kph               = 50
arterial_speed_kph             = 90
walk_speed_kph                 = 5
street_capacity_per_hour       = 3600
arterial_capacity_per_hour     = 12000
foot_path_capacity_per_hour    = 1000

[lots]
lots_per_segment = 5

[parking]
radius_metres = 400
shed_keeps = 24

[trips]
crossing_seconds = 30
commute_fast_minutes = 20
commute_moderate_minutes = 40
commute_budget_minutes = 50

[jobs]
interval      = 32
revisit_ticks = 1024
candidates    = 3
shift_hours_min = 6
shift_hours_max = 10
arrive_early_max_minutes = 15
# ---------------------------------------------------------------------------------------------------
# THE STAGE TABLE. adr/0011's five, in the order it lists them, with `next` AUTHORED rather than taken
# from that order -- see the header for why the chain is not a line.
#
# young -> family -> mature_family -> empty_nest -> (terminal)
# childless: declared, unreachable until stage 3's fertility decision exists.
# ---------------------------------------------------------------------------------------------------
# THE FERTILITY DECISION, and the band is the whole of it. adr/0011: "Decision: how many children,
# possibly zero. Zero sends the Household to Childless; otherwise to Family."
#
# 0..3 STRADDLES REPLACEMENT ON PURPOSE. Two children per Household is EXACT Citizen replacement --
# two adults replaced by two -- and adr/0011 is emphatic that the threshold "falls out of
# conservation rather than being chosen". A band whose whole range sat above or below 2 would make
# the outcome a restatement of this file; one straddling it makes Replacement Rate a reading of the
# city. The mean of 0..3 is 1.5, so THIS WORLD IS BELOW REPLACEMENT BY CONSTRUCTION and the
# population declines. That is a property of the band and not a finding about cities.
#
# 🔴 THE DRAW IS UNCONDITIONED. adr/0011 conditions fertility on housing cost, dwelling size and job
# security, and the discrete-choice machinery all three would read is UNBUILT -- adr/0070, which
# says that is a mechanism nobody has written rather than evidence about what fertility should be.
# So do not read a number out of a run of this file as a statement about affordability.
#
# UNRATIFIED, chosen by taste, no plans/0002 §D row. plans/0045 suspends adr/0052 to allow that.
[[life_stage]]
name          = "young"
duration_days = 24
spread_days   = 8
centrality_base_percent   = 60
centrality_spread_percent = 30
next          = "family"
childless     = "childless"
children_min  = 0
children_max  = 3
# The age an adult carries, in Days, drawn on formation and NEVER ADVANCED -- adr/0011, and adr/0010
# is why: real ageing is arithmetically impossible under one clock. It is stated HERE because this is
# the stage children become adults in, and the loader refuses a children_become target without it.
#
# ⚠ 1..160 IS THE LENGTH OF A LIFE IN THIS FILE and not a human age. A full chain is ~160 Days at the
# floor, so the band spans one lifetime -- which is the only scale this world has. There is no
# calendar and CONTEXT.md bans inventing one, so a number that looked like human years would be a
# unit this project does not have.
#
# ⚠ ZERO IS NOT IN THE BAND and cannot be: zero is what a CHILD carries, and it is the only marker of
# childhood there is. plans/0046 stage 4 is the gate that reads it.
adult_age_min_days = 1
adult_age_max_days = 160

[[life_stage]]
name          = "family"
duration_days = 48
spread_days   = 16
centrality_base_percent   = 30
centrality_spread_percent = 10
next          = "mature_family"
# adr/0011: "On exit the children become adults and form new Young Households, entering the Unplaced
# Pool." That is stage 3 and it is why THIS row is the one to watch when generation lands -- under
# stage 1 its exit is an ordinary scheduled transition and spawns nobody.
[[life_stage]]
name           = "mature_family"
duration_days  = 48
spread_days    = 16
centrality_base_percent   = 25
centrality_spread_percent = 15
next           = "empty_nest"
children_become = "young"
# Adults who never had children. REACHABLE AS OF STAGE 3, and it is `young`'s zero draw that reaches
# it. Under stages 1 and 2 nothing routed into it at all, because the only
# thing that would is the fertility decision. Terminal, like empty_nest, and kept separate from it
# because they are different diagnoses -- see the header.
[[life_stage]]
name          = "childless"
duration_days = 40
spread_days   = 16
centrality_base_percent   = 65
centrality_spread_percent = 25
# Adults whose children have left. Terminal under stage 1, which is why a long run of this file ends
# with the whole city here. Dissolution is stage 2.
[[life_stage]]
name          = "empty_nest"
duration_days = 40
spread_days   = 16
centrality_base_percent   = 30
centrality_spread_percent = 60
