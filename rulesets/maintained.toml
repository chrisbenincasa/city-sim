# declining.toml with a REPAIR SUPPLY. It models no city, and it is not the beginning of one.
#
# THE DIFF AGAINST declining.toml IS EXACTLY ONE RULE, and that diff is the whole demonstration.
# `maintain` gives `repairs` a producer. Everything else is byte-identical.
#
# 🔴 !! IT WAS "ONE RULE AND TWO EDITS TO ANOTHER" UNTIL 2026-09-02, AND THE TWO EDITS BROKE THIS FILE
# THE DAY OCCUPANCY STARTED DIVIDING THE GROUND. `upkeep` had `apply = { derived = "occupancy" }` with
# `amount = 1`, which was the same draw as declining's `{ min = 1, max = 1 }` with `amount = 4` for
# exactly as long as EVERY DWELLING HELD FOUR -- because a kind DECLARED how many it held. Three
# separate places in this file were quietly writing that same 4 down: the consumer's scaling, the
# producer's `max`, and the `repairs` Bin's `capacity`. plans/0053 made occupancy a function of the
# parcel, so a dwelling now holds anything from 1 to 13 here; `upkeep` began drawing up to 13 against
# a Bin that holds 4, WHICH CAN NEVER BE FILLED, and THIS FILE STARTED CONDEMNING BUILDINGS -- 31 of
# 228 at 2,000 Citizens over 8,192 Ticks.
#
# ⚠ IT IS THE PARAGRAPH BELOW ARRIVING, WORD FOR WORD: *"a run of this file that DID condemn
# something would be a defect and is worth looking at, because it would mean the producer had stopped
# keeping up."* It stopped keeping up, and the instrument that said so was
# `MaintainedRulesetTests` on the day.
#
# ⚠ WHY THE REPAIR IS TO DROP THE SCALING RATHER THAN TO SCALE THE OTHER TWO. A Bin's `capacity` is
# authored per KIND, so a file cannot state a larder that covers a ceiling it does not know -- the
# ground decides that, and the ground is not in this file. ***A consumer whose draw derives from the
# ground, feeding out of a store that does not, is unsatisfiable by construction on the largest
# parcels.*** So this file stops depending on occupancy at all, which is what its first line already
# says it wants: it models no city, and its point is the PRESENCE of one Rule. A per-occupant Bin
# capacity is the real fix and it is filed in plans/0053 rather than invented here.
#
# !! WHAT IT EXISTS TO SHOW: A BUILDING THAT STARVES AND THEN RECOVERS. On declining.toml `upkeep`
# draws on a Bin nothing fills, so it starves from its first firing and never stops -- every dwelling
# is condemned with probability 1 and the threshold only sets how long that takes. That world can
# demonstrate the pressure CLOCK and it cannot demonstrate the pressure being RELIEVED, which is half
# the mechanism and the half a player would actually see.
#
# !! THE RECOVERY PATH WAS ALREADY BUILT AND HAD NEVER BEEN REACHABLE. RuleEngine.Stop zeroes
# StarvedSince on any blocking reason other than Supply, and a Rule that succeeds never reaches Stop
# at all -- so a Building whose supply returns is healed completely and immediately, with no decay
# term and no second mechanism. NOTHING IN THE REPOSITORY EXERCISED IT, because no shipped Ruleset
# could put anything in `repairs`. This file is one Rule long and it is the first thing that does.
#
# ---------------------------------------------------------------------------------------------------
# !! WHY THERE IS NO SCARCITY HERE, WHICH IS THE PART TO READ BEFORE READING ANYTHING INTO A NUMBER.
#
# `maintain` HAS NO INPUTS, so it can never fail on supply. That is not laziness -- it is the only
# shape available, and the reason is worth writing down because it looks like an omission and is a
# named hole. A premises Rule needing a scarce input has five places to draw on and every one is shut:
#
#   local   -- another premises Bin, which needs its own producer. Turtles: the chain has to bottom
#              out in a Rule with no inputs, and that Rule never fails.
#   pool    -- the District market, and the honest answer. Scope.Pool THROWS; adr/0045's ladder starts
#              there and Phase 2 owns it.
#   global  -- the treasury. Money-family Resources ONLY, and adr/0113 says a Building never holds
#              money, so a premises Rule cannot buy anything at all. That is adr/0136's "Upkeep is
#              UNPLACED" arriving as a compile error rather than as a design note.
#   map     -- WRITE-ONLY by construction (Scope.Map): a Layer cell has no capacity to exceed, so a
#              map term can never fail and no Rule ever waits on one.
#   the tenant's Bins -- REFUSED at the parse site. A Rule addressing both the premises' Bins and the
#              Occupant's has no subject to run on, and "a term crossing an ownership boundary is a
#              trade, which is scope = pool". So the obvious design -- the household pays for its own
#              upkeep out of the larder -- is unauthorable until the same missing scope arrives.
#
# !! SO A PREMISES RULE CHAIN TODAY IS ALWAYS-SUCCEEDS OR NEVER-SUCCEEDS, AND THERE IS NO MIDDLE.
# declining.toml is the second; this file is the first. A world where SOME buildings fail and others
# do not needs scarcity from somewhere the Building does not control, and every such source is unbuilt
# (adr/0070: unbuilt, not refused -- the answer to "should something compensate" is BUILD IT).
#
# !! WHAT THAT MEANS FOR THE NUMBERS. Nothing here is condemned, so this file cannot ratify
# condemn_after_days, collapses_after_days, or any share of a city. It states both decline keys and
# they are DELIBERATELY INERT -- present so that the contrast with declining.toml is one Rule and not
# a different world. A run of this file that DID condemn something would be a defect and is worth
# looking at, because it would mean the producer had stopped keeping up for two continuous Days.
#
# ---------------------------------------------------------------------------------------------------
# !! MEASURED, at 10,000 Citizens over 32,768 Ticks:
#
#     1201 built, 0 abandoned, 173 vacant     (--zones, after-state -- IDENTICAL to the before-state)
#     0 Buildings raised, 0 condemned, 0 tenancies ended
#
# against declining.toml's 619 built / 391 abandoned / 364 vacant and 3,168 condemned on the same
# seed, the same population and the same run length. ***ONE RULE IS THE WHOLE DIFFERENCE BETWEEN A
# CITY THAT LOSES HALF ITS STOCK AND ONE THAT LOSES NONE OF IT.***
#
# !! AND THE PRESSURE IS NOT ZERO, WHICH IS THE POINT. --evidence at 4,000 Citizens over 8,192 Ticks
# reports the WORST-OFF standing Building in the city at ONE missed firing, against a threshold of
# 4,096 Ticks, with `maintain` and `upkeep` both `ok`. So dwellings really do go short and really do
# recover; the sawtooth is there and it never climbs. ***A world where nothing declines because
# nothing can starve would prove nothing; this one starves and heals.***
#
# !! THE PREDICTION ABOVE FIRED ONCE, ON THIS FILE, AND CAUGHT A REAL DEFECT. The first version of
# `maintain` was NOT greedy, and the run condemned 1,031 Buildings and produced a census within three
# rows of declining.toml's. The paragraph saying that would be a defect is what sent somebody to
# --evidence, where `maintain … space … last ran 40` sat beside `upkeep … supply … 510 missed` on one
# Bin holding 1 of 4. See the note on the Rule itself. ⚠ ***A header that states what a correct run
# looks like is what makes an incorrect one legible***, and this is the whole argument for these
# headers carrying measurements rather than intentions.
#
# ---------------------------------------------------------------------------------------------------
# !! HOW THE PRESSURE ACTUALLY OSCILLATES, which is the thing to watch in --evidence.
#
# `maintain` puts 4 repairs in every 32 Ticks. `upkeep` takes 4 every 16 -- twice as often as they
# arrive -- so the Bin runs dry, upkeep fails on Supply, StarvedSince is stamped, and the Rule
# SUBSCRIBES rather than retrying (adr/0045). The next `maintain` writes the Bin, that write wakes it,
# it succeeds, and the clock goes back to zero.
#
# !! SO PRESSURE IS SAWTOOTHED RATHER THAN MONOTONIC, and the threshold is never approached.
#
# 🔴 !! THIS PARAGRAPH SAID *PER HOUSEHOLD* UNTIL 2026-09-02 and it was the same sentence the top of
# this file has now withdrawn. Its claim -- ***occupancy is the only thing in this world that varies
# between buildings*** -- was true when it was written and is the exact thing plans/0053 changed: a
# dwelling's ceiling is now its parcel's floor area over a rate, so the variation is still there and
# it comes from the GROUND rather than from the tenancy count. What the `occupancy` Readout could not
# survive was being read by a consumer whose store does not scale with it. ⚠ THE READOUT IS ONCE
# AGAIN DECLARED AND CALLED BY NOTHING, which is where milestone 25 left it and where this file found
# it; that is filed rather than papered over with a caller invented to justify it.
#
# !! THE THREE RATE NUMBERS ARE STOPWATCH SETTINGS AND NOT DESIGN CLAIMS. 4 per 32 against 1 per 16 is
# chosen so a full dwelling oscillates visibly and an empty one does not, on a file whose whole job is
# to make the oscillation watchable. They are UNRATIFIED and this file can ratify nothing: a supply
# with no cost and no source is not a maintenance economy, it is a tap.
#
# Slice 7 task 10a of plans/0011-rule-engine-bins-and-rules.md. Its whole job is to be the smallest
# content that makes Bins move, so that the wiring underneath it — a Ruleset reaching a World, a
# Building given its kind's Bins and Rule Instances when it is built, an arming stagger — is exercised
# by a running city rather than by a test that builds the same shape by hand.
#
# WHY IT NAMES NO GOOD. 04 §1's five Goods are Produce, Food, Timber, Materials and Consumer Goods,
# and every one of them is produced by one Building and consumed by another. That crosses an ownership
# boundary, which is the `pool` scope, which is a named hole that throws until Phase 2 brings roads,
# Districts and connectivity. So a Ruleset that could run today and also name a Good would be claiming
# a chain it cannot express. `sundries` is deliberately a word for goods too unimportant to name:
# nothing in this file should be read as a decision about content. Choosing the Goods is decision
# owed 4, and it belongs to task 10b with the chain it is for.
#
# WHY THERE IS NO on_fail CHAIN. A link rescues by relieving the Bin the head failed on, from a source
# the head could not reach. Every source available today is the Building's own Bins, so a chain here
# would be a Rule rescuing itself. adr/0045's ladder starts at the District Pool, and that is task 10b.
#
# WHY IT EMITS NO POLLUTION. Not because it would be unbounded — adr/0051's decay is built, so a `map`
# term is now a stock the environment absorbs and settles at a level proportional to the emission rate.
# It emits nothing because a dwelling is not industry. `02 §2.4` gives industrial pollution point
# sources, and inventing a smokestack here to exercise a code path would be this file claiming
# something about content, which its first line says it does not. The Rule engine's `map` output is
# covered by `RuleEvaluationTests`, and the absorption by `LayerFieldsTests` and `LayerLongRunTests`.
#
# THE GOODS QUANTITIES AND THE BIN CAPACITIES BOTH x4 ON 2026-08-13, AND IT CHANGED NOTHING THIS CITY
# DOES. adr/0094 took TICKS_PER_DAY from 8192 to 2048 and says the Goods quantities scale x4: a Day
# holds a quarter as many firings, so a per-firing `amount` goes x4 to keep the rate in Goods per Day.
# That is airtight and it is only half the edit -- the capacities had to follow, and they follow for a
# DIFFERENT reason, which is the part worth reading.
#
# `amount` AND `capacity` ARE BOTH IN GOODS AND THEY ARE DENOMINATED DIFFERENTLY. `amount` is
# Days-denominated: hold Goods per Day, so the number moves x4. `capacity` is TICKS-denominated: what
# has to hold is FIRINGS HELD -- capacity / (amount x occupants) -- and firings x rate is a DURATION.
# It is written in Goods, so keeping that duration still REQUIRES moving the number, and it moves x4
# only because `amount` did. THE UNIT OF A QUANTITY IS NOT ITS DENOMINATION.
#
# WHAT KEEPING capacity = 12 WOULD HAVE DONE. The larder would have held ONE firing of `consume` where
# it held four. In in-world time the two read identical -- 22.5 minutes of supply either way -- so
# measured in Goods nothing is wrong. Measured in firings held, every Bin in the game shrank by four,
# and a Bin that must be EXACTLY FULL for one `consume` to succeed is a knife edge. It fired
# Invariant.WaiterIsBlockedByTheBinItNames and exposed a live defect in the wake path, filed unfixed as
# plans/0003 queue item 8.
#
# IT IS BEHAVIOUR-NEUTRAL, MEASURED, AND THE COMMIT FIRST CLAIMED OTHERWISE. Running the pre-rescale
# file and this one for 4,096 Ticks gives a BYTE-IDENTICAL 86-line census -- buildings 1,201 -> 642, the
# Unplaced Pool, rule evaluations, Trips, every row. Only the State Hash moved, because Bin levels are
# four times larger. The commit said "a dwelling now holds 90 in-world minutes where it held 22.5, which
# is a change to the world": the digits are right and the comparison was never stated. The larder is
# 4 firings x rate 32 = 128 TICKS, and it was 128 Ticks before the clock moved too. 90-vs-22.5 is HEAD
# against the PRE-CLOCK world, which is adr/0094's cost arriving in one more place, not this edit's.
# plans/0012 Cause 5: a number that is one half of a ratio says which half.
#
# NOTHING HERE CAME OUT OF PROPORTION, because everything in this file is denominated in FIRINGS --
# `condemn_after` included, which says so at the [[building]] below. A dwelling's whole life is 4 missed
# `upkeep` firings x rate 16 = 64 Ticks, which went 11.25 -> 45 in-world minutes by the same x4.
#
# 48 IS A COST DIAL HERE, NOT A BALANCE DIAL, AND THAT IS MEASURED TOO. Swept at 24, 36, 48 and 96, NO
# ROW OF THE CENSUS MOVES; only `rules due` and `rules evaluations` move, and they move UP with capacity
# (20,134 -> 25,023 at the first reading, 48 -> 96), because a deeper larder gives `restock` more
# space to keep working. A BIGGER BUFFER COSTS MORE, NOT LESS. The larder decides nothing because it
# is DEEPER THAN THE BUILDING'S LIFESPAN: nothing in this file produces `repairs`, so `upkeep` condemns
# every dwelling at 64 Ticks and a 128-Tick larder absorbs a shock that never arrives. Restoring 22.5
# in-world minutes would need 2 firings held -- one above a known crash -- or `consume`'s rate quartered,
# which adr/0094 refused on cost. And 22.5 WAS NEVER CHOSEN: it is `capacity = 12` in a file whose first
# line says it models no city (adr/0070).
#
# THE STEADY STATE IS THE POINT, AND IT IS A SURPLUS ONE. Production outruns consumption, so the Bin
# sits near its ceiling and `restock` is the Rule that fails: it sleeps on space, `consume` draws
# and wakes it, it refills and sleeps again. Both Rules move for ever, nothing trends, and no Rule is
# ever wrongly asleep. THE SHORTAGE REGIME IS NOT AVAILABLE AND THAT IS AN ENGINE PROPERTY RATHER THAN
# A TASTE: a recorded shortfall is a deficit at the instant of failure and the wait list wakes on the
# arriving quantity, so a consumer short of 3 is never woken by three arrivals of 1. Producing in a
# quantum at least as large as any consumer's deficit is what makes this file's steady state honest.
# See finding 41.
#
# WHY EVERY DWELLING FALLS DOWN, AND WHY THAT IS NOT A BALANCE MISTAKE. Slice 10 task 7 needs a
# Building that is *continuously* starved, because failure pressure is a duration and a Rule that is
# rescued resets it (adr/0053). Nothing in this file could supply one: the only Rule that fails here
# is `restock`, and it fails on SPACE — the Bin is full, which is the healthy state of a producer
# with nobody to sell to, and the amended adr/0053 reads only starvation. So `upkeep` was added, and
# it draws on a Resource this file deliberately never produces. Every dwelling therefore declines,
# which is total rather than selective because there is one kind and it has one behaviour. A city
# where some Buildings thrive and others do not needs Buildings that differ, which needs content, and
# content is what the first line of this file says it is not. The cycle it does produce is real: a
# condemned dwelling is demolished, its Households go to the Unplaced Pool, its Lot goes vacant, and
# the [[zone_rule]] below raises another — which is the first time anything in this project has both
# built and unbuilt, and the first time slice 5 task 7's `slots` assertion has had a table that churns.
#
# It is deleted rather than grown when task 10b becomes possible.

# The keys below are minimal.toml's and its comments carry their arguments -- read them there.
# What is commented HERE is what this file changes and why.

[[resource]]
name = "sundries"
family = "good"

[[resource]]
name = "repairs"
family = "good"

[[resource]]
name = "money"
family = "money"

[[business]]
name = "shop"
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[building]]
name = "dwelling"
bins = [
    { resource = "sundries", capacity = 48, owner = "occupant" },
    { resource = "repairs",  capacity = 4 },
]
condemn_after_days = 2
collapses_after_days = 1
tenanted = true
# Whether it parks at all -- the count is floor area over [capacity] floor_tiles_per_parking_space.
parked = true
business = "shop"

[[rule]]
name    = "restock"
kind    = "dwelling"
rate    = 8
apply   = { min = 1, max = 4 }
inputs  = []
outputs = [ { scope = "local", resource = "sundries", amount = 4 } ]

[[rule]]
name    = "consume"
kind    = "dwelling"
rate    = 32
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "sundries", amount = 4 } ]
outputs = []

[[rule]]
name    = "maintain"
kind    = "dwelling"
rate    = 32
apply   = { min = 1, max = 4 }
inputs  = []
outputs = [ { scope = "local", resource = "repairs", amount = 1 } ]

[[rule]]
name    = "upkeep"
kind    = "dwelling"
rate    = 16
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "repairs", amount = 4 } ]
outputs = []

[[zone_rule]]
name          = "housing"
kind          = "dwelling"
zone          = 0
interval      = 32
revisit_ticks = 2048

[placement]
interval      = 32
revisit_ticks = 1024
candidates    = 3

[layers]
noise_range_metres            = 300
noise_intensity_percent       = 400
desirability_pollution_percent = 100
desirability_noise_percent     = 100
pollution_period      = 64
pollution_offset      = 0
land_value_period     = 256
land_value_offset     = 16
kernel_metres         = 1024
pollution_decay_ticks = 2048
land_value_tau        = 8

[roads]
block_tiles                    = 32
arterial_count                 = 0
arterial_junction_tiles        = 512
foot_crossing_every            = 4
foot_paths_per_thousand_blocks = 40
street_speed_kph               = 50
arterial_speed_kph             = 90
walk_speed_kph                 = 5
street_capacity_per_hour       = 3600
arterial_capacity_per_hour     = 12000
foot_path_capacity_per_hour    = 1000

[lots]
lots_per_segment = 5
# The most ground a Building leaves on each side of its parcel. A LENGTH and not a fraction, so
# coverage rises with the parcel -- see minimal.toml, which carries the argument.
setback_tiles = 2

[capacity]
# How much floor one tenancy, job or parking space takes, in Tiles -- see minimal.toml, which carries
# the argument and the measurement. A kind says WHETHER it houses; the count derives from the ground,
# and the three rates are what the standing city already said about a detached building, divided.
floor_tiles_per_occupant      = 25
floor_tiles_per_job           = 3
floor_tiles_per_parking_space = 12

[parking]
radius_metres = 400
shed_keeps = 24

[trips]
crossing_seconds = 30
commute_fast_minutes = 20
commute_moderate_minutes = 40
commute_budget_minutes = 50

[jobs]
interval      = 32
revisit_ticks = 1024
candidates    = 3
shift_hours_min = 6
shift_hours_max = 10
arrive_early_max_minutes = 15
