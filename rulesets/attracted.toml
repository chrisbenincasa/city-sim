# attracted.toml -- welcomed.toml with a COUNTED population behind each edge, so the people who
# arrive come out of somewhere and stop coming when it empties.
#
# THE FIRST SHIPPED WORLD IN WHICH NOBODY ASKS FOR AN ARRIVAL. welcomed.toml gave the simulation a
# say in who crosses a gate, and its header records the win: there is no immigration rate, a
# prospect compares and crosses or does not. What it could not do is supply the prospect. Every
# candidate in that world still arrived because `Simulation.ApplyArrive` was handed an `Arrive`
# command, so the decision was real and the FLOW was still a caller's. This file removes the caller.
#
# WHAT IT DEMONSTRATES: the stock half of adr/0023. A [[hinterland.population]] states how many
# Households of one exact composition stand behind an edge -- a Life Stage, adults at each Skill
# Tier, children, and which third of the purse range they carry. Those Households reconsider the
# city on a cadence, present themselves, are weighed by welcomed.toml's own choice model, and are
# admitted through the same gate quota as before. Admitting one SPENDS it. The edge holds fewer
# people afterwards.
#
# ⚠ A COMPOSITION IS A STORAGE KEY AND NOT A DOMAIN ACTOR. CONTEXT.md bans Cohort by name and this
# is not one: nothing in a group decides anything together, and the group is split the moment one of
# its Households leaves. It is the ordinary word for who a family is made of, and it is aggregate
# only so that an edge holding 600 identical families costs 600 numbers rather than 600 rows.
#
# ⚠ THE OUTSIDE REFILLS, AND `recovery_days` IS NOT A BIRTH RATE. It is how long the stock takes to
# return to the count this file authored, from either direction: below target it adds, above target
# it removes and reports the removal as turnover. NO CLAIM IS MADE THAT CITY PLUS OUTSIDE IS A
# CLOSED SYSTEM. Replenishment and turnover are named external flows and the account says so.
#
#     west    600 young  +  200 family  +  100 empty nest      nearest, dearest to leave
#     south   600 young  +  200 family  +  100 empty nest
#     east    600 young  +  200 family  +  100 empty nest
#     north   600 young  +  200 family  +  100 empty nest      dear and remote -- most willing
#
# The four edges hold the SAME people and differ only in what welcomed.toml already made them differ
# in -- rent, centrality and purse range. That is deliberate: it makes the difference in who arrives
# attributable to the Outside economy rather than to a demographic mix somebody authored to produce
# the answer.
#
# ⚠ EVERY NUMBER IN [immigration] AND EVERY `households` COUNT IS PROVISIONAL AND CHOSEN BY TASTE.
# None is measured, none is ratified, and the amnesty's standing order 4 is why there is no
# ratification row to point at. They are starting content for an observation that has not been made.
#
# ⚠ WHAT THIS FILE DOES NOT YET DEMONSTRATE: nothing here has been watched. plans/0073 owns the
# episodes -- onset, selective depletion, scarcity and recovery, return, turnover -- and this file
# is the world they will be run in rather than a record that they were.
#
# ⚠ IT INHERITS welcomed.toml's WARNINGS UNCHANGED, including the compressed `arrivals_per_day` and
# `gives_up_after_days` it took from crowded.toml. The numbers here ratify nothing.

[[resource]]
name = "sundries"
family = "good"

[[resource]]
name = "repairs"
family = "good"

[[resource]]
name = "money"
family = "money"

[[business]]
name = "shop"
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[building]]
name = "dwelling"
bins = [
    { resource = "sundries", capacity = 48, owner = "occupant" },
    { resource = "repairs",  capacity = 4 },
]
houses   = true
premises = true
# A price to compare a Hinterland's against. Without one V_here is zero for everybody and the four
# edges are told apart by nothing.
rent = 400
# Whether it parks at all -- the count is floor area over [capacity] floor_tiles_per_parking_space.
parked = true
business = "shop"

[[building]]
name = "port"
arrivals_per_day = 96

[[hinterland]]
edge = "west"
rent = 900
centrality_tiles = 6000
emigrant_balance_min = 800
emigrant_balance_max = 4000


# Behind west: single people, families with two children, and couples whose children have gone.
# The three carry different purses, want different things from a home, and are drawn on separately.
[[hinterland.population]]
stage           = "young"
adults_by_tier  = [1, 0, 0]
children        = 0
money_band      = 0
households      = 600

[[hinterland.population]]
stage           = "family"
adults_by_tier  = [1, 1, 0]
children        = 2
money_band      = 1
households      = 200

[[hinterland.population]]
