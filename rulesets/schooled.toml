# The school Ruleset. It models no city, and it exists to make ONE THING VISIBLE.
#
# `aged.toml` WITH `[needs]` AND ONE MORE `[[building]]`, and that diff was the whole content.
# 🔴 ⚠ IT NO LONGER IS, AND THIS FILE IS THE OLDER aged.toml. On 2026-08-31 plans/0045 row 13 gave
# that file a dwelling-stock sink and HALVED ITS STAGE FLOORS TO DOUBLE THEIR SPREADS; neither
# change was propagated here, because plans/0046 scopes the window edit to aged.toml alone and
# every measured figure in this header was taken against the table below. ***A derived file that
# is not re-measured is not a derived file, so read this one as its own world.*** The
# new kind states `serves = "education"`, which is what makes it a service Building -- and it is the
# FIRST SHIPPED FILE IN WHICH THE PLAYER PLACES ANYTHING. Every other Building in every other world
# arrives because a Zone Rule filled in a permission set; a school arrives because somebody issued
# `service`, which is 01 section 5's one acknowledged placement exception.
#
# WHAT IT EXISTS TO SHOW: adr/0032, running. ***A Service reaches people by somebody making a
# journey.*** Education is an ATTENDED Need -- the Household travels -- so a school's reach is
# decided by the Road Graph and never by a radius. The single case that settled that record is what
# this file makes reachable: A SCHOOL ACROSS AN UNCROSSABLE ARTERIAL IS 200 m AWAY AND THERE IS NO
# ROUTE. A distance field calls that excellent; a Trip calls it impossible.
#
# ⚠ IT IS BUILT ON `aged.toml` FOR A REASON AND NOT FOR CONVENIENCE. Education is attended by
# CHILDREN, and a child is `Citizens.Age == 0` in a world that declares `[[life_stage]]`. On any
# other file every Citizen carries zero because nothing ever wrote the column, so `[[life_stage]]`
# is the only thing that tells a city of children from a city with no demographics -- and without it
# this mechanism would either school everybody or school nobody. ***A file demonstrating schools has
# to contain children.***
#
# ⚠ A CHILDLESS HOUSEHOLD IS NOT BADLY SCHOOLED, IT IS UNSCHOOLED, AND THE COLUMN SAYS SO BY NOT
# MOVING. `ServiceEngine` gives a Household with nobody to send NO OCCASION rather than a failed one.
# Read a zero here as "nobody in this family attends" as readily as "well served"; the two are told
# apart by the member list, never by the depth.
#
# ⚠ THE RETURN JOURNEY DOES NOT EXIST. A child walks to school and is at home at the end of the Day
# because nothing moved them -- which is exactly where the commute stood at 5b-bis, and is why
# `CitizenActivity` did not grow an `AtSchool`. A drop-off on a parent'"'"'s commute is specified by
# adr/0032 and is UNBUILT (adr/0070), so a child who cannot WALK to a school is recorded as unreached
# rather than driven: ***this world under-serves a car-owning family in a way the design says it
# should not.***
#
# ⚠ NO SCHOOL STANDS UNTIL A COMMAND PLACES ONE. There is no `[[zone_rule]]` on this kind and there
# must not be: the whole point of the exception is that the city does not site its own fire stations.
# So a run of this file with no `service` command in its log has a `school` kind, an education rate,
# and NOT ONE SCHOOL -- every Household with a child fails its occasion every Day and Education falls
# to the floor. That is the file working, not the file broken. `--school` is the instrument that
# places them.
#
# 🔴 EVERY NUMBER IN `[needs]` IS PROVISIONAL AND WAS CHOSEN BY TASTE. plans/0045 standing order 4
# suspends adr/0052 for the amnesty, so there is no ratifier and no plans/0002 section D row. THE
# NUMBERS THIS FILE PRODUCES RATIFY NOTHING -- not about schooling, not about how many schools a city
# needs, and not about what a walk to one should cost.
#
# ⚠ `education_degrade` AND `education_recover` ARE REFUSED IN EVERY FILE THAT DECLARES NO SERVING
# KIND, and required here because this one does. That is adr/0130'"'"'s rule for `gives_up_after_days`
# one table along: a rate nothing can reach reads on the page as a mechanism the world has.
#
# ⚠ `health` IS DECLARED NOWHERE HERE. The engine serves it identically -- adr/0032 puts a clinic
# with schools and not with fire -- and a second kind would demonstrate the same mechanism twice.

# The keys below are minimal.toml's and its comments carry their arguments -- read them there.
# What is commented HERE is what this file changes and why.

[[resource]]
name = "sundries"
family = "good"

[[resource]]
name = "repairs"
family = "good"

[[resource]]
name = "money"
family = "money"

[[business]]
name = "shop"
jobs = 8
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[building]]
name = "dwelling"
bins = [
    { resource = "sundries", capacity = 48, owner = "occupant" },
    { resource = "repairs",  capacity = 4 },
]
occupants = 4
business = "shop"
parking = 8

[[rule]]
name    = "restock"
kind    = "dwelling"
rate    = 8
apply   = { min = 1, max = 4 }
inputs  = []
outputs = [ { scope = "local", resource = "sundries", amount = 4 } ]

[[rule]]
name    = "consume"
kind    = "dwelling"
rate    = 32
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "sundries", amount = 4 } ]
outputs = []

[[rule]]
name    = "upkeep"
kind    = "dwelling"
rate    = 16
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "repairs", amount = 4 } ]
outputs = []

[[zone_rule]]
name          = "housing"
kind          = "dwelling"
zone          = 0
interval      = 32
revisit_ticks = 2048

[placement]
interval      = 32
revisit_ticks = 1024
candidates    = 3
# 🔴 THE POOL'S SINK, AND THE LOADER REFUSES THIS FILE WITHOUT IT. Until stage 3 the only door into
# the Unplaced Pool was a gate kind, so gives_up_after_days was required of a gated Ruleset and
# refused nowhere else. INTERNAL GENERATION IS A SECOND DOOR: `mature_family` sends its children into
# the Pool, and a Pool with a door and no give-up rule grows without bound -- adr/0006, arriving at a
# door that did not exist when the refusal was written.
#
# ⚠ THIS FILE HAS NO GATE, so nothing arrives from outside and everything in the Pool was BORN here.
# That makes the give-up the one adr/0011 actually describes: "an unaffordable city fails to house
# its own children and they become Departures -- you raised them and priced them out." The derived
# metric it names is RETENTION, of the Households the city generated.
#
# 60 Days is UNRATIFIED and chosen by taste. bordered.toml holds the designer's 120 for an arriving
# Household; half of that is a guess that a child leaving home is quicker to give up on the city it
# grew up in than a stranger is to give up on one it has never lived in. NOTHING MEASURES THAT.
gives_up_after_days = 60

[layers]
noise_range_metres            = 300
noise_intensity_percent       = 400
desirability_pollution_percent = 100
desirability_noise_percent     = 100
pollution_period      = 64
pollution_offset      = 0
land_value_period     = 256
land_value_offset     = 16
kernel_metres         = 1024
pollution_decay_ticks = 2048
land_value_tau        = 8

[roads]
block_tiles                    = 32
arterial_count                 = 0
arterial_junction_tiles        = 512
foot_crossing_every            = 4
foot_paths_per_thousand_blocks = 40
street_speed_kph               = 50
arterial_speed_kph             = 90
walk_speed_kph                 = 5
street_capacity_per_hour       = 3600
arterial_capacity_per_hour     = 12000
foot_path_capacity_per_hour    = 1000

[lots]
lots_per_segment = 5

[parking]
radius_metres = 400
shed_keeps = 24

[trips]
crossing_seconds = 30
commute_fast_minutes = 20
commute_moderate_minutes = 40
commute_budget_minutes = 50

[jobs]
interval      = 32
revisit_ticks = 1024
candidates    = 3
shift_hours_min = 6
shift_hours_max = 10
arrive_early_max_minutes = 15
# ---------------------------------------------------------------------------------------------------
# THE STAGE TABLE. adr/0011's five, in the order it lists them, with `next` AUTHORED rather than taken
# from that order -- see the header for why the chain is not a line.
#
# young -> family -> mature_family -> empty_nest -> (terminal)
# childless: declared, unreachable until stage 3's fertility decision exists.
# ---------------------------------------------------------------------------------------------------
# THE FERTILITY DECISION, and the band is the whole of it. adr/0011: "Decision: how many children,
# possibly zero. Zero sends the Household to Childless; otherwise to Family."
#
# 0..3 STRADDLES REPLACEMENT ON PURPOSE. Two children per Household is EXACT Citizen replacement --
# two adults replaced by two -- and adr/0011 is emphatic that the threshold "falls out of
# conservation rather than being chosen". A band whose whole range sat above or below 2 would make
# the outcome a restatement of this file; one straddling it makes Replacement Rate a reading of the
# city. The mean of 0..3 is 1.5, so THIS WORLD IS BELOW REPLACEMENT BY CONSTRUCTION and the
# population declines. That is a property of the band and not a finding about cities.
#
# 🔴 THE DRAW IS UNCONDITIONED. adr/0011 conditions fertility on housing cost, dwelling size and job
# security, and the discrete-choice machinery all three would read is UNBUILT -- adr/0070, which
# says that is a mechanism nobody has written rather than evidence about what fertility should be.
# So do not read a number out of a run of this file as a statement about affordability.
#
# UNRATIFIED, chosen by taste, no plans/0002 §D row. plans/0045 suspends adr/0052 to allow that.
[[life_stage]]
name          = "young"
duration_days = 24
spread_days   = 8
next          = "family"
childless     = "childless"
children_min  = 0
children_max  = 3
# The age an adult carries, in Days, drawn on formation and NEVER ADVANCED -- adr/0011, and adr/0010
# is why: real ageing is arithmetically impossible under one clock. It is stated HERE because this is
# the stage children become adults in, and the loader refuses a children_become target without it.
#
# ⚠ 1..160 IS THE LENGTH OF A LIFE IN THIS FILE and not a human age. A full chain is ~160 Days at the
# floor, so the band spans one lifetime -- which is the only scale this world has. There is no
# calendar and CONTEXT.md bans inventing one, so a number that looked like human years would be a
# unit this project does not have.
#
# ⚠ ZERO IS NOT IN THE BAND and cannot be: zero is what a CHILD carries, and it is the only marker of
# childhood there is. plans/0046 stage 4 is the gate that reads it.
adult_age_min_days = 1
adult_age_max_days = 160

[[life_stage]]
name          = "family"
duration_days = 48
spread_days   = 16
next          = "mature_family"
# adr/0011: "On exit the children become adults and form new Young Households, entering the Unplaced
# Pool." That is stage 3 and it is why THIS row is the one to watch when generation lands -- under
# stage 1 its exit is an ordinary scheduled transition and spawns nobody.
[[life_stage]]
name           = "mature_family"
duration_days  = 48
spread_days    = 16
next           = "empty_nest"
children_become = "young"
# Adults who never had children. REACHABLE AS OF STAGE 3, and it is `young`'s zero draw that reaches
# it. Under stages 1 and 2 nothing routed into it at all, because the only
# thing that would is the fertility decision. Terminal, like empty_nest, and kept separate from it
# because they are different diagnoses -- see the header.
[[life_stage]]
name          = "childless"
duration_days = 40
spread_days   = 16
# Adults whose children have left. Terminal under stage 1, which is why a long run of this file ends
# with the whole city here. Dissolution is stage 2.
[[life_stage]]
name          = "empty_nest"
duration_days = 40
spread_days   = 16
# ⚠ NO `jobs` AND NO `business`. adr/0026 makes a public job DEMAND-DETERMINED BY CATCHMENT -- ***you
# cannot fix unemployment by hiring everyone as a teacher, because the number of teachers is set by
# the number of children*** -- and nothing in the build sizes a payroll from a catchment. Employment
# moved to the TRADE at milestone 27 (adr/0141), so staffing a school would mean giving it a
# [[business]], which would make it a shop that happens to teach. That is adr/0070 UNBUILT: a school
# here employs nobody, and no number in this file says anything about public sector employment.
#
# ⚠ `occupants` IS ABSENT, SO NOBODY LIVES IN A SCHOOL. A service Building is attended and not
# inhabited, and a kind with room in it would be housed by the placement pass like any other.
[[building]]
name = "school"
footprint_tiles = 4
serves = "education"

[needs]
sustenance_degrade   = 4
sustenance_recover   = 1
satisfaction_degrade = 1
satisfaction_recover = 1
education_degrade    = 2
education_recover    = 2
floor = -1000
