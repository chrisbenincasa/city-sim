# The stocked Ruleset. It models no city, and it exists to make ONE THING VISIBLE.
#
# `hungry.toml` REWRITTEN ON SHARED DEFINITIONS. A `[[basket]]` says what one occupant uses in a Day;
# a `[[reserve]]` says how many Days a Bin sized from that basket holds; a `[[recipe]]` says what one
# application of a conversion takes and makes. The `consume` Rule names the basket instead of listing
# an input, the larder names the basket and a profile instead of stating a number, and the premises'
# `restock`/`upkeep` pair names recipes instead of listing terms.
#
# ⚠ THE NUMBERS ARE NOT `hungry.toml`'s AND THE SHAPE IS NOT EITHER. That file consumes 4 sundries a
# firing behind a ceiling of 48; this one consumes 250 a DAY behind a ceiling DERIVED as 750, and it
# adds a `repairs` source and sink that file has not got. ***This is not a re-spelling of hungry.toml
# that produces the same Ruleset.*** The quantities were chosen to make the arithmetic below legible,
# and nothing here is a claim about that file's balance.
#
# WHAT IT EXISTS TO SHOW: a daily quantity that DOES NOT DIVIDE EVENLY across the firings that spend
# it. `consume` re-arms every 32 Ticks and a Day is 2048, so it fires 64 times a Day; the basket
# states 250 sundries a Day, which is 3.90625 a firing. The engine takes the whole units and banks
# the remainder on the Bin (`BinTable.consumption_progress`), so 64 successful firings take 250 --
# not 192 from rounding each firing down, and not 256 from rounding up. ***A designer states the
# quantity they mean and the loader does not make them pick one that divides.***
#
# ⚠ THE LARDER'S CEILING IS DERIVED AND IS NOT A NUMBER IN THIS FILE. `reserve = { profile =
# "standard", basket = "basic" }` on the sundries Bin makes its capacity `use_per_day * days` --
# 250 * 3 = 750. Changing the basket to 300 moves it to 900 in the same edit. That is the point of
# the indirection: a shared consumption and the ceilings sized from it cannot drift apart, because
# there is only one number.
#
# ⚠ THE `repairs` BIN KEEPS A LITERAL CAPACITY, DELIBERATELY. A reserve is Days of cover and needs a
# rate of use to multiply; nothing consumes `repairs` here, so there is no rate and a literal number
# is the honest statement. Literal capacities remain supported everywhere and this file is not a
# claim that they are deprecated.
#
# THE THIRD SHARED DECLARATION IS `[[recipe]]`, AND IT SHARES THE OTHER HALF. A basket is what one
# actor consumes in a Day; a recipe is what a firing turns into what. `restock` below states its
# conversion once and the Rule names it, so a Rule's `inputs` and `outputs` move together with it.
# ***A recipe's amounts are per APPLICATION and not per Day***, so the `apply` band multiplies them --
# one to two applications here is one to two `repairs` -- and no Bin carries a remainder for it.
#
# ⚠ THE RECIPES MOVE `repairs` AND NOT `sundries`, AND THAT PRESERVES THE STARVATION. `hungry.toml`
# deletes `restock` so the larder is filled by nothing and `consume` really fails, which is the whole
# reason that file exists; refilling sundries here would erase it. `restock` and `upkeep` are
# minimal.toml's pair on the premises' own Good, so `repairs` has a source and a sink and its level
# stays bounded by the ceiling of 4 rather than by taste.
#
# ⚠ A RESERVE IS NOT `CONTEXT` -> Resource's *Storage*. That parameter is whether a Bin carries over
# between periods, and `RulesetLoader` holds `storage` open as a named hole on `[[resource]]` for it.
# A Household's Life-Stage-sized money buffer is also called a reserve in `CONTEXT`; that one is
# Money and is unrelated. Three uses of one word, and this file means only the first.
#
# ⚠ THE BASKET NAMES ONE GOOD AND THAT IS A LIMIT OF THIS FILE, NOT OF THE SHAPE. `use_per_day` maps
# as many Goods as an actor consumes; a second Good here would need a second Bin and a second sink to
# stay bounded, which is `hungry.toml`'s argument one file along.
#
# 🔴 EVERY NUMBER HERE IS PROVISIONAL AND WAS CHOSEN TO MAKE THE ARITHMETIC LEGIBLE. 250 a Day over
# 64 firings was picked because it divides badly. THE NUMBERS THIS FILE PRODUCES RATIFY NOTHING.
#
# The keys below are minimal.toml's and its comments carry their arguments -- read them there. What
# is commented HERE is what this file changes and why.

[needs]
sustenance_degrade = 4
sustenance_recover = 1
satisfaction_degrade = 1
satisfaction_recover = 1
floor = -1000

[[resource]]
name = "sundries"
family = "good"
need = "sustenance"

[[resource]]
name = "repairs"
family = "good"

[[resource]]
name = "money"
family = "money"

# What one occupant Household uses in a Day. The Rule that spends it and the Bin that holds it both
# name this, so the rate and the ceiling move together.
[[basket]]
name = "basic"
owner = "occupant"
use_per_day = { sundries = 250 }

# How many Days of a basket a Bin sized from this profile holds.
[[reserve]]
name = "standard"
days = 3

# What one firing turns into what, stated once for every Rule that runs it.
[[recipe]]
name    = "restock"
inputs  = []
outputs = [ { scope = "local", resource = "repairs", amount = 1 } ]

[[recipe]]
name    = "maintain"
inputs  = [ { scope = "local", resource = "repairs", amount = 1 } ]
outputs = []

[[business]]
name = "shop"
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[building]]
name = "dwelling"
bins = [
    { resource = "sundries", reserve = { profile = "standard", basket = "basic" }, owner = "occupant" },
    { resource = "repairs",  capacity = 4 },
]
tenancy_ends_after_days = 1
houses   = true
premises = true
parked = true
business = "shop"

# No `inputs`: the basket is the Goods this Rule moves, and stating both would be two answers to one
# question. A basket Rule applies exactly once per firing, because a daily quantity is spent once.
[[rule]]
name    = "consume"
kind    = "dwelling"
rate    = 32
apply   = { min = 1, max = 1 }
basket  = "basic"

# No `inputs` and no `outputs`: the recipe is both, and an apply band is allowed here because a
# recipe is priced per application rather than per Day.
[[rule]]
name    = "restock"
kind    = "dwelling"
rate    = 64
apply   = { min = 1, max = 2 }
recipe  = "restock"

[[rule]]
name    = "upkeep"
kind    = "dwelling"
rate    = 128
apply   = { min = 1, max = 1 }
recipe  = "maintain"

[[zone_rule]]
name          = "housing"
kind          = "dwelling"
zone          = 0
interval      = 32
revisit_ticks = 2048

[placement]
interval      = 32
revisit_ticks = 1024
candidates    = 3

[layers]
noise_range_metres            = 300
noise_intensity_percent       = 400
desirability_pollution_percent = 100
desirability_noise_percent     = 100
pollution_period      = 64
pollution_offset      = 0
land_value_period     = 256
land_value_offset     = 16
kernel_metres         = 1024
pollution_decay_ticks = 2048
land_value_tau        = 8

[roads]
block_tiles                    = 32
arterial_count                 = 0
arterial_junction_tiles        = 512
foot_crossing_every            = 4
foot_paths_per_thousand_blocks = 40
street_speed_kph               = 50
arterial_speed_kph             = 90
walk_speed_kph                 = 5
street_capacity_per_hour       = 3600
arterial_capacity_per_hour     = 12000
foot_path_capacity_per_hour    = 1000

[lots]
lots_per_segment = 5
setback_tiles = 2

[capacity]
floor_tiles_per_occupant      = 25
floor_tiles_per_job           = 3
floor_tiles_per_parking_space = 12

[parking]
radius_metres = 400
shed_keeps = 24

[trips]
crossing_seconds = 30
commute_fast_minutes = 20
commute_moderate_minutes = 40
commute_budget_minutes = 50

[jobs]
interval      = 32
revisit_ticks = 1024
candidates    = 3
shift_hours_min = 6
shift_hours_max = 10
arrive_early_max_minutes = 15
