[[rule]]
name    = "restock"
kind    = "dwelling"
rate    = 8
apply   = { min = 1, max = 4 }
inputs  = []
outputs = [ { scope = "local", resource = "sundries", amount = 4 } ]

[[rule]]
name    = "consume"
kind    = "dwelling"
rate    = 32
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "sundries", amount = 4 } ]
outputs = []

[[rule]]
name    = "upkeep"
kind    = "dwelling"
rate    = 16
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "repairs", amount = 4 } ]
outputs = []

[[zone_rule]]
name          = "housing"
kind          = "dwelling"
zone          = 0
interval      = 32
revisit_ticks = 2048

[placement]
interval      = 32
revisit_ticks = 1024
candidates    = 3
gives_up_after_days = 2
mu_percent                = 100
centrality_tiles_per_unit = 2048
rent_per_unit             = 120
moving_costs_rent         = 720

[layers]
noise_range_metres            = 300
noise_intensity_percent       = 400
desirability_pollution_percent = 100
desirability_noise_percent     = 100
pollution_period      = 64
pollution_offset      = 0
land_value_period     = 256
land_value_offset     = 16
kernel_metres         = 1024
pollution_decay_ticks = 2048
land_value_tau        = 8

[roads]
block_tiles                    = 32
arterial_count                 = 16
arterial_junction_tiles        = 512
foot_crossing_every            = 4
foot_paths_per_thousand_blocks = 40
street_speed_kph               = 50
arterial_speed_kph             = 90
walk_speed_kph                 = 5
street_capacity_per_hour       = 3600
arterial_capacity_per_hour     = 12000
foot_path_capacity_per_hour    = 1000

[lots]
lots_per_segment = 5
# The most ground a Building leaves on each side of its parcel. A LENGTH and not a fraction, so
# coverage rises with the parcel -- see minimal.toml, which carries the argument.
setback_tiles = 2

[capacity]
# How much floor one tenancy, job or parking space takes, in Tiles -- see minimal.toml, which carries
# the argument and the measurement. A kind says WHETHER it houses; the count derives from the ground,
# and the three rates are what the standing city already said about a detached building, divided.
floor_tiles_per_occupant      = 25
floor_tiles_per_job           = 3
floor_tiles_per_parking_space = 12

[households]
car_ownership_percent = 100

[parking]
radius_metres = 400
shed_keeps = 24

[trips]
crossing_seconds = 30
commute_fast_minutes = 20
commute_moderate_minutes = 40
commute_budget_minutes = 50

[jobs]
interval      = 32
revisit_ticks = 1024
candidates    = 3
shift_hours_min = 6
shift_hours_max = 10
arrive_early_max_minutes = 15

# Five stages, and they are here because a composition names one. A stage is what says how many
# people a Household holds, what it wants from a home, and -- through school_level -- whether it can
# carry children at all.
#
# ⚠ rent_weight_percent IS NOT A BUDGET. What a family can pay is the affordability filter; this is
# what it minds paying. A family with two children weighs rent half again as heavily as a single
# person does, and a couple whose children have left weighs it least.
[[life_stage]]
name          = "young"
duration_days = 24
spread_days   = 8
next          = "family"
childless     = "childless"
children_min  = 0
children_max  = 3
adult_age_min_days = 1
adult_age_max_days = 160
centrality_base_percent   = 70
centrality_spread_percent = 0
rent_weight_percent       = 100

[[life_stage]]
name          = "family"
duration_days = 48
spread_days   = 16
next          = "mature_family"
school_level  = 1
centrality_base_percent   = 40
centrality_spread_percent = 0
rent_weight_percent       = 150

[[life_stage]]
name            = "mature_family"
duration_days   = 48
spread_days     = 16
next            = "empty_nest"
children_become = "young"
school_level    = 2
centrality_base_percent   = 30
centrality_spread_percent = 0
rent_weight_percent       = 150

[[life_stage]]
name          = "childless"
duration_days = 40
spread_days   = 16
centrality_base_percent   = 70
centrality_spread_percent = 0
rent_weight_percent       = 100

[[life_stage]]
name          = "empty_nest"
duration_days = 40
spread_days   = 16
centrality_base_percent   = 50
centrality_spread_percent = 0
rent_weight_percent       = 75

# The four durations of the whole circuit. They stand or fall together.
#
# ⚠ `reconsider_days` IS AN OCCASION COUNT AND NOT AN ARRIVAL RATE. It says how often a Household
# outside weighs the city again; what it decides is the choice model's answer. Two Days is frequent
# enough to watch a drawdown inside one run and is chosen for that and nothing else.
#
# ⚠ `queue_reconsider_days` MUST BE SHORTER THAN `queue_wait_days`. A family willing to come but
# standing at a full gate reviews that wait; a review at or beyond the wait it reviews never runs.
[immigration]
reconsider_days       = 2
recovery_days         = 32
queue_wait_days       = 2
queue_reconsider_days = 1
