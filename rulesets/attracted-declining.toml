# attracted-declining.toml -- attracted.toml with dwellings that wear out, and NOTHING else changed.
#
# WHY IT EXISTS: attracted.toml's CIRCUIT STOPS. Nothing in that file ever retires a dwelling, so
# once the city has filled every home it holds, no occasion can find a dwelling to compare against
# and `no sample` becomes the outcome of all of them for ever. Measured over 64 Days at 1,000
# Citizens: from Day 58 the Pool, the placements and the give-ups are all zero and the money supply
# has stopped moving, while 3,519 Households still stand behind the four edges and 0 of them are
# willing. ***A long run in that world asserts nothing about immigration past Day 58, because
# immigration has stopped happening there.***
#
# WHAT IT CHANGES: `condemn_after_days` and `collapses_after_days` on the dwelling, the pair
# declining.toml is named for. A dwelling that falls down frees its Lot, the Zone Rule builds on it
# again, and a feasible home exists for somebody to weigh the Outside against. Measured over the
# same 64 Days: at Day 63 the Pool stands at 163 with 364 considered and 88 placed, and the four
# fresh outcomes partition properly again -- behind the west edge, 320 occasions as 190 no sample,
# 125 stayed and 5 willing.
#
# ⚠ IT IS A WORLD FOR A LONG RUN AND NOT A BALANCED CITY. The decline is fast on purpose. 2 Days to
# condemn and 1 to collapse is declining.toml's pair, taken so the churn is visible inside a test's
# horizon -- not a claim that a city ought to crumble at that rate.
#
# ⚠ ITS POPULATION FALLS, AND THAT IS THE POINT RATHER THAN A FAULT. 827 people stood at Day 63
# against attracted.toml's 1,377, because dwellings retire faster than four doors refill them. What
# stays live here is the FLOW, and no claim is made that either figure is a good one.
#
# ⚠ EVERY NUMBER IS PROVISIONAL AND CHOSEN BY TASTE. It inherits attracted.toml's warnings
# unchanged, including the compressed `arrivals_per_day` and `gives_up_after_days` that file took
# from crowded.toml, and an [immigration] block nobody has ratified.

[[resource]]
name = "sundries"
family = "good"

[[resource]]
name = "repairs"
family = "good"

[[resource]]
name = "money"
family = "money"

[[business]]
name = "shop"
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[building]]
name = "dwelling"
bins = [
    { resource = "sundries", capacity = 48, owner = "occupant" },
    { resource = "repairs",  capacity = 4 },
]
condemn_after_days = 2
collapses_after_days = 1
houses   = true
premises = true
# A price to compare a Hinterland's against. Without one V_here is zero for everybody and the four
# edges are told apart by nothing.
rent = 400
# Whether it parks at all -- the count is floor area over [capacity] floor_tiles_per_parking_space.
parked = true
business = "shop"

[[building]]
name = "port"
arrivals_per_day = 96

[[hinterland]]
edge = "west"
rent = 900
centrality_tiles = 6000
emigrant_balance_min = 800
emigrant_balance_max = 4000


# Behind west: single people, families with two children, and couples whose children have gone.
# The three carry different purses, want different things from a home, and are drawn on separately.
[[hinterland.population]]
stage           = "young"
adults_by_tier  = [1, 0, 0]
children        = 0
money_band      = 0
households      = 600

[[hinterland.population]]
stage           = "family"
adults_by_tier  = [1, 1, 0]
children        = 2
money_band      = 1
households      = 200

[[hinterland.population]]
stage           = "empty_nest"
adults_by_tier  = [0, 0, 1]
children        = 0
money_band      = 2
households      = 100
