# attracted-outside-cheaper.toml -- attracted.toml with every Outside rent cut, and NOTHING else
# changed.
#
# WHAT IT DEMONSTRATES: that the flow into a city is a COMPARISON rather than a property of the
# city. The same streets, the same dwellings at the same rent, the same people standing behind the
# same four edges -- and a cheaper Outside, which is the one thing that moved. Fewer of them should
# want to come, and the ones already standing in a queue should reconsider the wait.
#
# ⚠ IT IS THE TREATMENT HALF OF A PAIR AND MEANS NOTHING ALONE. Read it against attracted.toml
# continued from the same saved city at the same Tick. A run of this file on its own says only what
# one world did, which is not a finding about rent.
#
# ⚠ CHANGING ONLY THE RENT IS WHAT MAKES IT ADOPTABLE. World.Adopt refuses any edit that would
# invent or destroy people -- a composition, a resting count, a purse band, a declaration order --
# and allows a rent retune. So a running city can take this file at a named Tick and the stock it
# has already spent is not reset. A partner that also moved a household count would be refused; one
# that moved a count silently would be a different experiment wearing this one's name.
#
#     north   rent 700   was 1,500
#     west    rent 350   was   900
#     south   rent 250   was   600
#     east    rent 150   was   300
#
# ⚠ A DWELLING HERE STILL COSTS 400, so west at 350 is the first shipped edge whose Outside
# undercuts the city outright. That is deliberate. It is the sharp end of the comparison rather
# than an authoring slip.
#
# ⚠ EVERY NUMBER IS PROVISIONAL AND CHOSEN BY TASTE. None is measured and none is ratified. They
# are starting content for an observation nobody has made: plans/0073 owns the episode, and this
# file is a world it will be run in rather than a record that it was.
#
# ⚠ IT INHERITS attracted.toml's WARNINGS UNCHANGED, including the compressed `arrivals_per_day`
# and `gives_up_after_days` that file took from crowded.toml.

[[resource]]
name = "sundries"
family = "good"

[[resource]]
name = "repairs"
family = "good"

[[resource]]
name = "money"
family = "money"

[[business]]
name = "shop"
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[building]]
name = "dwelling"
bins = [
    { resource = "sundries", capacity = 48, owner = "occupant" },
    { resource = "repairs",  capacity = 4 },
]
houses   = true
premises = true
# A price to compare a Hinterland's against. Without one V_here is zero for everybody and the four
# edges are told apart by nothing.
rent = 400
# Whether it parks at all -- the count is floor area over [capacity] floor_tiles_per_parking_space.
parked = true
business = "shop"

[[building]]
name = "port"
arrivals_per_day = 96

[[hinterland]]
edge = "west"
rent = 350
centrality_tiles = 6000
emigrant_balance_min = 800
emigrant_balance_max = 4000


# Behind west: single people, families with two children, and couples whose children have gone.
# The three carry different purses, want different things from a home, and are drawn on separately.
[[hinterland.population]]
stage           = "young"
adults_by_tier  = [1, 0, 0]
children        = 0
money_band      = 0
households      = 600

[[hinterland.population]]
stage           = "family"
adults_by_tier  = [1, 1, 0]
children        = 2
money_band      = 1
households      = 200

[[hinterland.population]]
stage           = "empty_nest"
adults_by_tier  = [0, 0, 1]
children        = 0
money_band      = 2
households      = 100
[[hinterland]]
