households      = 100
[[hinterland]]
edge = "east"
rent = 150
centrality_tiles = 2000
emigrant_balance_min = 2000
emigrant_balance_max = 14000


# Behind east: single people, families with two children, and couples whose children have gone.
# The three carry different purses, want different things from a home, and are drawn on separately.
[[hinterland.population]]
stage           = "young"
adults_by_tier  = [1, 0, 0]
children        = 0
money_band      = 0
households      = 600

[[hinterland.population]]
stage           = "family"
adults_by_tier  = [1, 1, 0]
children        = 2
