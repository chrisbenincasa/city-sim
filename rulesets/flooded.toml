# The flooded Ruleset. It is `coastal.toml` WITH WEATHER, and it is the first shipped file in which
# ANYTHING HAPPENS TO THE GROUND.
#
# plans/0045 row 12. CONTEXT.md -> Disaster; 01 §5.2 tabulates four Disasters and this builds one;
# 01 §5.3 makes them world-scheduled. adr/0157 generated the Hazard Region at milestone 24 and
# NOTHING FIRED ON IT for as long as it has existed -- CONTEXT.md said so in as many words, and so did
# World.Flood's own remark. This file is what reads it.
#
# WHAT IT ADDS TO coastal.toml, AND IT IS ONE TABLE. `[disasters]`, with three keys. Everything else
# below is coastal.toml unchanged, and its reasoning lives there rather than being copied here -- a
# copied comment is a second copy that drifts, which is plans/0012 Cause 1 by construction.
#
# ⚠ THREE DURATIONS AND NO MAGNITUDE, WHICH IS 01 §5.2 TAKEN LITERALLY: "No severity constant is
# authored anywhere; the only constants are a frequency interval and a spread rate, both durations,
# both scale-free." How far a flood reaches is the connected floodplain below its surge, and how much
# it destroys is where the world happened to seed it. THERE IS NOTHING HERE TO TUNE SEVERITY WITH,
# and that absence is the design rather than a gap.
#
# ⚠ HOW BAD A FLOOD IS, IS WHERE IT STARTS. A Hazard Region row holds the flood level minus its
# ground, so a large depth is LOW ground. The surge opens with the water surface at the seed Cell's
# own ground -- everything connected to it and lower is already under -- and rises from there to the
# flood level. So a flood seeded on high floodplain reaches nearly everything below it, and one
# seeded in the deepest hollow reaches almost nothing. The draw is uniform over the Hazard Region's
# ROWS and therefore not uniform over severity, and that is a property of the terrain.
#
# ⚠ BOTH VERBS FIRE AND THE DEPTH CHOOSES BETWEEN THEM. Ground BELOW the flood's origin is destroyed
# outright and its Lot vacates, which is 01 §5.2's own sentence and is what lets ordinary
# redevelopment put something back. Ground AT OR ABOVE the origin is ABANDONED and the shell stands,
# which is adr/0091. Neither is a new mechanism: "Every effect is an existing verb."
#
# 🔴 ALL THREE NUMBERS ARE STOPWATCH SETTINGS AND NONE OF THEM IS A DESIGN CLAIM. A flood every two
# Days is not a claim about how often a coast floods; it is the interval at which somebody watching
# the shell at 4x -- a Day in 64 seconds -- sees one begin about every two minutes. crowded.toml's
# `arrivals_per_day` is the same move for the same reason, and its header says so too. What the
# designer's values would be is unknown, and under the plans/0045 amnesty adr/0052 is suspended: they
# are stamped PROVISIONAL and open no plans/0002 §D row.
#
# 🔴 AND A CITY UNDER A FLOOD EVERY TWO DAYS IS NOT A CITY. Read nothing out of a long run of this
# file about the housing stock, the population or the money supply. What it demonstrates is that the
# Hazard Region has a consumer, that a flood spreads and recedes, and that both verbs reach a
# Building. THE NUMBERS THIS FILE PRODUCES RATIFY NOTHING.
#
# ⚠ A LIFETIME AS LONG AS THE INTERVAL IS DELIBERATE. rises 1 + recedes 1 = every 2, so a flood is
# receding as the next one is due and two are occasionally alive at once. That is why DisasterTable
# is a table. The loader does not refuse the overlap, because overlapping floods are a world.
#
# ⚠ [water] AND [disasters] ARE SEPARABLE IN ONE DIRECTION ONLY. coastal.toml keeps the floodplain
# with no schedule over it, which is 01 §5.3's posted price before the first Act of God; a schedule
# with no floodplain is refused at load, because it would be an event with nowhere to happen.

[[resource]]
name = "sundries"
family = "good"
[[resource]]
name = "repairs"
family = "good"
[[resource]]
name = "sewage"
family = "utility"
[[resource]]
name = "money"
family = "money"
[[business]]
name = "shop"
jobs = 8
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10
[[building]]
name = "dwelling"
business = "shop"
bins = [
    { resource = "sundries", capacity = 48, owner = "occupant" },
    { resource = "repairs",  capacity = 4 },
]
occupants = 3
parking = 8
[[rule]]
name    = "restock"
kind    = "dwelling"
rate    = 8
apply   = { min = 1, max = 4 }
inputs  = []
outputs = [ { scope = "local", resource = "sundries", amount = 4 } ]
[[rule]]
name    = "consume"
kind    = "dwelling"
rate    = 32
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "sundries", amount = 4 } ]
outputs = []
[[rule]]
name    = "upkeep"
kind    = "dwelling"
rate    = 16
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "repairs", amount = 4 } ]
outputs = []
[[zone_rule]]
name          = "housing"
kind          = "dwelling"
zone          = 0
interval      = 32
revisit_ticks = 2048
[placement]
interval      = 32
revisit_ticks = 1024
candidates    = 3
[layers]
noise_range_metres            = 300
noise_intensity_percent       = 400
desirability_pollution_percent = 100
desirability_noise_percent     = 100
pollution_period      = 64
pollution_offset      = 0
land_value_period     = 256
land_value_offset     = 16
kernel_metres         = 1024
pollution_decay_ticks = 2048
land_value_tau        = 8
[roads]
block_tiles                    = 32
arterial_count                 = 0
arterial_junction_tiles        = 512
foot_crossing_every            = 4
foot_paths_per_thousand_blocks = 40
street_speed_kph               = 50
arterial_speed_kph             = 90
walk_speed_kph                 = 5
street_capacity_per_hour       = 3600
arterial_capacity_per_hour     = 12000
foot_path_capacity_per_hour    = 1000
[lots]
lots_per_segment = 5
[parking]
radius_metres = 400
shed_keeps = 24
[trips]
crossing_seconds = 30
commute_fast_minutes = 20
commute_moderate_minutes = 40
commute_budget_minutes = 50
[jobs]
interval      = 32
revisit_ticks = 1024
candidates    = 3
shift_hours_min = 6
shift_hours_max = 10
arrive_early_max_minutes = 15
[water]
sea_level_percent = 25
flood_level_percent = 30
carries = "sewage"
capacity_per_cell = 1000
outflow_per_exit_per_day = 100
runoff_per_sealed_cell_per_day = 50
[[lattice]]
origin_east_tiles  = 11520
origin_north_tiles = 4800

[disasters]
flood_every_days       = 2
flood_rises_over_days  = 1
flood_recedes_over_days = 1
