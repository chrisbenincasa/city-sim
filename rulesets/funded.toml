# THE FUNDED RULESET -- a school the CITY pays for, so that a budget decision has a service under it.
#
# plans/0070, amnesty row 32. It is `schooling.toml` with TEN CHANGES, marked CHANGE 1 of 10 through
# 10 of 10 where they sit, and everything else below is that file's, unedited. The diff is the whole
# demonstration, on `insolvent.toml`'s precedent and for `insolvent.toml`'s reason.
#
#   1. [[resource]] repairs        DELETED, with every Rule and Building that moved it.
#   2. [[business]] grocer, office, tuition   DELETED. [[business]] teaching ADDED.
#   3. [[building]] school         ADDED -- serves education, premises, business = "teaching".
#   4. [[building]] shopfront, officeblock, primary, secondary, university, college   DELETED.
#   5. [[policy]] school_funding   ADDED -- the city's first named expenditure on a service.
#   6. [capacity] floor_tiles_per_occupant   25 -> 16. GROUND, NOT TUNING -- see CHANGE 6.
#   7. [[rule]] restock            buys from nobody; maintain, upkeep, stock, advise DELETED.
#   8. [districts], [[lattice]], [[hinterland]], [market]   DELETED -- no `pool` term survives.
#   9. [schooling], [school], [[life_stage]] school_level, [jobs] tier and experience keys DELETED.
#  10. [households]                DELETED -- no Household in this world buys anything.
#
# ===========================================================================================
# WHAT IT EXISTS TO SHOW: ***A PUBLIC SCHOOL IS A SERVICE KIND WHOSE TRADE HAS A WAGE AND NO
# TUITION.*** The teachers are employed, they are paid out of the school's till, and NOTHING FILLS
# THAT TILL EXCEPT THE CITY. Cut the grant and the till runs dry, the paydays go short, and
# `goes_bankrupt_after_short_paydays` winds the trade up and dismisses its staff.
# ===========================================================================================
# No new concept was needed to write that sentence. `BusinessKindDefinition.Charges` is
# `TuitionPerDay > 0`, so PRIVATE is DERIVED from the trade charging a Household and is not a flag --
# and public is its absence. plans/0070 decision 5.
#
# ⚠ NEITHER SHIPPED EDUCATION WORLD CAN DEMONSTRATE THIS, AND THE TWO FAIL DIFFERENTLY.
#
#   `schooled.toml`'s `school` declares neither `houses` nor `premises`, so its declared occupancy
#   is ZERO and it can never hold a Business at all. It is a building attended by children and
#   staffed by nobody, and that is what `--school` has always run against.
#
#   `schooling.toml`'s `college` is PRIVATE. Its `tuition` trade states `tuition_per_day = 512`, so
#   the students pay for it and the treasury never does. ***A public school is that same shape with
#   the tuition key removed and a wage left standing.***
#
# ⚠ THIS FILE IS NOT A REPLACEMENT FOR EITHER. It teaches one level, it runs no economy, and it says
# nothing about what a degree is worth. `schooling.toml` owns the education pipeline; this file owns
# who pays the staff.
#
# ===========================================================================================
# 🔴 THE TREASURY IN THIS FILE OPENS EMPTY, AND UNTIL `[treasury] opening_balance` EXISTS THAT IS
# THE ONLY POLE THIS WORLD HAS.
# ===========================================================================================
# Nothing here collects a levy, a rate or an income tax, so the city has no money and the funding
# Policy below moves nothing. `PolicyEngine.Move` pays in full or pays zero and `SweepMembers`
# returns on the first dry-treasury failure, so a school gets its whole grant or none of it -- never
# a share. plans/0070 task 3 adds a world-creation opening balance and this file takes one then.
#
# ***So a run of this file today shows a school standing, staffed, unpaid and wound up on schedule.***
# That is the file working rather than the file broken, and it is the DEFUNDED pole of the pair the
# row exists to put side by side. Read nothing here as evidence that a funded school fails.
#
# ⚠ AND A WOUND-UP SCHOOL STILL TEACHES. `World.DeclaredPlaces` divides floor area by
# `floor_tiles_per_place` and never reads whether anybody works there, so dismissing every teacher
# changes no column in `--school`. plans/0070 F10 and task 6 build the link; adr/0026 already decided
# it. Until then, DO NOT READ THE PLACES COLUMN AS A READING ON STAFFING.
#
# ===========================================================================================
# WHAT IT PRINTED, so the claims above are readings rather than assertions.
# ===========================================================================================
# `--school --ruleset rulesets/funded.toml --citizens 2000 --ticks 8192 --schools 4`, seed 0:
#
#   91 Buildings stand, of which 4 are schools, on 90, 144, 140 and 72 Tiles of floor -- 30, 48, 46
#   and 24 places. ⚠ 8,192 Ticks IS 4 DAYS AND NO HOUSEHOLD HAS A CHILD YET, so every attendance
#   column reads zero. A reach reading needs a long run; `schooled.toml`'s header uses 100,000.
#
#   ALL FOUR SCHOOLS HELD A LIVE `teaching` BUSINESS FROM THE TICK THEY WERE RAISED, and all four
#   were fully staffed inside 4 Days -- 6, 5, 5 and 6 teachers, 22 in the city. That is CHANGE 6
#   working, and it is the one thing this file exists to make reliable.
#
#   EVERY TILL READ ZERO THROUGHOUT, AND OVER 32 DAYS ALL FOUR TRADES WOUND UP. The treasury never
#   had anything to give. That is the defunded pole above, and it is the only pole this file has
#   until `[treasury] opening_balance` lands.
#
# ===========================================================================================
# ⚠ F5 CANNOT FIRE HERE, AND THE REASON IS AN ABSENCE RATHER THAN A RULE.
# ===========================================================================================
# `premises` is a permission and not a reservation: `World.HasRoomForPremises` never reads the trade,
# so any unpremised Business in the city may take a school's tenancy and leave the teachers short
# (adr/0147 counts ONE ceiling over both kinds of tenant). This file declares no `[founding]`, no
# `[districts]` and no `[[hinterland]]`, so no Citizen founds a trade and none arrives through a
# gate, and `teaching` is the only trade declared. ***There is no foreign trade in this world to take
# the tenancy.*** Whether a kind may reserve its own tenancy is adr/0147's question and this file
# asks it without answering it.
#
# 🔴 EVERY NUMBER BELOW IS PROVISIONAL AND NONE IS RATIFIED. plans/0045 standing order 4 suspends
# adr/0052, so no row is open for any of them, none names a ratifier, and none should be read as
# chosen. Read them as numbers that let the mechanism run, never as claims about what a teacher's
# work, a school's running costs or a city's education budget is worth.

# The keys below are minimal.toml's and its comments carry their arguments -- read them there.
# What is commented HERE is what this file changes and why.

# CHANGE 1 of 10. `repairs` DELETED with the office chain that consumed it. Two Resources are left:
# one Good so a dwelling has a Bin Rule to run, and money so there is a till and a treasury.
[[resource]]
name = "sundries"
family = "good"

[[resource]]
name = "money"
family = "money"

# CHANGE 2 of 10. The three trades of `schooling.toml` are DELETED and this one replaces all of them.
# It is the whole subject of the file.
#
# ⚠ IT STATES NO `tuition_per_day`, AND THAT ABSENCE IS WHAT MAKES THE SCHOOL PUBLIC. `Charges` is
# `TuitionPerDay > 0`, so a trade that charges nobody has exactly one place its wages can come from.
#
# `wage_per_day` is `schooling.toml`'s grocer rate, unchanged, so the payroll arithmetic in CHANGE 5
# is readable against a number that already exists elsewhere rather than one invented here.
#
# ⚠ `goes_bankrupt_after_short_paydays` MUST EXCEED 1 AND THE REASON IS THE PHASE ORDER. `Simulation`
# sweeps wages BEFORE it sweeps Policies, in the same Tick, so a till is paid out of before it is
# topped up and a school can meet a payday short before its first grant ever lands. 3 against the
# one-Day funding interval below is that relation with a wide margin: a FUNDED school never folds on
# a schedule, and an unfunded one folds in three paydays. It counts consecutive PAYDAYS and not Days,
# so at `pay_period_days = 7` it is up to 21 Days of non-payment.
[[business]]
name = "teaching"
wage_per_day    = 4096
pay_period_days = 7
goes_bankrupt_after_short_paydays = 3
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[building]]
name = "dwelling"
bins = [
    { resource = "sundries", capacity = 48, owner = "occupant" },
]
houses   = true
premises = true
parked = true

# CHANGE 3 of 10. THE PUBLIC SCHOOL. Four keys together make one: `serves` makes it attended,
# `level` says what it teaches, `premises` lets it hold a tenant, and `business` says which trade it
# comes with (adr/0148 instantiates it on construction, with no founder and no capital).
#
# ⚠ THE MONEY BIN IS OWNED BY THE BUSINESS AND NOT BY THE OCCUPANT. It is the till the grant lands in
# and the till `WageEngine` pays the teachers out of. A Building never holds money of its own.
#
# ⚠ NO `[[zone_rule]]` NAMES THIS KIND AND THERE MUST NOT BE ONE. 01 section 5's placement exception
# is that the city does not site its own schools, so a run of this file with no `service` command has
# a school kind and not one school. `--school` is the instrument that places them.
[[building]]
name     = "school"
serves   = "education"
level    = 1
premises = true
business = "teaching"
bins = [
    { resource = "money", owner = "business" },
]

# CHANGE 7 of 10. `restock` BUYS FROM NOBODY -- `schooling.toml`'s version took a `pool` input, and a
# pool term cannot resolve in a world with no Districts (CHANGE 8). This is `schooled.toml`'s
# spelling and it is honest for the same reason: nothing in this file is a supply chain.
[[rule]]
name    = "restock"
kind    = "dwelling"
rate    = 8
apply   = { min = 1, max = 4 }
inputs  = []
outputs = [ { scope = "local", resource = "sundries", amount = 4 } ]

[[rule]]
name    = "consume"
kind    = "dwelling"
rate    = 32
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "sundries", amount = 4 } ]
outputs = []

[[zone_rule]]
name          = "housing"
kind          = "dwelling"
zone          = 0
interval      = 32
revisit_ticks = 2048

# CHANGE 5 of 10. THE FUNDING POLICY, and it is the reason the file exists. Every 2,048 Ticks it
# moves 20,480 out of the treasury into the till of every Business carrying on the `teaching` trade,
# and into no other till in the city.
#
# ⚠ `trade` IS WHAT MAKES *FUND THE SCHOOLS* AUTHORABLE. `sweeps` names a whole table, so without
# this key the same grant would reach every Business in the city.
#
# ⚠ `tool` IS ABSENT ON PURPOSE, so this is an ordinary transfer. A `subsidy` pays `rate x workers`
# and skips a claimant with no workers, which funds PAYSLIPS; this funds an INSTITUTION, and a
# transfer is the tool whose exhaustion branch pays some schools in full and the rest nothing
# (plans/0070 decision 6).
#
# 🔴 `amount` IS EXACTLY A FULLY STAFFED SCHOOL'S DAILY PAYROLL -- 5 jobs x `wage_per_day` 4096 =
# 20,480 -- AND IT IS SET AT PAYROLL RATHER THAN ABOVE IT. A grant above payroll makes a till a
# magnitude trending upward at steady state, which adr/0006 refuses outright. At payroll the till is
# FLAT in a fully staffed school, and an understaffed one accrues a visible surplus: ***that surplus
# is the diagnostic that the problem is hiring and not money.***
#
# ⚠ 5 JOBS IS THE ARITHMETIC AND NOT THE MEASUREMENT, AND THE TWO PART ON THIS GROUND. Jobs derive
# from the TENANCY's share of the floor -- `Holds(FloorDiv(floor, tenancies), 3)` -- so a school
# holds 5 only where that share is 15 to 17 Tiles. Measured here, two of the four schools hold 6
# jobs because their share is 18, and a fully staffed one of those draws 24,576 a Day against a
# 20,480 grant. ***The till is therefore flat on the five-job schools and falls on the six-job
# ones***, and the grant is a number chosen against a derivation rather than against a payroll
# somebody counted.
#
# ⚠ `interval` IS ONE DAY BECAUSE PAYDAYS ARE STAGGERED. `IsPayday` scatters each Business's payday
# across `pay_period_days`, so the grant has to land before whatever Day a given school's payday
# falls on, and daily is the only interval safe for every school.
#
# ⚠ IT CARRIES A `name` SO A PLAYER CAN STEER IT. `Govern` edits a named Policy's amount and the
# Policies panel lists it; an unnamed Policy is ungovernable, which would leave this file with an
# expenditure and no decision.
[[policy]]
name = "school_funding"
sweeps = "business"
trade = "teaching"
interval = 2048
apply = { min = 1, max = 1 }
transfer = { from = "global", to = "local", resource = "money", amount = 20480 }

[placement]
interval      = 32
revisit_ticks = 1024
candidates    = 3
gives_up_after_days = 60

[layers]
noise_range_metres            = 300
noise_intensity_percent       = 400
desirability_pollution_percent = 100
desirability_noise_percent     = 100
pollution_period      = 64
pollution_offset      = 0
land_value_period     = 256
land_value_offset     = 16
kernel_metres         = 1024
pollution_decay_ticks = 2048
land_value_tau        = 8

# `schooling.toml`'s ground, unchanged, so the floor areas that file has already measured carry over
# to this one and CHANGE 6's arithmetic can be checked against a reading somebody else took.
[roads]
block_tiles                    = 32
arterial_count                 = 0
arterial_junction_tiles        = 512
foot_crossing_every            = 4
foot_paths_per_thousand_blocks = 40
street_speed_kph               = 50
arterial_speed_kph             = 90
walk_speed_kph                 = 5
street_capacity_per_hour       = 3600
arterial_capacity_per_hour     = 12000
foot_path_capacity_per_hour    = 1000

[lots]
lots_per_segment = 5
setback_tiles = 2

# CHANGE 6 of 10. 25 -> 16, AND IT IS GROUND RATHER THAN A TUNING CHOICE.
#
# 🔴 `World.Fit` WITHHOLDS A KIND'S DECLARED TRADE WHEREVER THE OCCUPANCY CEILING IS NOT ABOVE 1, AND
# IT DOES SO SILENTLY. A Business takes a tenancy exactly as a Household does (adr/0147), so on a
# parcel whose floor divides into ONE tenancy the trade would take the only one -- and rather than
# allow that, `World.Fit` skips it. Nothing is logged and nothing refuses. The school stands, it is
# attended, and NOBODY WORKS THERE. ***Whether a school gets its teachers would then be a lottery on
# which Lot it lands, and a lottery is not a demonstration.***
#
# The failure is not hypothetical. `schooled.toml`'s header records four schools of 64, 54, 48 and
# 144 Tiles, and at 25 those divide into 2, 2, 1 and 5 tenancies -- so the 48-Tile site would be
# raised with no teachers at all. 16 moves the largest parcel that can fail from under 50 Tiles to
# under 32, which is below anything this subdivider carves.
#
# ⚠ AND ON THIS FILE'S OWN GROUND, 25 WOULD HAVE WORKED TOO. Measured at 2,000 Citizens, seed 0,
# `--schools 4`: at 16 the four schools stand on 90, 144, 140 and 72 Tiles, dividing into 5, 9, 8 and
# 4 tenancies. At 25 the same city puts them on 90, 90, 96 and 210 Tiles, dividing into 3, 3, 3 and
# 8, and all four keep their trade. ***So 16 is a MARGIN rather than the repair of a failure observed
# here*** -- and the whole city moves when this key moves, so a run at 25 is a different siting and
# not a control. What 16 buys is that the margin stops depending on where the schools land.
#
# ⚠ IT IS NOT A CLAIM ABOUT HOW MANY PEOPLE SHOULD LIVE IN A ROOM. It is the number that makes
# plans/0070 decision 9 hold whatever the lattice lays, and it moves if the lattice or the setback
# moves.
# ⚠ AND IT REACHES EVERY KIND, the dwelling included, so this city houses more Households per
# dwelling than `schooling.toml`'s does.
[capacity]
floor_tiles_per_occupant      = 16
floor_tiles_per_job           = 3
floor_tiles_per_parking_space = 12
floor_tiles_per_place         = 3

[parking]
radius_metres = 400
shed_keeps = 24

[trips]
crossing_seconds = 30
commute_fast_minutes = 20
commute_moderate_minutes = 40
commute_budget_minutes = 50

# CHANGE 9 of 10. `wage_tier_percent`, `experience_per_day`, `tier2_experience` and the two
# experience percentages are DELETED with `[schooling]`. Nothing here grades a worker: every teacher
# is paid the posted rate, so the payroll is exactly jobs x `wage_per_day` and the grant above can be
# stated as one multiplication.
[jobs]
interval      = 32
revisit_ticks = 1024
candidates    = 3
shift_hours_min = 6
shift_hours_max = 10
arrive_early_max_minutes = 15

# The demographics, unchanged except that no stage states `school_level` -- that key belongs to the
# `[schooling]` pipeline this file does not run. A child is `Citizens.Age == 0` in a world that
# declares life stages, and without them `--school` would find a city of adults.
[[life_stage]]
name          = "young"
duration_days = 24
spread_days   = 8
next          = "family"
childless     = "childless"
children_min  = 0
children_max  = 3
adult_age_min_days = 1
adult_age_max_days = 160

[[life_stage]]
name          = "family"
duration_days = 48
spread_days   = 16
next          = "mature_family"

[[life_stage]]
name           = "mature_family"
duration_days  = 48
spread_days    = 16
next           = "empty_nest"
children_become = "young"

[[life_stage]]
name          = "childless"
duration_days = 40
spread_days   = 16

[[life_stage]]
name          = "empty_nest"
duration_days = 40
spread_days   = 16

[needs]
sustenance_degrade   = 4
sustenance_recover   = 1
satisfaction_degrade = 1
satisfaction_recover = 1
education_degrade    = 2
education_recover    = 2
floor = -1000
