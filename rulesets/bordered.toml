# The bordered Ruleset. It is `minimal.toml` with a DOOR in it, and it is the first shipped file in
# which the map's edge means anything.
#
# Milestone 11 task 3 of plans/0035-hinterlands-and-arrival-through-the-gate.md. Its whole job is to
# be a world an Outside Connection actually stands in, because milestone 9 shipped a producer that was
# correct and unobservable in every world that existed -- plans/0034 F17, where the land value field
# read zero everywhere for want of Ruleset CONTENT rather than for want of code. A gate kind no
# Building is ever raised of is that failure again, one milestone later.
#
# WHAT IT ADDS TO minimal.toml, AND IT IS FOUR THINGS. A `[[building]]` kind carrying
# `arrivals_per_day`, which is the key whose presence declares a kind an Outside Connection
# (adr/0088); four `[[hinterland]]` blocks, one behind each map edge; `arterial_count = 16` where every
# city-modelling file states 0; and `[households] car_ownership_percent = 100`. The last two make the
# far gates ROUTABLE, and the paragraphs below say what they do NOT make them. Everything else is
# minimal.toml unchanged.
#
# WHY THE GATE KIND HOUSES AND EMPLOYS NOBODY. It declares no `occupants` and no `jobs`. A port is not
# a place to live, and giving it either would make the arrivals mechanism's own readouts ambiguous --
# a Household housed IN the gate is not a Household that came THROUGH it. It declares no Bins and no
# Rules for the same reason freight is milestone 12: nothing crosses this gate but people and the
# money they hold (adr/0131), so there is nothing for a Bin to be.
#
# THE LATTICE IS PAVED TO THE MAP'S BOUNDARY, AND ONLY A WORLD WITH A DOOR IS. SyntheticCity normally
# sizes the Street lattice to the Lots the world was allocated for, which at 1,000 Citizens is 640 m of
# a 65,536 m map -- so it runs from the origin corner and touches WEST and SOUTH and never the far two.
# A gate stands on a map edge, so a Ruleset declaring one gets the whole map paved. It costs no
# allocation: RoadGraph already sizes both tables for the full lattice and always has. It costs live
# rows -- 36 nodes and 61 Segments become 263,169 and 535,817, laid in 150 ms.
#
# AND PAVING ALONE PUTS A STREET ON THE EDGE AND NO LOT BESIDE IT. Subdivide walks blocks from the
# origin and stops as soon as it has Lots for the population, so the generator carves the one block
# carrying each edge as well -- SyntheticCity.CarveEdgeBlock. Both changes are needed and neither is
# this file's: they are the generator's, and this file is what makes them fire.
#
# 🔴 EVERY GATE IS ROUTABLE AND THE FAR TWO ARE STILL BEYOND THE COMMUTE BUDGET. MEASURED, at 1,000
# Citizens, gate to nearest dwelling BY CAR, against a ceiling of 49 minutes:
#
#     west        0 minutes     inside the city
#     south       0 minutes     inside the city
#     east       62 minutes     routable, over the ceiling
#     north      73 minutes     routable, over the ceiling
#
# With `arterial_count = 0` the far two read 78 and 80. So sixteen Arterials buy 16 minutes on one
# edge and 7 on the other, and NEITHER REACHES THE CEILING -- a pure-Arterial run of 64,896 m is 43
# minutes and no route is pure. DO NOT READ `arterial_count` AS WHAT PUTS THE FAR EDGE IN REACH. It
# does not, and no road speed this build has would.
#
# THAT DISTANCE IS adr/0089 WORKING RATHER THAN FAILING. The map is sized by how many Commute Budgets
# fit across it, so a map several budgets wide puts its far edge outside one BY CONSTRUCTION. A far
# gate is made usable by a DWELLING BESIDE IT, not by a faster road, and the carved block leaves
# vacant Lots for exactly that. ⚠ TripEngine judges the Budget on EVERY Trip and not only on a
# commute, so a move-in from a far gate to a dwelling in the corner city resolves
# TripFate.ExceededCommuteBudget. Which dwelling an arrival is placed in is milestone 11 task 6's,
# and is filed there.
#
# WHY IT MAY BUILD ARTERIALS WHEN A CITY'S GENERATOR MUST NOT. adr/0077 refuses Arterials in
# CommandKind.Connect, adr/0090 says the generator makes land and the player makes every road, and
# arterial_count went to 0 in the city-modelling files for exactly that reason. rulesets/severance.toml
# keeps sixteen anyway, and plans/0002 §D1 states the rule it keeps them under: a demonstration is
# allowed to build what a city's generator must not. This is the second such file, and it is one for
# the same shape of reason -- it exists to show that the far edge is a different economy at a price,
# and the price is denominated in road. ⚠ WHAT IT BUYS IS MEASURED ABOVE AND IT IS SMALLER THAN IT
# LOOKS: 16 minutes on one edge and 7 on the other, neither of them decisive.
#
# ⚠ THERE IS NO `[traffic]` TABLE, SO ROADS NEVER SLOW DOWN HERE. That is deliberate: the four
# figures above are FREE-FLOW, which is the denomination the Commute Budget is stated in (adr/0095),
# and congestion would move them for a reason this file is not about. adr/0088's "the price of the far
# edge is paid in your own traffic" is FREIGHT, and freight is milestone 12. ⚠ DO NOT READ 62 AND 73
# MINUTES AS WHAT A DRIVE COSTS IN A BUSY CITY.
#
# WHY THE BODY CARRIES NO EXPLANATORY COMMENTS. Everything below the header is minimal.toml's, and its
# reasoning lives in minimal.toml rather than being copied here. The first draft of this file copied
# all 581 comment lines with the body, and several of them said "this file" about a file that is not
# this one -- including one asserting that nobody here drives, three tables above the one granting
# everybody a car. A copied comment is a second copy that drifts, which is plans/0012 Cause 1 by
# construction. The three keys this file changes are commented HERE, where the change is.
#
# WHY THE FOUR BANDS DIFFER. Four identical Hinterlands would make the edge selection inert -- the
# thing the object exists to express is that the four markets DRIFT INDEPENDENTLY, and a file where
# every edge is the same is a file in which choosing an edge buys nothing. The spread is authored to
# be legible rather than measured: west is the poorest and north the richest, and the ORDER carries no
# claim about geography. ⚠ These are the first emigrant balances in the corpus and NONE of them is
# ratified; the ratifier is the first acceptance run in which arrivals outpace housing, which is
# milestone 11 task 9.
#
# WHY THE BANDS ARE NOT `[households] opening_balance_min`/`max`. That key is WORLD-FOUNDING -- what
# the city's own first Households were endowed with -- and adr/0131 refused reusing it: drawing
# arrivals from it would make the four edges interchangeable as money sources while each Hinterland
# separately authors an economy its own emigrants did not come from. An anchor that does not reach the
# thing it anchors is decoration.
#
# WHAT `arrivals_per_day` IS NOT. It is not half of adr/0088's `min(declared ceiling, the Access
# Point's Segment capacity)`. That second term is denominated in whole VEHICLES per Day and this one
# counts HOUSEHOLDS, and under adr/0098 whether an arriving Household is a Vehicle at all is a
# property of the Ruleset. The min() moved to milestone 12 with freight (plans/0035 decision 9,
# adr/0088 amended in place twice). ⚠ READ THE NUMBER AS A CEILING ON ARRIVALS AND NOTHING ELSE.
# ⚠ This paragraph used to end "this file states no [households], so nobody drives and the Segment
# term would bound nothing", and IT SAID SO SEVENTY LINES BELOW A HEADER LINE LISTING
# `[households] car_ownership_percent = 100` AS ONE OF THE FOUR THINGS THIS FILE ADDS. Everybody
# here drives; the Segment term would bind on something. Corrected 2026-08-21 by milestone 11 task 7
# -- plans/0035 F23, and the failure this header's own "a copied comment is a second copy that
# drifts" paragraph warns about, arriving WITHIN one file rather than between two.
#
# WHAT ARRIVES THROUGH IT, AND WHAT LEAVES. World.Arrive landed at task 4 and the `arrive` verb
# drives it; until 16 there is no AUTONOMOUS caller at all (adr/0128), so every arrival is one a
# human or a fixture asked for. Money crosses with them at task 5, the move-in Trip runs on
# placement at task 6, and `gives_up_after_days` below is the Pool's SINK at task 7 -- which is why
# this is the only shipped file that states it. ⚠ Read `arrivals_per_day` as a ceiling on a Day's
# admissions and NOT as a rate anything generates.

# The keys below are minimal.toml's and its comments carry their arguments -- read them there.
# What is commented HERE is what this file changes and why.

[[resource]]
name = "sundries"
family = "good"

[[resource]]
name = "repairs"
family = "good"

[[resource]]
name = "money"
family = "money"

[[business]]
name = "shop"
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[building]]
name = "dwelling"
bins = [
    { resource = "sundries", capacity = 48, owner = "occupant" },
    { resource = "repairs",  capacity = 4 },
]
tenanted = true
# Whether it parks at all -- the count is floor area over [capacity] floor_tiles_per_parking_space.
parked = true
business = "shop"

[[building]]
name = "port"
arrivals_per_day = 12

[[hinterland]]
edge = "west"
emigrant_balance_min = 40
emigrant_balance_max = 400

[[hinterland]]
edge = "south"
emigrant_balance_min = 120
emigrant_balance_max = 900

[[hinterland]]
edge = "east"
emigrant_balance_min = 200
emigrant_balance_max = 1400

[[hinterland]]
edge = "north"
emigrant_balance_min = 300
emigrant_balance_max = 2000

[[rule]]
name    = "restock"
kind    = "dwelling"
rate    = 8
apply   = { min = 1, max = 4 }
inputs  = []
outputs = [ { scope = "local", resource = "sundries", amount = 4 } ]

[[rule]]
name    = "consume"
kind    = "dwelling"
rate    = 32
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "sundries", amount = 4 } ]
outputs = []

[[rule]]
name    = "upkeep"
kind    = "dwelling"
rate    = 16
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "repairs", amount = 4 } ]
outputs = []

[[zone_rule]]
name          = "housing"
kind          = "dwelling"
zone          = 0
interval      = 32
revisit_ticks = 2048

[placement]
interval      = 32
revisit_ticks = 1024
candidates    = 3
gives_up_after_days = 120

[layers]
noise_range_metres            = 300
noise_intensity_percent       = 400
desirability_pollution_percent = 100
desirability_noise_percent     = 100
pollution_period      = 64
pollution_offset      = 0
land_value_period     = 256
land_value_offset     = 16
kernel_metres         = 1024
pollution_decay_ticks = 2048
land_value_tau        = 8

[roads]
block_tiles                    = 32
arterial_count                 = 16
arterial_junction_tiles        = 512
foot_crossing_every            = 4
foot_paths_per_thousand_blocks = 40
street_speed_kph               = 50
arterial_speed_kph             = 90
walk_speed_kph                 = 5
street_capacity_per_hour       = 3600
arterial_capacity_per_hour     = 12000
foot_path_capacity_per_hour    = 1000

[lots]
lots_per_segment = 5
# The most ground a Building leaves on each side of its parcel. A LENGTH and not a fraction, so
# coverage rises with the parcel -- see minimal.toml, which carries the argument.
setback_tiles = 2

[capacity]
# How much floor one tenancy, job or parking space takes, in Tiles -- see minimal.toml, which carries
# the argument and the measurement. A kind says WHETHER it houses; the count derives from the ground,
# and the three rates are what the standing city already said about a detached building, divided.
floor_tiles_per_occupant      = 25
floor_tiles_per_job           = 3
floor_tiles_per_parking_space = 12

[households]
car_ownership_percent = 100

[parking]
radius_metres = 400
shed_keeps = 24

[trips]
crossing_seconds = 30
commute_fast_minutes = 20
commute_moderate_minutes = 40
commute_budget_minutes = 50

[jobs]
interval      = 32
revisit_ticks = 1024
candidates    = 3
shift_hours_min = 6
shift_hours_max = 10
arrive_early_max_minutes = 15
