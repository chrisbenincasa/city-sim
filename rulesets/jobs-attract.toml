# jobs-attract.toml -- attracted.toml with a qualified-vacancy arrival term.
# This is a demonstration fixture, not a balanced city. All jobs tuning is provisional.
# Foot-only access deliberately understates drivers' reach. Zero jobs remain a soft disadvantage.
# Outside counts describe qualified open posts; the city counts each vacancy once if any adult
# can hold it. A stronger Outside competes for the same prospective Households.

[[resource]]
name = "sundries"
family = "good"
[[resource]]
name = "repairs"
family = "good"
[[resource]]
name = "money"
family = "money"
[[business]]
name = "shop"
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10
[[building]]
