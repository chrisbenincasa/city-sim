# PROVISIONAL: weekday school stays and independent return journeys.
# Uses the schooled admission fixture with explicit scheduling. No parent drop-off or balance claim.


[[resource]]
name = "sundries"
family = "good"

[[resource]]
name = "repairs"
family = "good"

[[resource]]
name = "money"
family = "money"

[[business]]
name = "shop"
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[building]]
name = "dwelling"
bins = [
    { resource = "sundries", capacity = 48, owner = "occupant" },
    { resource = "repairs",  capacity = 4 },
]
houses   = true
premises = true
parked = true
business = "shop"

[[rule]]
name    = "restock"
kind    = "dwelling"
rate    = 8
apply   = { min = 1, max = 4 }
inputs  = []
outputs = [ { scope = "local", resource = "sundries", amount = 4 } ]

[[rule]]
name    = "consume"
kind    = "dwelling"
rate    = 32
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "sundries", amount = 4 } ]
outputs = []

[[rule]]
name    = "upkeep"
kind    = "dwelling"
rate    = 16
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "repairs", amount = 4 } ]
outputs = []

[[zone_rule]]
name          = "housing"
kind          = "dwelling"
zone          = 0
interval      = 32
revisit_ticks = 2048

[placement]
interval      = 32
revisit_ticks = 1024
candidates    = 3
gives_up_after_days = 60

[layers]
noise_range_metres            = 300
noise_intensity_percent       = 400
desirability_pollution_percent = 100
desirability_noise_percent     = 100
pollution_period      = 64
pollution_offset      = 0
land_value_period     = 256
land_value_offset     = 16
kernel_metres         = 1024
pollution_decay_ticks = 2048
land_value_tau        = 8

[roads]
block_tiles                    = 32
arterial_count                 = 0
arterial_junction_tiles        = 512
foot_crossing_every            = 4
foot_paths_per_thousand_blocks = 40
street_speed_kph               = 50
arterial_speed_kph             = 90
walk_speed_kph                 = 5
street_capacity_per_hour       = 3600
arterial_capacity_per_hour     = 12000
foot_path_capacity_per_hour    = 1000

[lots]
lots_per_segment = 5
setback_tiles = 2

[capacity]
floor_tiles_per_occupant      = 25
floor_tiles_per_job           = 3
floor_tiles_per_parking_space = 12

floor_tiles_per_place         = 3

[parking]
radius_metres = 400
shed_keeps = 24

[trips]
crossing_seconds = 30
commute_fast_minutes = 20
commute_moderate_minutes = 40
commute_budget_minutes = 50

[jobs]
interval      = 32
revisit_ticks = 1024
candidates    = 3
shift_hours_min = 6
shift_hours_max = 10
arrive_early_max_minutes = 15

[[life_stage]]
name          = "young"
duration_days = 24
spread_days   = 8
next          = "family"
childless     = "childless"
children_min  = 0
children_max  = 3
adult_age_min_days = 1
adult_age_max_days = 160

[[life_stage]]
name          = "family"
duration_days = 48
spread_days   = 16
next          = "mature_family"

[[life_stage]]
name           = "mature_family"
duration_days  = 48
spread_days    = 16
next           = "empty_nest"
children_become = "young"

[[life_stage]]
name          = "childless"
duration_days = 40
spread_days   = 16

[[life_stage]]
name          = "empty_nest"
duration_days = 40
spread_days   = 16

[[building]]
name = "school"
serves = "education"

[needs]
sustenance_degrade   = 4
sustenance_recover   = 1
satisfaction_degrade = 1
satisfaction_recover = 1
education_degrade    = 2
education_recover    = 2
floor = -1000

[school]
days = 31
bell_earliest_minute = 480
bell_latest_minute = 540
dismiss_earliest_minute = 900
dismiss_latest_minute = 960
retry_ticks = 32
history_keeps = 1024
