# Playable housing demonstration, not a balanced economy. Export with examples/UrbanNeighbourhood.
# Two resident Households and two arriving Households share one street. Existing rents are
# affordable but worse than Outside; the permitted new terrace offers a lower rent.
# Provisional timing: 256 Ticks of repeated failed searches, 64-Tick freshness. High choice
# sensitivity makes this controlled contrast reliable; it is not proposed game balance.
