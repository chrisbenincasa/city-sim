# The eviction Ruleset. It models no city, and it exists to make ONE THING VISIBLE.
#
# `minimal.toml` WITH TWO RULES DELETED, and the deletions are the whole content. `restock` is gone,
# so the tenant's `sundries` Bin is filled by nothing and its `consume` starves. `upkeep` is gone, so
# the PREMISES have no Rule that can fail at all. What is left is a Building that cannot be condemned
# holding Households that cannot be fed.
#
# WHAT IT EXISTS TO SHOW: a tenancy ending while the premises stand. That is milestone 25 in one
# frame -- adr/0141's line that the economic actor is the OCCUPANT and not the Building, made
# watchable rather than argued. Run it with `--zones` and the sweep reports tenancies ended against
# zero condemned; run it with `--evidence` and a Building panel names which tenant is failing.
#
# ⚠ IT IS A DEMONSTRATION AND NOT A CITY, and more so than the other twelve. A dwelling whose larder
# nothing fills is not a hardship, it is an absence of the mechanism that would fill one -- so nothing
# here is a claim about how often a real tenancy should end, or about what a household in trouble
# looks like. THE NUMBERS THIS FILE PRODUCES RATIFY NOTHING.
#
# ⚠ ON THIS FILE NO BUILDING IS EVER DEMOLISHED, and that is the point rather than a limitation.
# `declining.toml` is the opposite: its `upkeep` starves for ever and its tenants are fed, so it
# condemns constantly and ends no tenancies -- measured at 2,610 condemned against 0 tenancies ended
# over ten Days. ***The two files are the same city with the failure moved from the premises to the
# tenant***, which is why this one is a two-rule diff rather than a new world.
#
# ⚠ THE COMPARISON NAMED `minimal.toml` UNTIL MILESTONE 17 AND NOW NAMES `declining.toml`, because
# minimal.toml no longer states `condemn_after` and condemns nothing at all (adr/0164). The 2,610 was
# measured on the file that used to carry decline, which is declining.toml's content exactly, so the
# DIGITS still describe the world the sentence now points at -- but this file is a two-Rule diff
# against minimal.toml and the world it is contrasted with is a two-key diff the other way.
#
# ⚠ IT CYCLES, AND THE CYCLE IS WHAT A LONG RUN IS FOR. A tenancy ends, the Household goes to the
# Unplaced Pool, placement puts it in a standing Building, and it starves again. Every turn of that
# loop CREATES AND DESTROYS a tenant's Rule Instances and its Bins -- the collection milestone 25
# actually introduced -- so this is the file that asks whether adr/0006 holds for them. `[placement]`
# states no `gives_up_after_days`, so nobody leaves the Pool and the population is conserved.
#
# Everything below this header is `minimal.toml`'s, including its own header's remaining paragraphs,
# and where the two disagree about what a key is for, THAT FILE IS THE ONE THAT OWNS THE EXPLANATION.
#
# ----------------------------------------------------------------------------------------------
#
# The minimal Ruleset. It models no city, and it is not the beginning of one.
#
# Slice 7 task 10a of plans/0011-rule-engine-bins-and-rules.md. Its whole job is to be the smallest
# content that makes Bins move, so that the wiring underneath it — a Ruleset reaching a World, a
# Building given its kind's Bins and Rule Instances when it is built, an arming stagger — is exercised
# by a running city rather than by a test that builds the same shape by hand.
#
# WHY IT NAMES NO GOOD. 04 §1's five Goods are Produce, Food, Timber, Materials and Consumer Goods,
# and every one of them is produced by one Building and consumed by another. That crosses an ownership
# boundary, which is the `pool` scope, which is a named hole that throws until Phase 2 brings roads,
# Districts and connectivity. So a Ruleset that could run today and also name a Good would be claiming
# a chain it cannot express. `sundries` is deliberately a word for goods too unimportant to name:
# nothing in this file should be read as a decision about content. Choosing the Goods is decision
# owed 4, and it belongs to task 10b with the chain it is for.
#
# WHY THERE IS NO on_fail CHAIN. A link rescues by relieving the Bin the head failed on, from a source
# the head could not reach. Every source available today is the Building's own Bins, so a chain here
# would be a Rule rescuing itself. adr/0045's ladder starts at the District Pool, and that is task 10b.
#
# WHY IT EMITS NO POLLUTION. Not because it would be unbounded — adr/0051's decay is built, so a `map`
# term is now a stock the environment absorbs and settles at a level proportional to the emission rate.
# It emits nothing because a dwelling is not industry. `02 §2.4` gives industrial pollution point
# sources, and inventing a smokestack here to exercise a code path would be this file claiming
# something about content, which its first line says it does not. The Rule engine's `map` output is
# covered by `RuleEvaluationTests`, and the absorption by `LayerFieldsTests` and `LayerLongRunTests`.
#
# THE GOODS QUANTITIES AND THE BIN CAPACITIES BOTH x4 ON 2026-08-13, AND IT CHANGED NOTHING THIS CITY
# DOES. adr/0094 took TICKS_PER_DAY from 8192 to 2048 and says the Goods quantities scale x4: a Day
# holds a quarter as many firings, so a per-firing `amount` goes x4 to keep the rate in Goods per Day.
# That is airtight and it is only half the edit -- the capacities had to follow, and they follow for a
# DIFFERENT reason, which is the part worth reading.
#
# `amount` AND `capacity` ARE BOTH IN GOODS AND THEY ARE DENOMINATED DIFFERENTLY. `amount` is
# Days-denominated: hold Goods per Day, so the number moves x4. `capacity` is TICKS-denominated: what
# has to hold is FIRINGS HELD -- capacity / (amount x occupants) -- and firings x rate is a DURATION.
# It is written in Goods, so keeping that duration still REQUIRES moving the number, and it moves x4
# only because `amount` did. THE UNIT OF A QUANTITY IS NOT ITS DENOMINATION.
#
# WHAT KEEPING capacity = 12 WOULD HAVE DONE. The larder would have held ONE firing of `consume` where
# it held four. In in-world time the two read identical -- 22.5 minutes of supply either way -- so
# measured in Goods nothing is wrong. Measured in firings held, every Bin in the game shrank by four,
# and a Bin that must be EXACTLY FULL for one `consume` to succeed is a knife edge. It fired
# Invariant.WaiterIsBlockedByTheBinItNames and exposed a live defect in the wake path, filed unfixed as
# plans/0003 queue item 8.
#
# IT IS BEHAVIOUR-NEUTRAL, MEASURED, AND THE COMMIT FIRST CLAIMED OTHERWISE. Running the pre-rescale
# file and this one for 4,096 Ticks gives a BYTE-IDENTICAL 86-line census -- buildings 1,201 -> 642, the
# Unplaced Pool, rule evaluations, Trips, every row. Only the State Hash moved, because Bin levels are
# four times larger. The commit said "a dwelling now holds 90 in-world minutes where it held 22.5, which
# is a change to the world": the digits are right and the comparison was never stated. The larder is
# 4 firings x rate 32 = 128 TICKS, and it was 128 Ticks before the clock moved too. 90-vs-22.5 is HEAD
# against the PRE-CLOCK world, which is adr/0094's cost arriving in one more place, not this edit's.
# plans/0012 Cause 5: a number that is one half of a ratio says which half.
#
# NOTHING HERE CAME OUT OF PROPORTION, because everything in this file is denominated in FIRINGS.
#
# 48 IS A COST DIAL HERE, NOT A BALANCE DIAL, AND THAT IS MEASURED TOO. Swept at 24, 36, 48 and 96, NO
# ROW OF THE CENSUS MOVES; only `rules due` and `rules evaluations` move, and they move UP with capacity
# (20,134 -> 25,023 at the first reading, 48 -> 96), because a deeper larder gives `restock` more
# space to keep working. A BIGGER BUFFER COSTS MORE, NOT LESS. The larder decides nothing because it
# is DEEPER THAN THE BUILDING'S LIFESPAN: nothing in this file produces `repairs`, so `upkeep` condemns
# every dwelling at 64 Ticks and a 128-Tick larder absorbs a shock that never arrives. Restoring 22.5
# in-world minutes would need 2 firings held -- one above a known crash -- or `consume`'s rate quartered,
# which adr/0094 refused on cost. And 22.5 WAS NEVER CHOSEN: it is `capacity = 12` in a file whose first
# line says it models no city (adr/0070).
#
# THE STEADY STATE IS THE POINT, AND IT IS A SURPLUS ONE. Production outruns consumption, so the Bin
# sits near its ceiling and `restock` is the Rule that fails: it sleeps on space, `consume` draws
# and wakes it, it refills and sleeps again. Both Rules move for ever, nothing trends, and no Rule is
# ever wrongly asleep. THE SHORTAGE REGIME IS NOT AVAILABLE AND THAT IS AN ENGINE PROPERTY RATHER THAN
# A TASTE: a recorded shortfall is a deficit at the instant of failure and the wait list wakes on the
# arriving quantity, so a consumer short of 3 is never woken by three arrivals of 1. Producing in a
# quantum at least as large as any consumer's deficit is what makes this file's steady state honest.
# See finding 41.
#
# WHY EVERY DWELLING FALLS DOWN, AND WHY THAT IS NOT A BALANCE MISTAKE. Slice 10 task 7 needs a
# Building that is *continuously* starved, because failure pressure is a duration and a Rule that is
# rescued resets it (adr/0053). Nothing in this file could supply one: the only Rule that fails here
# is `restock`, and it fails on SPACE — the Bin is full, which is the healthy state of a producer
# with nobody to sell to, and the amended adr/0053 reads only starvation. So `upkeep` was added, and
# it draws on a Resource this file deliberately never produces. Every dwelling therefore declines,
# which is total rather than selective because there is one kind and it has one behaviour. A city
# where some Buildings thrive and others do not needs Buildings that differ, which needs content, and
# content is what the first line of this file says it is not. The cycle it does produce is real: a
# condemned dwelling is demolished, its Households go to the Unplaced Pool, its Lot goes vacant, and
# the [[zone_rule]] below raises another — which is the first time anything in this project has both
# built and unbuilt, and the first time slice 5 task 7's `slots` assertion has had a table that churns.
#
# It is deleted rather than grown when task 10b becomes possible.

# The keys below are minimal.toml's and its comments carry their arguments -- read them there.
# What is commented HERE is what this file changes and why.

[[resource]]
name = "sundries"
family = "good"

[[resource]]
name = "repairs"
family = "good"

[[resource]]
name = "money"
family = "money"

[[business]]
name = "shop"
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[building]]
name = "dwelling"
bins = [
    { resource = "sundries", capacity = 48, owner = "occupant" },
    { resource = "repairs",  capacity = 4 },
]
tenancy_ends_after_days = 1
tenanted = true
# Whether it parks at all -- the count is floor area over [capacity] floor_tiles_per_parking_space.
parked = true
business = "shop"

[[rule]]
name    = "consume"
kind    = "dwelling"
rate    = 32
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "sundries", amount = 4 } ]
outputs = []

[[zone_rule]]
name          = "housing"
kind          = "dwelling"
zone          = 0
interval      = 32
revisit_ticks = 2048

[placement]
interval      = 32
revisit_ticks = 1024
candidates    = 3

[layers]
noise_range_metres            = 300
noise_intensity_percent       = 400
desirability_pollution_percent = 100
desirability_noise_percent     = 100
pollution_period      = 64
pollution_offset      = 0
land_value_period     = 256
land_value_offset     = 16
kernel_metres         = 1024
pollution_decay_ticks = 2048
land_value_tau        = 8

[roads]
block_tiles                    = 32
arterial_count                 = 0
arterial_junction_tiles        = 512
foot_crossing_every            = 4
foot_paths_per_thousand_blocks = 40
street_speed_kph               = 50
arterial_speed_kph             = 90
walk_speed_kph                 = 5
street_capacity_per_hour       = 3600
arterial_capacity_per_hour     = 12000
foot_path_capacity_per_hour    = 1000

[lots]
lots_per_segment = 5
# The most ground a Building leaves on each side of its parcel. A LENGTH and not a fraction, so
# coverage rises with the parcel -- see minimal.toml, which carries the argument.
setback_tiles = 2

[capacity]
# How much floor one tenancy, job or parking space takes, in Tiles -- see minimal.toml, which carries
# the argument and the measurement. A kind says WHETHER it houses; the count derives from the ground,
# and the three rates are what the standing city already said about a detached building, divided.
floor_tiles_per_occupant      = 25
floor_tiles_per_job           = 3
floor_tiles_per_parking_space = 12

[parking]
radius_metres = 400
shed_keeps = 24

[trips]
crossing_seconds = 30
commute_fast_minutes = 20
commute_moderate_minutes = 40
commute_budget_minutes = 50

[jobs]
interval      = 32
revisit_ticks = 1024
candidates    = 3
shift_hours_min = 6
shift_hours_max = 10
arrive_early_max_minutes = 15
