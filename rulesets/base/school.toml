# A public school: a service kind whose trade pays a wage and charges no tuition.
#
# The player places it with the `service` command, and the treasury pays `placement_cost`. No zone
# rule names the school, because the city does not site its own schools. The grant lands in the
# school's till, and the teachers are paid from it. If the grant stops, paydays fall short and the
# trade closes after 14 Days in arrears, which is two short weekly paydays. A teacher leaves after 3
# unpaid Days. The grant per declared job is a quarter above the daily wage, which covers the 5%
# business levy on the school's till. A school whose trade goes bankrupt opens it again with an
# empty till, and hires once the grant returns. The grant is paid after the housed rebate, so a
# short treasury stops the school first.

[[business]]
id = "teaching"
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10
wage_per_day    = 1024
pay_period_days = 7
goes_bankrupt_after_days_in_arrears = 14
quits_after_days_unpaid = 3

[[building]]
id             = "school"
label          = "School"
serves         = "education"
level          = 1
premises       = true
business       = "teaching"
placement_cost = 262144
# PROVISIONAL: a Building cut off from every Outside Connection is abandoned after 14 Days, and
# its shell collapses 30 Days later (adr/0177). A playtest tests the first.
abandoned_after_cut_off_days = 14
collapses_after_days = 30
bins = [
    { resource = "money", owner = "business" },
]

[[policy]]
id       = "school_funding"
order    = 5
sweeps   = "business"
trade    = "teaching"
interval = 2048
apply    = { derived = "jobs", percent = 100 }
transfer = { from = "global", to = "local", resource = "money", amount = 1280 }
