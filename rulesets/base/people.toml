# Who lives in the city and who waits outside it.
#
# The four edges hold the same people and differ in rent, centrality and purse, as in
# attracted.toml. Arrivals need a gate the player places on an edge Lot. Both stages that raise
# children state school level 1, so the one school kind teaches every child.

[[building]]
id = "port"
label = "Gate"
arrivals_per_day = 96

[immigration]
reconsider_days       = 2
recovery_days         = 32
queue_wait_days       = 2
queue_reconsider_days = 1

[[hinterland]]
id = "west"
edge = "west"
rent = 900
centrality_tiles = 6000
emigrant_balance_min = 800
emigrant_balance_max = 4000

[[hinterland.population]]
stage           = "young"
adults_by_tier  = [1, 0, 0]
children        = 0
money_band      = 0
households      = 600

