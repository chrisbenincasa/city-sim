# Streets, Lots, movement, placement and the treasury.

[roads]
block_tiles                    = 16
dense_core_percent             = 25
merged_block_percent           = 70
woodland_merge_percent         = 30
arterial_count                 = 16
arterial_junction_tiles        = 512
foot_crossing_every            = 4
foot_paths_per_thousand_blocks = 40
street_speed_kph               = 50
arterial_speed_kph             = 90
walk_speed_kph                 = 5
street_capacity_per_hour       = 3600
arterial_capacity_per_hour     = 12000
foot_path_capacity_per_hour    = 1000
# PROVISIONAL: the founding log's 40 Segments cost 5,120 a Day.
upkeep_per_segment_per_day     = 128

[lots]
lots_per_segment = 5
setback_tiles = 2
# Zoned ground is built on edge to edge, so a painted block holds no unbuilt middle.
block_pattern = "perimeter"
# PROVISIONAL: a 60-Tile house on neutral ground costs about a quarter of the school's placement.
demolition_price_per_tile = 1024

# 16 rather than attracted.toml's 25. A trade is withheld wherever a parcel divides into one
# tenancy, and 16 keeps every parcel this subdivider carves above that, so a placed school always
# gets its teachers. funded.toml's change 6 has the measurements.
[capacity]
floor_tiles_per_occupant      = 16
floor_tiles_per_job           = 3
floor_tiles_per_parking_space = 6
floor_tiles_per_place         = 3

[households]
car_ownership_percent = 100

[parking]
radius_metres = 400
shed_keeps = 24

[trips]
crossing_seconds = 30
commute_fast_minutes = 20
commute_moderate_minutes = 40
commute_budget_minutes = 50

# PROVISIONAL: ten Days of failed commutes cost the job (adr/0177). A full-parking measurement
# tests it.
[jobs]
dismissed_after_failed_commute_days = 10
labour_per_day = 16
interval      = 32
revisit_ticks = 1024
candidates    = 3
shift_hours_min = 6
shift_hours_max = 10
arrive_early_max_minutes = 15

# Provisional: gives_up_after_days is the compressed bound attracted.toml inherited from
# crowded.toml. An arrival that finds no home within it leaves.
[placement]
interval      = 32
revisit_ticks = 1024
candidates    = 3
gives_up_after_days = 2
mu_percent                = 100
centrality_tiles_per_unit = 2048
rent_per_unit             = 120
moving_costs_rent         = 720

[layers]
noise_range_metres            = 300
noise_intensity_percent       = 400
desirability_pollution_percent = 100
desirability_noise_percent     = 100
pollution_period      = 64
pollution_offset      = 0
land_value_period     = 256
land_value_offset     = 16
kernel_metres         = 1024
pollution_decay_ticks = 2048
land_value_tau        = 8

[needs]
sustenance_degrade   = 4
sustenance_recover   = 1
satisfaction_degrade = 1
satisfaction_recover = 1
education_degrade    = 2
education_recover    = 2
floor = -1000

# The money the city is founded with. It pays for the school and every grant after it.
[treasury]
opening_balance = 4194304

# PROVISIONAL. Mill wages fall under the allowance, and grocer and teacher wages in the middle band.
[income_tax]
allowance_per_day       = 512
upper_threshold_per_day = 8192
middle_rate_percent     = 10
upper_rate_percent      = 20

# PROVISIONAL. The threshold is four grocer day-wages. The rates are taxing.toml's.
[business_tax]
threshold_per_day  = 16384
lower_rate_percent = 10
upper_rate_percent = 20

# Grocers buy flour through a District Pool, so the city needs Districts. shopping.toml has the numbers.
[districts]
prominence_percent = 50
revisit_ticks = 2048
hysteresis_percent = 50
migrate_cells = 16

[market]
decay_percent = 50
move_cap_percent = 10

[shopping]
interval = 64
low_days = 1
target_days = 3
severe_need = -16
known_shops = 3
search_candidates = 32
retry_ticks = 128

[founding]
founding_band    = 8192
reconsider_ticks = 8192

# The treasury's return path. Income tax and business tax flow into the treasury, and these two
# levies take 5% of each balance a Day. The rebate pays every housed Household 640 a Day. An
# unhoused Household gets nothing, because it may emigrate and take the money with it.
#
# The rebate outgrows tax income as the city fills, so the treasury runs dry around Day 40 and the
# school grant, paid after the rebate, stops. Governing the rebate down is the player's fix.
[[policy]]
id       = "business_levy"
order    = 2
sweeps   = "business"
interval = 2048
apply    = { derived = "balance", percent = 5 }
transfer = { from = "local", to = "global", resource = "money", amount = 1 }

[[policy]]
id       = "household_levy"
order    = 3
sweeps   = "household"
interval = 2048
apply    = { derived = "balance", percent = 5 }
transfer = { from = "local", to = "global", resource = "money", amount = 1 }

[[policy]]
id       = "housed_rebate"
order    = 4
sweeps   = "household"
interval = 2048
apply    = { derived = "housed", percent = 100 }
transfer = { from = "global", to = "local", resource = "money", amount = 640 }
