# The dwelling the housing zone builds, the shopfront the trade zone builds, and the chain between them.
#
# Each dwelling hosts a mill whose staff turn labour into flour. Grocers buy flour through the
# District Pool, bake it with their own labour into sundries, and sell those to Households. Every
# trade pays its staff daily from its takings, and a worker leaves after 3 unpaid Days. The treasury
# pays each zone-raised trade an opening grant of about one worker-week's wages, which buys a new
# grocer its first flour. A trade pays its owner what its till holds above two Days' wages; a
# zone-raised trade draws a housed Household as owner. plans/first-playable-founding-loop.md
# records the tuning run behind these numbers.
# Gates sell sundries and flour at a high price when local supply runs out. milled.toml carries the
# reasoning behind the shared numbers.
#
# Nothing produces `repairs`, so dwellings decline over time; minimal.toml says why.

[[business]]
id = "mill"
opening_grant = 8192
work_days = 31
wage_per_day = 1024
pay_period_days = 1
goes_bankrupt_after_days_in_arrears = 28
pays_owner_above_pay_periods = 2
quits_after_days_unpaid = 3
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[business]]
id = "grocer"
opening_grant = 8192
work_days = 124
open_days = 127
opens_hour = 7
closes_hour = 21
wage_per_day    = 1024
pay_period_days = 1
goes_bankrupt_after_days_in_arrears = 28
pays_owner_above_pay_periods = 2
quits_after_days_unpaid = 3
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[building]]
id = "dwelling"
label = "Terraced house"
bins = [
    { resource = "sundries", capacity = 128, owner = "occupant" },
    { resource = "repairs",  capacity = 4 },
    { resource = "flour",    capacity = 128, owner = "business" },
    { resource = "money",    owner = "business" },
    { resource = "labour",   owner = "business" },
]
houses   = true
premises = true
# A rate per floor Tile (money-circulation L7), charged on the floor a tenancy holds. A home here
# costs about 390 a Day on ground worth nothing. ⚠ NOT 24 OR 25; money-circulation's slice 3
# record says what both do to the founding school demonstration.
rent_per_floor_tile = 23
parked   = true
business = "mill"
# PROVISIONAL: a Building cut off from every Outside Connection is abandoned after 14 Days, and
# its shell collapses 30 Days later (adr/0177). A playtest tests the first.
abandoned_after_cut_off_days = 14
collapses_after_days = 30

[[building]]
id = "shopfront"
label = "Corner shop"
bins = [
    { resource = "sundries", capacity = 256, owner = "business" },
    { resource = "flour",    capacity = 8, owner = "business" },
    { resource = "repairs",  capacity = 4 },
    { resource = "money",    owner = "business" },
    { resource = "labour",   owner = "business" },
]
houses   = true
premises = true
# The dwelling's rate -- a flat over the shop rents like a house.
rent_per_floor_tile = 23
parked   = true
business = "grocer"
# PROVISIONAL: a Building cut off from every Outside Connection is abandoned after 14 Days, and
# its shell collapses 30 Days later (adr/0177). A playtest tests the first.
abandoned_after_cut_off_days = 14
collapses_after_days = 30

[[zone_rule]]
id            = "housing"
kind          = "dwelling"
zone          = 0
interval      = 32
revisit_ticks = 2048

[[zone_rule]]
id            = "trade"
kind          = "shopfront"
zone          = 1
interval      = 32
revisit_ticks = 2048
build_threshold_days = 2
cooldown_days        = 2

[[rule]]
id      = "restock"
order   = 1
kind    = "dwelling"
rate    = 8
apply   = { min = 1, max = 4 }
inputs  = [ { scope = "pool", resource = "sundries", amount = 4 } ]
outputs = [ { scope = "local", resource = "sundries", amount = 4 } ]

# A Household eats 32 sundries a Day. Shopping sizes a trip from this rule, so three Days of use
# (`target_days`) fit the 128-sundry bin. At rate 32 a Day's use would be 256, more than the bin
# holds, so the Household would stay below `low_days` and shop without pause.
[[rule]]
id      = "consume"
order   = 2
kind    = "dwelling"
rate    = 256
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "sundries", amount = 4 } ]
outputs = []

[[rule]]
id      = "upkeep"
order   = 3
kind    = "dwelling"
rate    = 16
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "repairs", amount = 4 } ]
outputs = []

[[rule]]
id      = "mill"
order   = 4
kind    = "dwelling"
rate    = 8
apply   = { min = 1, max = 4 }
inputs  = [ { scope = "local", resource = "labour", amount = 1 } ]
outputs = [ { scope = "local", resource = "flour", amount = 1 } ]

[[rule]]
id      = "bake"
order   = 5
kind    = "shopfront"
rate    = 8
apply   = { min = 1, max = 4 }
inputs  = [
    { scope = "local", resource = "labour", amount = 1 },
    { scope = "local", resource = "flour",  amount = 1 },
]
outputs = [ { scope = "local", resource = "sundries", amount = 16 } ]

[[rule]]
id      = "buy_flour"
order   = 6
kind    = "shopfront"
rate    = 8
apply   = { min = 1, max = 1 }
inputs  = [
    { scope = "local", resource = "labour", amount = 1 },
    { scope = "pool",  resource = "flour",  amount = 4 },
]
outputs = [ { scope = "local", resource = "flour", amount = 4 } ]
