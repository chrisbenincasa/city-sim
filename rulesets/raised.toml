# raised.toml -- founded.toml with five [[life_stage]] tables, and nothing else changed.
#
# ⚠ THEY ARE aged.toml'S TABLES AS THEY STOOD BEFORE 2026-08-31 AND NOT AS THEY STAND NOW.
# plans/0045 row 13 halved that file's stage floors to double their spreads, and the edit was
# scoped there on purpose (plans/0046). The numbers below are not a second opinion about a life:
# they are the old ones, unre-measured, and this file demonstrates founding rather than pacing.
#
# THE ONLY SHIPPED FILE IN WHICH A CITY BOTH GENERATES ITS OWN POPULATION AND FOUNDS BUSINESSES, and
# it exists for one reason: plans/0046 stage 4's working-age gate has TWO callers and no world could
# reach the second. `EmploymentEngine.Assign` and `PlacementEngine.Found` both ask
# `World.IsOfWorkingAge`; aged.toml has demographics and no [founding], founded.toml has [founding]
# and no demographics. ***So the founding half of the gate was correct and unobservable*** -- which
# is plans/0034 F17's shape exactly, a mechanism shipped right and unreachable for want of Ruleset
# CONTENT rather than code. This file is the content.
#
# WHY IT IS founded.toml AND NOT aged.toml PLUS A CHANNEL. Founding is a MEANS TEST: it reads the
# Household's balance against a band, and every Household on minimal.toml -- which aged.toml is built
# from -- holds exactly zero. A gate on a channel that refuses everybody anyway would demonstrate
# nothing. founded.toml is taxed.toml underneath and puts money in Households, which is what makes
# the refusal attributable to AGE rather than to poverty.
#
# ⚠ IT INHERITS founded.toml'S OWN WARNINGS AND THEY STILL APPLY. Its shop count is bounded by the
# SOURCE EXHAUSTING rather than by any sink, so DO NOT QUOTE A MONEY FIGURE OUT OF A RUN OF THIS AS
# ANYTHING ABOUT THE ECONOMY. Read that file's header before reading this one's numbers.
#
# ⚠ AND IT INHERITS aged.toml'S: the fertility draw is UNCONDITIONED (adr/0011 wants it conditioned
# on housing cost, dwelling size and job security, and none of that machinery exists), the band's
# mean of 1.5 sits below the 2.0 that replaces exactly, and the founding cohort's echo does not damp.
#
# 🔴 SO THIS FILE RATIFIES NOTHING. It is a reachability fixture: it makes one branch executable that
# no other world could reach. Every number in it is somebody else's, unratified, and carried here so
# the diff against founded.toml is exactly the stage table.
#
# ⚠ `gives_up_after_days` IS ALREADY HERE and is founded.toml's own, at 30 Days. It happens to
# satisfy the refusal plans/0046 stage 3 added for a spawning Ruleset -- a Pool with a door and no
# sink grows without bound, and internal generation is a door. The key was written for the
# unpremised pool's bound and it covers both, which is a coincidence worth naming rather than a
# design: adr/0144 has a Business share the Household's bound as a declared stand-in.

# The keys below are minimal.toml's and its comments carry their arguments -- read them there.
# What is commented HERE is what this file changes and why.

[[resource]]
name = "sundries"
family = "good"

[[resource]]
name = "repairs"
family = "good"

[[resource]]
name = "money"
family = "money"

[[business]]
name = "shop"
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[building]]
name = "dwelling"
bins = [
    { resource = "sundries", capacity = 48, owner = "occupant" },
    { resource = "repairs",  capacity = 4 },
]
tenanted = true
business = "shop"

[[rule]]
name    = "restock"
kind    = "dwelling"
rate    = 8
apply   = { min = 1, max = 4 }
inputs  = []
outputs = [ { scope = "local", resource = "sundries", amount = 4 } ]

[[rule]]
name    = "consume"
kind    = "dwelling"
rate    = 32
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "sundries", amount = 4 } ]
outputs = []

[[rule]]
name    = "upkeep"
kind    = "dwelling"
rate    = 16
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "repairs", amount = 4 } ]
outputs = []

[[zone_rule]]
name          = "housing"
kind          = "dwelling"
zone          = 0
interval      = 32
revisit_ticks = 2048

[placement]
interval      = 32
revisit_ticks = 1024
candidates    = 3
gives_up_after_days = 30

[[business]]
name                      = "bakery"
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[business]]
name                      = "barber"
shift_start_earliest_hour = 9
shift_start_latest_hour   = 9

[founding]
founding_band    = 400
reconsider_ticks = 8192

[layers]
noise_range_metres            = 300
noise_intensity_percent       = 400
desirability_pollution_percent = 100
desirability_noise_percent     = 100
pollution_period      = 64
pollution_offset      = 0
land_value_period     = 256
land_value_offset     = 16
kernel_metres         = 1024
pollution_decay_ticks = 2048
land_value_tau        = 8

[roads]
block_tiles                    = 32
arterial_count                 = 0
arterial_junction_tiles        = 512
foot_crossing_every            = 4
foot_paths_per_thousand_blocks = 40
street_speed_kph               = 50
arterial_speed_kph             = 90
walk_speed_kph                 = 5
street_capacity_per_hour       = 3600
arterial_capacity_per_hour     = 12000
foot_path_capacity_per_hour    = 1000

[lots]
lots_per_segment = 5
# The most ground a Building leaves on each side of its parcel. A LENGTH and not a fraction, so
# coverage rises with the parcel -- see minimal.toml, which carries the argument.
setback_tiles = 2

[capacity]
# How much floor one tenancy, job or parking space takes, in Tiles -- see minimal.toml, which carries
# the argument and the measurement. A kind says WHETHER it houses; the count derives from the ground,
# and the three rates are what the standing city already said about a detached building, divided.
floor_tiles_per_occupant      = 25
floor_tiles_per_job           = 3
floor_tiles_per_parking_space = 12

[trips]
crossing_seconds = 30
commute_fast_minutes = 20
commute_moderate_minutes = 40
commute_budget_minutes = 50

[jobs]
interval      = 32
revisit_ticks = 1024
candidates    = 3
shift_hours_min = 6
shift_hours_max = 10
arrive_early_max_minutes = 15

[households]
car_ownership_percent = 0
opening_balance_min = 0
opening_balance_max = 1000

[[policy]]
name = "household_levy"
sweeps = "household"
interval = 2048
apply = { derived = "balance", percent = 10 }
transfer = { from = "local", to = "global", resource = "money", amount = 1 }

[[policy]]
name = "household_rebate"
sweeps = "household"
interval = 2048
apply = { min = 100, max = 100 }
transfer = { from = "global", to = "local", resource = "money", amount = 1 }

[[life_stage]]
name          = "young"
duration_days = 24
spread_days   = 8
next          = "family"
childless     = "childless"
children_min  = 0
children_max  = 3
adult_age_min_days = 1
adult_age_max_days = 160

[[life_stage]]
name          = "family"
duration_days = 48
spread_days   = 16
next          = "mature_family"

[[life_stage]]
name           = "mature_family"
duration_days  = 48
spread_days    = 16
next           = "empty_nest"
children_become = "young"

[[life_stage]]
name          = "childless"
duration_days = 40
spread_days   = 16

[[life_stage]]
name          = "empty_nest"
duration_days = 40
spread_days   = 16
