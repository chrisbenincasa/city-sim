emigrant_balance_min = 0
emigrant_balance_max = 0
prices = [
  { resource = "sundries", price = 100 },
  { resource = "repairs",  price = 250 },
]

[[hinterland]]
edge = "east"
emigrant_balance_min = 0
emigrant_balance_max = 0
prices = [
  { resource = "sundries", price = 120 },
  { resource = "repairs",  price = 200 },
]

[market]
decay_percent = 50
move_cap_percent = 10
[needs]
sustenance_degrade = 4
sustenance_recover = 4
satisfaction_degrade = 4
satisfaction_recover = 4
floor = -100

[shopping]
interval = 64
low_days = 1
target_days = 3
severe_need = -16
known_shops = 3
search_candidates = 32
retry_ticks = 128

# ===========================================================================================
# CHANGE 5 of 10: THE INCOME TAX SCHEDULE, SCALED TO THIS FILE'S WAGE RATHER THAN TO taxed.toml's.
# ===========================================================================================
# The three marginal bands a Citizen's earnings for ONE DAY are read against. Each rate applies only
# inside its own band, so crossing a threshold never reprices what came before it and take-home
# income never steps downward. Withheld at the payday by Borough.Core.Rules.WageEngine, which spreads
# a payment across the Days it closes before consulting any band -- so this file's seven-Day pay
# period is taxed as seven Days and not as one enormous one.
#
# 🔴 PROVISIONAL, LIKE EVERYTHING ELSE HERE. What each number is anchored to:
#
#   allowance_per_day = 512         A QUARTER of this file's own wage_per_day of 2048. The one
#                                   per-Day earnings figure the Ruleset already states, so the
#                                   allowance is a fraction of a Day worked. Taste, not derivation.
#
#   upper_threshold_per_day = 1536  THREE QUARTERS of the same wage, so a Citizen on the posted wage
#                                   earns into the upper band EVERY Day and BOTH BANDS ARE REACHABLE
#                                   BY THE ONLY WAGE THIS FILE PAYS. A threshold above 2048 would
#                                   make the upper rate unobservable here, which is the
#                                   demonstration failing quietly rather than loudly.
#
#   middle_rate_percent = 20        Leaves the middle band worth 1024 a Day and takes 204 of it.
#   upper_rate_percent  = 40        A doubling, taking 204 more from the 512 above the threshold.
#                                   The loader refuses an upper rate BELOW the middle one outright.
#
# ⚠ THE PROPORTIONS ARE WHY THESE ARE THE NUMBERS, and the digits move with the wage. A quarter and
# three quarters are what keep both bands reachable when change 2 moves wage_per_day; a schedule
# anchored to an absolute figure would silently stop demonstrating the upper rate the moment the wage
# went under it.
#
# THE HAND ARITHMETIC, so the --income column can be checked without reading any code. At the posted
# wage of 2048 a Day:
#
#   0 .. 512      allowance, taxed at nothing
#   512 .. 1536   1024 at 20%  ->  204
#   1536 .. 2048   512 at 40%  ->  204
#                               -------
#                  408 a Day, an effective rate of 19.9%
#
# A full seven-Day payday is therefore 14,336 gross, 2,856 withheld, 11,480 net. 408 is the whole
# rate here because nothing in this file grades a wage -- it states no [jobs] wage_tier_percent and no
# experience_premium_percent, so WorkSchedule.Graded hands back the posted figure and 2048 is the only
# rate anybody earns.
#
# ⚠ WITH CHANGES 1 TO 6 ONLY, THE RUN DOES NOT QUITE DIVIDE, WHICH IS THE CAVEAT ARRIVING IN ITS OWN
# PARAGRAPH. At 2,000 Citizens over 24,576 Ticks the withheld readings are 8,160 / 19,176 / 29,376 /
# 19,584 / 16,920 / 31,824 / 20,400 -- 20, 47, 72, 48, 41-and-a-part, 78 and 50 Citizen-Days: 356
# WHOLE Days for 145,248, and a remainder of 192 on the fifth. A payday that pays a worker only PART
# of what they are owed closes a short Day, and a short Day is taxed in a lower band. ***A column
# that does not divide is a partial payday, not a broken schedule*** -- read `owed and not covered`
# in --business beside it.
#
# ⚠ WITHOUT CHANGE 6 THE SAME RUN DIVIDES EXACTLY: 20, 47, 72, 48, 42, 78 and 50 -- 357 whole Days
# for 145,656. The 216 between the two is the WHOLE of the profit tax's effect on this file's
# payroll, and it is one worker on one Day being paid part of what they were owed. `--business`
# reports the same 702,144 paid, the same 115 payments, the same 63,808 uncovered and the same 4
# short paydays either way.
#
# ⚠ AND AS THE FILE NOW SHIPS IT DIVIDES AGAIN, WHICH IS NOT THE IMPROVEMENT IT LOOKS LIKE. The
# readings are 8,160 / 19,176 / 29,376 / 19,584 / 17,544 / 0 / 31,824 / 20,400 for 146,064, and
# every one of them is a whole multiple of 408 -- 20, 47, 72, 48, 43, 78 and 50. Isolated, it is
# CHANGE 10 that did it and not change 9: the file with changes 7 to 9 withholds 145,533, which does
# not divide, and the file with 7, 8 and 10 withholds the same 146,064 as the shipped one. ***The
# subsidy bought the partial Day off and lost three whole paydays doing it*** -- 115 payments to
# 112, and 64,808 owed and uncovered to 76,604. Read the divisibility beside those two figures or
# not at all.

[income_tax]
allowance_per_day       = 512
upper_threshold_per_day = 1536
middle_rate_percent     = 20
upper_rate_percent      = 40

# ===========================================================================================
# CHANGE 6 of 10: THE PROFIT TAX, SCALED TO THIS FILE'S OWN RATES BILL RATHER THAN TO ITS WAGE.
# ===========================================================================================
# The two marginal bands a BUSINESS's profit for ONE DAY is read against. Collected once a Day, at
# the Day boundary, by Borough.Core.Rules.BusinessTaxEngine -- which runs in phase 1, ahead of
# everything that recognises revenue, because a Business's Day figures stand only until the first
# recognition of the NEXT Day rolls them to zero.
#
# ⚠ THERE IS NO ALLOWANCE KEY AND THAT ABSENCE IS THE DECISION (plans/0072 D8). An author wanting
# relief on small profits writes `lower_rate_percent = 10` and the threshold becomes the allowance.
# That is why this table has three keys where [income_tax] has four.
#
# 🔴 PROVISIONAL, LIKE EVERYTHING ELSE HERE. What each number is anchored to:
#
#   threshold_per_day = 65536       FOUR TIMES the 16,384 this file's own `rates` Rule takes off a
#                                   shopfront every Day. It is the one per-Day money figure the
#                                   Ruleset already states on the scale a profit is measured in --
#                                   the wage of 2,048 is two orders too small -- so the upper band
#                                   starts where a Day's profit is four times what the premises
#                                   costs to keep.
#
#   lower_rate_percent = 10         HALF of [income_tax]'s middle rate of 20.
#   upper_rate_percent = 20         HALF of its upper rate of 40, so the doubling shape is kept.
#                                   ⚠ HALVED FOR A STATED REASON AND NOT FOR SYMMETRY: this file's
#                                   stock arrives free (see WHAT IT MUST NOT BE READ AS), so the
#                                   profit these rates read against is revenue less wages and is
#                                   larger than any world with a real cost of goods would report.
#                                   The loader refuses an upper rate BELOW the lower one outright.
#
# THE THRESHOLD SWEEP, and it is the measurement that chose 65,536. 2,000 Citizens, 24,576 Ticks,
# eleven assessed Days, 104 Business-Days closing in profit, rates held at 10/20 throughout:
#
#   16,384   (1x rates)    12 below / 92 above    collected 4,543,579
#   32,768   (2x)          17 / 87                collected 4,397,596
#   65,536   (4x)          35 / 69                collected 4,142,347
#   131,072  (8x)          47 / 57                collected 3,743,014
#   262,144  (16x)         61 / 43                collected 3,099,308
#
# ⚠ THE MOST EVEN SPLIT IS AT 8x AND IT IS NOT WHAT THIS FILE STATES. 4x populates both bands
# comfortably -- a third of the assessed Days below it, two thirds above, and both sides occupied on
# every Day from Day 4 on -- and 4x is the multiple with an anchor behind it. At 1x only 12 Days in
# 104 fall in the lower band and ***the lower rate is very nearly unobservable***, which is the
# failure mode the [income_tax] block above documents for the other schedule.
#
# THE RATE SWEEP, at the chosen threshold, and it produced the reading to keep:
#
#    5 / 10   collected 2,071,131
#   10 / 20   collected 4,142,347
#   20 / 40   collected 8,284,816
#
# 🔴 IT IS EXACTLY LINEAR, AND THAT IS A FINDING RATHER THAN AN ARITHMETIC. Doubling the rates
# doubles the take to within 122 units -- the floor of the integer division -- because NOTHING IN
# THIS CITY RESPONDS TO BEING TAXED. `--business` prints the same 203 employed, the same 115 wage
# payments, the same 63,808 uncovered and the same 4 short paydays at every setting above. ***A
# profit tax here is a pure extraction***, and it can be, because a grocer in this file has no
# investment to forgo, no price to raise and no decision that reads its own balance. Read the
# linearity as the absence of those mechanisms and never as evidence that a tax has no effects.
#
# THE HAND ARITHMETIC, so the --income column can be checked without reading any code. A grocer
# closing a Day on 100,000 profit:
#
#   0 .. 65,536       65,536 at 10%  ->  6,553
#   65,536 .. 100,000 34,464 at 20%  ->  6,892
#                                     -------
#                                      13,445, an effective rate of 13.4%
#
# A grocer closing on 50,000 pays 5,000 flat, and one closing on a loss pays nothing at all and
# carries nothing forward into the next Day.

[business_tax]
threshold_per_day  = 65536
lower_rate_percent = 10
upper_rate_percent = 20
