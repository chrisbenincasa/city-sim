[[hinterland]]
edge = "north"
emigrant_balance_min = 0
emigrant_balance_max = 0
prices = [
  { resource = "sundries", price = 100 },
  { resource = "repairs",  price = 250 },
]

[[hinterland]]
edge = "east"
emigrant_balance_min = 0
emigrant_balance_max = 0
prices = [
  { resource = "sundries", price = 120 },
  { resource = "repairs",  price = 200 },
]

[market]
decay_percent = 50
move_cap_percent = 10
[needs]
sustenance_degrade = 4
sustenance_recover = 4
satisfaction_degrade = 4
satisfaction_recover = 4
floor = -100

[shopping]
interval = 64
low_days = 1
target_days = 3
severe_need = -16
known_shops = 3
search_candidates = 32
retry_ticks = 128

# ===========================================================================================
# CHANGE 5 of 5: THE INCOME TAX SCHEDULE, SCALED TO THIS FILE'S WAGE RATHER THAN TO taxed.toml's.
# ===========================================================================================
# The three marginal bands a Citizen's earnings for ONE DAY are read against. Each rate applies only
# inside its own band, so crossing a threshold never reprices what came before it and take-home
# income never steps downward. Withheld at the payday by Borough.Core.Rules.WageEngine, which spreads
# a payment across the Days it closes before consulting any band -- so this file's seven-Day pay
# period is taxed as seven Days and not as one enormous one.
#
# 🔴 PROVISIONAL, LIKE EVERYTHING ELSE HERE. What each number is anchored to:
#
#   allowance_per_day = 512         A QUARTER of this file's own wage_per_day of 2048. The one
#                                   per-Day earnings figure the Ruleset already states, so the
#                                   allowance is a fraction of a Day worked. Taste, not derivation.
#
#   upper_threshold_per_day = 1536  THREE QUARTERS of the same wage, so a Citizen on the posted wage
#                                   earns into the upper band EVERY Day and BOTH BANDS ARE REACHABLE
#                                   BY THE ONLY WAGE THIS FILE PAYS. A threshold above 2048 would
#                                   make the upper rate unobservable here, which is the
#                                   demonstration failing quietly rather than loudly.
#
#   middle_rate_percent = 20        Leaves the middle band worth 1024 a Day and takes 204 of it.
#   upper_rate_percent  = 40        A doubling, taking 204 more from the 512 above the threshold.
#                                   The loader refuses an upper rate BELOW the middle one outright.
#
# ⚠ THE PROPORTIONS ARE WHY THESE ARE THE NUMBERS, and the digits move with the wage. A quarter and
# three quarters are what keep both bands reachable when change 2 moves wage_per_day; a schedule
# anchored to an absolute figure would silently stop demonstrating the upper rate the moment the wage
# went under it.
#
# THE HAND ARITHMETIC, so the --income column can be checked without reading any code. At the posted
# wage of 2048 a Day:
#
#   0 .. 512      allowance, taxed at nothing
#   512 .. 1536   1024 at 20%  ->  204
#   1536 .. 2048   512 at 40%  ->  204
#                               -------
#                  408 a Day, an effective rate of 19.9%
#
# A full seven-Day payday is therefore 14,336 gross, 2,856 withheld, 11,480 net. 408 is the whole
# rate here because nothing in this file grades a wage -- it states no [jobs] wage_tier_percent and no
# experience_premium_percent, so WorkSchedule.Graded hands back the posted figure and 2048 is the only
# rate anybody earns.
#
# ⚠ SO EVERY READING IN THE 2,000-CITIZEN, 24,576-TICK RUN QUOTED ABOVE DIVIDES BY 408 -- 20, 47, 72,
# 48, 42, 78 and 50 Citizen-Days, 357 of them for 145,656 -- AND THAT IS A PROPERTY OF THAT READING
# RATHER THAN A LAW. A payday that pays a worker only PART of what they are owed closes a short Day,
# and a short Day is taxed in a lower band: at 1,000 Citizens over 12,288 Ticks the last reading is
# 12,268, which is 30 whole Days and a remainder. ***A column that does not divide is a partial
# payday, not a broken schedule*** -- read `owed and not covered` in --business beside it.

[income_tax]
allowance_per_day       = 512
upper_threshold_per_day = 1536
middle_rate_percent     = 20
upper_rate_percent      = 40
