closes_hour = 21
# CHANGE 2 of 6. 4096 -> 2048 -- see THE WAGE, which carries the sweep that chose it.
wage_per_day    = 2048
pay_period_days = 7
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[building]]
