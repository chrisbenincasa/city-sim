# A city office that MAKES Professional Services, and shops that buy them from it.
# serviced.toml with an `office` kind whose `accountant` firm turns labour into a daily allowance of
# `accounting` (30-minute reach) and `insurance` (remote). A shop's `audit` Rule buys one of each from
# the nearest office in reach that still has units today, and from the cheapest gated Hinterland when
# no office will. A local sale is a transfer -- the shop's purse pays the office's balance and the
# Money supply does not move -- where an import pays the Outside and writes the supply down.
#
# Three differences from serviced.toml, each for one reason:
#   - the service purchase is its own Rule, `audit`, so that a stalled service is distinguishable from
#     a stalled restock. `import` stays sundries-only, as imported.toml has it.
#   - every Hinterland prices both services. The Pool's price is the import CEILING, which is the
#     lowest price any declared Hinterland charges, so an edge leaving a service unpriced would price
#     it at zero and an office would work for nothing.
#   - `advise` makes far more units a Day than this city can buy. Office capacity is demonstrated by
#     the allowance expiring at the Day boundary rather than by a shortage, so the fixture is sized not
#     to run dry on its own.
#
# No [[zone_rule]] raises an `office`: a city raises offices in answer to unserved demand, which is a
# separate slice. A test places one.
#
# This is a demonstration fixture, not a balance or performance ratifier. All tuning is PROVISIONAL.

[[resource]]
name = "sundries"
family = "good"
need = "sustenance"

[[resource]]
name = "repairs"
family = "good"

[[resource]]
name = "accounting"
family = "service"
reach_minutes = 30

[[resource]]
name = "insurance"
family = "service"
remote = true

[[resource]]
name = "money"
family = "money"

[[resource]]
name = "labour"
family = "labour"
shelf_life_cycles = 4
shelf_life_cycle_minutes = 15

[[business]]
name = "shop"
work_days = 31
wage_per_day = 4096
pay_period_days = 7
goes_bankrupt_after_days_in_arrears = 28
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[business]]
name = "grocer"
work_days = 124
open_days = 127
opens_hour = 7
closes_hour = 21
wage_per_day    = 4096
pay_period_days = 7
goes_bankrupt_after_days_in_arrears = 28
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[business]]
name = "accountant"
work_days = 31
wage_per_day    = 4096
pay_period_days = 7
goes_bankrupt_after_days_in_arrears = 28
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[building]]
name = "dwelling"
bins = [
    { resource = "sundries", capacity = 128, owner = "occupant" },
    { resource = "repairs",  capacity = 4 },
]
houses   = true
premises = true
parked = true
business = "shop"

[[building]]
name = "shopfront"
bins = [
    { resource = "sundries", capacity = 1024, owner = "business" },
    { resource = "repairs",  capacity = 4 },
    { resource = "money",    owner = "business" },
    { resource = "labour",   owner = "business" },
]
houses   = true
premises = true
business = "grocer"

# An Outside Connection: it houses and employs nobody and declares no Bins.
[[building]]
name = "port"
arrivals_per_day = 12

# The provider. It holds no stock of anything: a service is never stocked, so what its Rule makes is
# an allowance for the Day rather than a Bin level.
[[building]]
name = "office"
bins = [
    { resource = "money",  owner = "business" },
    { resource = "labour", owner = "business" },
]
premises = true
business = "accountant"

[[rule]]
name    = "restock"
kind    = "dwelling"
rate    = 8
apply   = { min = 1, max = 4 }
inputs  = [ { scope = "pool", resource = "sundries", amount = 4 } ]
outputs = [ { scope = "local", resource = "sundries", amount = 4 } ]

[[rule]]
name    = "consume"
kind    = "dwelling"
rate    = 256
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "sundries", amount = 4 } ]
outputs = []

[[rule]]
name    = "upkeep"
kind    = "dwelling"
rate    = 16
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "repairs", amount = 4 } ]
outputs = []

[[rule]]
name    = "import"
kind    = "shopfront"
rate    = 8
apply   = { min = 1, max = 4 }
inputs  = [
    { scope = "local", resource = "labour", amount = 1 },
    { scope = "pool", resource = "sundries", amount = 8 },
]
outputs = [ { scope = "local", resource = "sundries", amount = 8 } ]

# The client side of the contract. Labour makes it the Business's Rule rather than the premises', which
# is what a service purchase needs: the contract names a firm.
[[rule]]
name    = "audit"
kind    = "shopfront"
rate    = 64
apply   = { min = 1, max = 1 }
inputs  = [
    { scope = "local", resource = "labour", amount = 1 },
    { scope = "pool", resource = "accounting", amount = 1 },
    { scope = "pool", resource = "insurance", amount = 1 },
]
outputs = []

[[rule]]
name    = "rates"
kind    = "shopfront"
rate    = 2048
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local",  resource = "money", amount = 16384 } ]
outputs = [ { scope = "global", resource = "money", amount = 16384 } ]

# The provider side. Labour in, a Day's units of two services out -- so an office with nobody at work
# makes nothing and is nobody's provider.
[[rule]]
name    = "advise"
kind    = "office"
rate    = 64
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "labour", amount = 1 } ]
outputs = [
    { scope = "local", resource = "accounting", amount = 64 },
    { scope = "local", resource = "insurance",  amount = 64 },
]

[[zone_rule]]
name          = "housing"
kind          = "dwelling"
zone          = 0
interval      = 32
revisit_ticks = 2048

[[zone_rule]]
name          = "trade"
kind          = "shopfront"
zone          = 1
interval      = 32
revisit_ticks = 2048
build_threshold_days = 1
cooldown_days        = 1

