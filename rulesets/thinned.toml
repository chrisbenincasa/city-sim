# declining.toml WITH THE FIRST THRESHOLD SWITCHED ON. It models no city, and it is not the beginning
# of one.
#
# Milestone 17 task 3's demonstration Ruleset. CONTEXT.md -> Failure Pressure has described TWO
# thresholds since before the build existed -- "past a threshold it loses occupancy and quality; past
# a further one it is abandoned" -- and only the further one was ever implemented. This is the world
# that shows the first.
#
# THE DIFF AGAINST declining.toml IS THREE LINES, and the third is the one nobody would guess:
#
#   1. `sheds_occupant_after_days = 1`  -- the new key. One Occupant leaves per Day of premises
#      pressure.
#   2. `condemn_after_days` 2 -> 8      -- HEADROOM, not tuning. `occupants` is 4 and one leaves per
#      Day, so a Building needs four Days to empty. At 2 it would shed twice and be abandoned with
#      two Households still inside, and this file would demonstrate a slower demolition.
#   3. `upkeep`'s `apply`, `{ min = 1, max = 1 }` -> `{ derived = "occupancy" }`.
#
# 🔴 WITHOUT THE THIRD LINE THE OTHER TWO BUY NOTHING, and that is the whole mechanism in one
# sentence. A fixed `apply` demands the same repairs whether four Households live there or none, so
# shedding does not reduce what the Building needs and it is condemned anyway, just later and emptier.
# A DERIVED `apply` FALLS WHEN OCCUPANCY DOES -- so shedding an Occupant lowers the demand that caused
# the shedding. ***That is the only negative feedback loop in the build***, and it is what makes the
# first threshold a correction rather than a slower death.
#
# At zero Occupants a derived Rule bands to (0,0), fires with zero applications, and RuleEngine.Fire
# clears StarvedSince outright. The Building is not merely un-condemned: it has STOPPED FAILING, and
# it is a Building placement can refill rather than a shell nobody can enter.
#
# !! WHAT IT LOOKS LIKE, MEASURED RATHER THAN REASONED. At 1,000 CITIZENS on the reference machine,
# against declining.toml on the same seed, `--zones --no-decide-guard`:
#
#     Ticks      built/abandoned/vacant   condemned   Occupants shed
#     8,192      124 /  0 / 10                    0              327
#     32,768     124 /  0 / 10                    1            1,988
#     65,536     124 /  0 / 10                    2            4,080
#     131,072    124 /  0 / 10                    5            8,429
#
#     declining.toml, 32,768 Ticks:  392 condemned, 0 shed
#
# THE CENSUS IS FLAT ACROSS A 16x RANGE AND `abandoned` IS ZERO AT EVERY SAMPLE. Five condemnations
# in 131,072 Ticks against declining.toml's 392 in a quarter of that. adr/0006 holds trivially here --
# there is nothing to trend.
#
# ⚠ THE FIVE ARE NOT A DEFECT AND THEY ARE NOT NOISE. A Zone Rule samples Lots (adr/0059) rather than
# scanning them, so a Lot can go unlooked-at for a stretch; one that goes unseen for eight Days is
# condemned on the first look, having never been offered the rung below. ***The first threshold is
# only applied as often as the sweep finds the Building***, which is a property of the sample and not
# of the key, and it is why the gap between the two thresholds is worth more than the floor allows.
#
# 🔴 WHAT THIS FILE IS NOT. It is a demonstration and not a city, and it is a HARSH one: nothing in it
# produces `repairs` at all, so every Building always starves and the steady state is a permanent
# churn -- roughly 8,400 evictions per 131,072 Ticks, into a Pool that rehouses them into Buildings
# that immediately start failing again. Nobody lives anywhere for long. ***What it demonstrates is
# that the mechanism terminates and the stock survives, NOT that this is a city somebody would want.***
# A world where the loop settles instead of churning needs a premises Rule that can be short and then
# supplied, and plans/0045 F9 measures why no authorable Ruleset can do that: a trough is bounded by
# its producer's period, the Event Wheel caps that at 2,047 Ticks, and the shortest threshold a
# Ruleset may author is 2,048.
#
# 🔴 NEITHER OF ITS TWO CHANGED NUMBERS IS RATIFIED AND THIS FILE CAN RATIFY NEITHER. `1` is the floor
# the unit allows, chosen so a short run can watch an Occupant leave; `8` is derived from `occupants`
# and would move with it. plans/0002 §D1 holds the row and names what would settle it. ***A threshold
# measured in a world where failure is certain is measuring a stopwatch and not a design.***
#
# ⚠ IT IS NOT A GOLDEN BASELINE ARTEFACT. declining.toml and declining-tuned.toml are; this file is
# loaded by OccupancySheddingTests and by nothing else, so editing it moves no recorded content hash.
# ***Do not copy declining.toml's baseline warning into this header*** -- it was copied here once,
# wholesale and wrongly, when this file was created from it.

# The keys below are minimal.toml's and its comments carry their arguments -- read them there.
# What is commented HERE is what this file changes and why.

[[resource]]
name = "sundries"
family = "good"

[[resource]]
name = "repairs"
family = "good"

[[resource]]
name = "money"
family = "money"

[[business]]
name = "shop"
jobs = 8
shift_start_earliest_hour = 6
shift_start_latest_hour   = 10

[[building]]
name = "dwelling"
bins = [
    { resource = "sundries", capacity = 48, owner = "occupant" },
    { resource = "repairs",  capacity = 4 },
]
# HOW MANY DAYS A PREMISES RULE MAY STARVE CONTINUOUSLY before the Building is condemned and
# abandoned. adr/0141's premises half; the tenant half is `tenancy_ends_after_days`, which this
# file does not state because its tenants are fed.
#
# !! IT WAS `condemn_after = 4` AND THAT WAS 45 IN-WORLD MINUTES. The old key counted FIRINGS a
# starved Rule may miss, so its value had to be read against the Rule's own `rate` to mean
# anything: 4 missed firings of `upkeep` at rate 16 is 64 Ticks. Nothing on the page said so, the
# value stood at 4 in all eighteen shipped files, and NO AUTHOR EVER CHANGED IT -- because no
# author could see what it said. A dwelling here lived about half an in-world Day.
#
# So milestone 17 authored the felt quantity and derived the count, which is adr/0059 and
# adr/0130's rule arriving at the one key that had gone the other way. THE FLOOR IS NOW ONE DAY
# AND 45 MINUTES IS NOT EXPRESSIBLE AT ALL, which is the point of the unit rather than a side
# effect of it.
#
# !! UNRATIFIED, and plans/0002 D1 holds it. This is a stopwatch setting: what it dials with
# `collapses_after_days` is WHAT SHARE OF THE CITY IS DERELICT at steady state, and that share is
# a ratio of the two -- roughly blight / (life + blight). QUOTE THE CENSUS AND NEVER THE
# ARITHMETIC: this file's header carries the measured numbers and an earlier version of it
# carried a paper figure that was wrong by a factor of two.
condemn_after_days = 8
# THE FIRST THRESHOLD, and the whole of this file's diff from declining.toml is this key, the 8 above
# and one word in `upkeep` below. Past this the Building sheds ONE Occupant; past condemn_after_days
# it is abandoned. CONTEXT.md → Failure Pressure has said so since before the build existed and
# nothing implemented the first half until milestone 17 task 3.
#
# ⚠ 8 ABOVE IS NOT A TUNING CHANGE, IT IS HEADROOM FOR THIS KEY. `occupants` is 4 and one leaves per
# Day, so a Building needs four Days to empty. At declining.toml's 2 it would shed twice and be
# abandoned with two Households still in it, and the file would demonstrate a slower demolition
# rather than a recovery. ***The two keys are read against `occupants` and not against each other.***
sheds_occupant_after_days = 1
# The sink for what condemn_after_days creates: how many Days the empty shell stands before it
# collapses and the Lot returns to vacant (adr/0091, milestone 17). REQUIRED wherever
# condemn_after is stated -- a kind that can be abandoned and cannot collapse accumulates
# shells for ever, which is adr/0006, and the loader refuses it.
#
# !! A STOPWATCH SETTING AND NOT A DESIGN CLAIM, exactly as crowded.toml's two are. What this
# number actually dials, together with condemn_after_days above, is WHAT SHARE OF THE CITY IS
# DERELICT at steady state -- because the share is a RATIO of the two and not a property of
# either. A shell that stands 1 Day in a city whose Buildings live 2 is a third of the stock; the
# same 1 Day against a life of half a Day is two thirds, which is what this file measured when
# the threshold above was 45 minutes.
#
# !! ONE DAY IS THE FLOOR THE UNIT ALLOWS and it is chosen so the demonstration demonstrates:
# a shell that a short run can watch appear, stand and fall. A city a player would live in
# wants a gentler failure rate AND a longer blight, and that pair is UNRATIFIED with no world
# to settle it -- plans/0002 D1, ratified by the first play session in which somebody watches
# a district decline, which is adr/0091's own ratifier for the clearance price.
collapses_after_days = 1
occupants = 4
business = "shop"
parking = 8

[[rule]]
name    = "restock"
kind    = "dwelling"
rate    = 8
apply   = { min = 1, max = 4 }
inputs  = []
outputs = [ { scope = "local", resource = "sundries", amount = 4 } ]

[[rule]]
name    = "consume"
kind    = "dwelling"
rate    = 32
apply   = { min = 1, max = 1 }
inputs  = [ { scope = "local", resource = "sundries", amount = 4 } ]
outputs = []

[[rule]]
name    = "upkeep"
kind    = "dwelling"
rate    = 16
apply   = { derived = "occupancy" }
inputs  = [ { scope = "local", resource = "repairs", amount = 4 } ]
outputs = []

[[zone_rule]]
name          = "housing"
kind          = "dwelling"
zone          = 0
interval      = 32
revisit_ticks = 2048

[placement]
interval      = 32
revisit_ticks = 1024
candidates    = 3

[layers]
noise_range_metres            = 300
noise_intensity_percent       = 400
desirability_pollution_percent = 100
desirability_noise_percent     = 100
pollution_period      = 64
pollution_offset      = 0
land_value_period     = 256
land_value_offset     = 16
kernel_metres         = 1024
pollution_decay_ticks = 2048
land_value_tau        = 8

[roads]
block_tiles                    = 32
arterial_count                 = 0
arterial_junction_tiles        = 512
foot_crossing_every            = 4
foot_paths_per_thousand_blocks = 40
street_speed_kph               = 50
arterial_speed_kph             = 90
walk_speed_kph                 = 5
street_capacity_per_hour       = 3600
arterial_capacity_per_hour     = 12000
foot_path_capacity_per_hour    = 1000

[lots]
lots_per_segment = 5

[parking]
radius_metres = 400
shed_keeps = 24

[trips]
crossing_seconds = 30
commute_fast_minutes = 20
commute_moderate_minutes = 40
commute_budget_minutes = 50

[jobs]
interval      = 32
revisit_ticks = 1024
candidates    = 3
shift_hours_min = 6
shift_hours_max = 10
arrive_early_max_minutes = 15
