# The test-street Style Preset. A fixture for the Appearance Family format and the picking rule,
# not a style: it maps pass 03's test-street bodies onto the plans the shipped Rulesets raise, and
# draws every other Building in a plain box fallback. Plans are in metres; one Tile is 4 m.

[preset]
name = "test-street"

# Provisional. Attached Buildings on one block face raised within the same 30 game Days share a family.
era_days = 30

# Patterns whose Buildings stand in attached rows along a block face.
attached = ["perimeter", "back-to-back"]

# Detached houses on one block face and era stand in runs of 2 to 4 Lots. A matched run shares its
# family and roof pitch. A run of copies shares its family, proportions, materials and paint.
runs = { alone = 3, matched = 5, copies = 2 }
run_houses = [2, 4]

# Attached houses on one block face and era stand in terraces of 3 to 6 Lots. A terrace shares its
# family and roof pitch; neighboring terraces differ in family. Each house draws its own paint.
terrace_houses = [3, 6]

# A Building drawn as an apartment stands in a run of 1 to 3 Lots, on attached and detached faces
# alike. A run shares its form and roof pitch; neighboring runs differ in form. The apartment
# families share one place in the draw, so their eight forms take no more Lots than one would.
apartment_lots = [1, 3]

# A shop Building stands in a parade of 2 to 4 Lots. A parade shares its form, roof pitch and walls;
# neighboring parades differ in form. Each shop unit draws its own shopfront, paint, awning and sign.
# The shop families share one place in the draw, as the apartment families do.
shop_lots = [2, 4]

[[family]]
id = "box"
fallback = true
kinds = ["dwelling", "shopfront", "school", "port", "hospital", "clinic", "university", "secondary",
         "primary", "officeblock", "existing homes", "college", "arrival gate"]

[[family]]
id = "rowhouses"
model = "test-street/rowhouses"
kinds = ["dwelling"]
storeys = [2, 3]
frontage_metres = [4, 12]
depth_metres = [8, 16]
patterns = ["perimeter", "back-to-back"]

# One house a Building: two 3 m bays at 6 m, a door and a window below and two windows above.
# A side wall against a neighbour is blank and carries a party-wall upstand.
[family.body]
library = "test-street/rowhouses"
materials = { wall = "bricks-088", wall-end = "bricks-088", roof = "clay-roof-tiles-02" }
bay_metres = 3.5
terrace = "side-gable"
pitch_degrees = [20, 40]
chimney = true
steps = true
openings = { window = [2.2, 1.6, 0.9], door = [1.0, 2.3] }
street_ground = ["door", "window*"]
street_upper = ["window*"]
back_ground = ["door", "window*"]
back_upper = ["window*"]
side_ground = ["blank*", "window", "blank*"]
side_upper = ["blank*", "window", "blank*"]

# Each house draws one scheme by its own id, so a terrace is painted house by house. The brick takes
# the paint; the clay roof keeps its photograph's colour.
