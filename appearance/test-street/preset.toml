# The test-street Style Preset. A fixture for the Appearance Family format and the picking rule,
# not a style: it maps pass 03's test-street bodies onto the plans the shipped Rulesets raise, and
# draws every other Building in a plain box fallback. Plans are in metres; one Tile is 4 m.

[preset]
name = "test-street"

# Provisional. Attached Buildings on one block face raised within the same 30 game Days share a family.
era_days = 30

# Patterns whose Buildings stand in attached rows along a block face.
attached = ["perimeter", "back-to-back"]

[[family]]
id = "box"
fallback = true
kinds = ["dwelling", "shopfront", "school", "port", "hospital", "clinic", "university", "secondary",
         "primary", "officeblock", "existing homes", "college", "arrival gate"]

[[family]]
id = "rowhouses"
model = "test-street/rowhouses"
kinds = ["dwelling"]
storeys = [2, 3]
frontage_metres = [4, 12]
depth_metres = [8, 16]
patterns = ["perimeter", "back-to-back"]

# One house a Building: two 3 m bays at 6 m, a door and a window below and two windows above.
# A side wall against a neighbour is blank and carries a party-wall upstand.
[family.body]
library = "test-street/rowhouses"
tile_metres = { wall = [2.4, 1.2], wall-end = [2.4, 1.2], roof = [4.0, 4.0] }
bay_metres = 3.5
gable_degrees = 18
chimney = true
steps = true
openings = { window = [2.2, 1.6, 0.9], door = [1.0, 2.3] }
street_ground = ["door", "window*"]
street_upper = ["window*"]
back_ground = ["door", "window*"]
back_upper = ["window*"]
side_ground = ["blank*", "window", "blank*"]
side_upper = ["blank*", "window", "blank*"]

[[family]]
id = "corridor-apartments"
model = "test-street/corridor-apartments"
kinds = ["dwelling"]
weight = 2
storeys = [3, 3]
frontage_metres = [20, 28]
depth_metres = [12, 20]

# Eight 3 m bays at 24 m. One central entrance; the stairs stand at both ends over their doors.
[family.body]
library = "test-street/corridor-apartments"
tile_metres = { wall = [2.0, 2.0], membrane = [20.0, 20.0] }
bay_metres = 3.0
parapet_metres = 0.7
roof_hatch = true
vents = 2
openings = { window = [1.6, 1.7], door = [2.0, 2.4], stair = [2.0, 2.6, 1.2] }
street_ground = ["window*", "hall*", "window*"]
street_upper = ["window*"]
back_ground = ["window*", "hall*", "window*"]
back_upper = ["window*"]
side_ground = ["blank*", "door", "blank*"]
side_upper = ["blank*", "stair", "blank*"]

[[family]]
id = "two-unit-apartments"
model = "test-street/two-unit-apartments"
kinds = ["dwelling"]
storeys = [3, 3]
frontage_metres = [20, 28]
depth_metres = [12, 20]

# Two tenancies split at mid-frontage. Each has a street door under a stair stack at its outer end,
# a garden door, and a roof hatch over its stair.
[family.body]
library = "test-street/two-unit-apartments"
tile_metres = { wall = [2.0, 2.0], wall-end = [2.0, 2.0], membrane = [20.0, 20.0] }
bay_metres = 3.0
parapet_metres = 0.7
party_line = true
roof_hatch = true
vents = 2
openings = { window = [1.6, 1.7], door = [2.0, 2.5], stair = [2.0, 2.6, 1.2] }
street_ground = ["door", "window*", "door"]
street_upper = ["stair", "window*", "stair"]
back_ground = ["window", "door", "window*", "door", "window"]
back_upper = ["window*"]
side_ground = ["blank*", "window", "blank", "window", "blank*"]
side_upper = ["blank*", "window", "blank", "window", "blank*"]

[[family]]
id = "walkup-apartments"
model = "test-street/walkup-apartments"
kinds = ["dwelling"]
storeys = [3, 3]
frontage_metres = [28, 36]
depth_metres = [8, 16]

# Two stair stacks on the street, each serving two flats a floor. Each flat has a garden door with a
# balcony above it on every upper floor.
[family.body]
library = "test-street/walkup-apartments"
tile_metres = { wall = [2.0, 2.0], membrane = [20.0, 20.0] }
bay_metres = 4.0
parapet_metres = 0.7
openings = { window = [1.4, 1.7], door = [2.0, 2.4], stair = [2.0, 2.6, 1.2], balcony = [2.4, 2.3] }
street_ground = ["window*", "door", "window*", "door", "window*"]
street_upper = ["window*", "stair", "window*", "stair", "window*"]
back_ground = ["balcony+window*"]
back_upper = ["balcony+window*"]
side_ground = ["window", "blank*", "window"]
side_upper = ["window", "blank*", "window"]

[[family]]
id = "corner-shops-with-flats"
model = "test-street/corner-shops-with-flats"
kinds = ["dwelling", "shopfront"]
storeys = [3, 3]
frontage_metres = [20, 28]
depth_metres = [12, 20]
zones = ["trade"]

# Shops on the street under a fascia and awnings, with two shop doors. A free end is the side
# street: two shops and the flats' door under their stair. Receiving is at the back.
[family.body]
library = "test-street/corner-shops-with-flats"
tile_metres = { wall = [1.125, 1.125], membrane = [20.0, 20.0] }
bay_metres = 3.0
parapet_metres = 0.9
shopfront = true
plant = 2
openings = { window = [1.5, 1.8], door = [2.3, 2.6], stair = [2.0, 2.6, 1.2], shop = [2.3, 3.0, 0.6], roller = [3.2, 3.0] }
street_ground = ["shop", "door", "shop*", "door", "shop", "shop"]
street_upper = ["window*"]
back_ground = ["roller", "door", "blank*"]
back_upper = ["window*"]
side_ground = ["shop", "shop", "blank*", "door"]
side_upper = ["window*", "stair"]

[[family]]
id = "office-warehouse"
model = "test-street/office-warehouse"
kinds = ["dwelling", "shopfront", "officeblock"]
storeys = [2, 2]
frontage_metres = [32, 40]
depth_metres = [16, 24]

# Six 6 m bays at 36 m. Receiving is at the back; stairs light the ends.
[family.body]
library = "test-street/office-warehouse"
tile_metres = { wall = [2.0, 1.6], wall-end = [2.0, 1.6], membrane = [20.0, 20.0] }
bay_metres = 6.0
parapet_metres = 0.8
pilasters = true
plant = 2
receiving_canopy = true
street_ground = ["shop", "shop", "entry", "shop*"]
street_upper = ["shop*"]
back_ground = ["roller", "roller", "door", "blank*"]
back_upper = ["shop*"]
side_ground = ["blank", "stair", "door"]
side_upper = ["blank", "stair", "blank"]

[[family]]
id = "workshop"
model = "test-street/workshop"
kinds = ["shopfront", "officeblock"]
storeys = [2, 2]
frontage_metres = [28, 36]
depth_metres = [12, 20]

# An 8 m grid of panels. A receiving door and a door on the street; long windows above and behind.
[family.body]
library = "test-street/workshop"
tile_metres = { wall = [2.0, 2.0], membrane = [20.0, 20.0] }
bay_metres = 8.0
parapet_metres = 0.8
panels = true
rooflights = true
openings = { window = [5.0, 1.2, 1.1], door = [1.0, 2.3], roller = [3.5, 3.0] }
street_ground = ["roller", "door", "window*"]
street_upper = ["window*"]
back_ground = ["window*"]
back_upper = ["window*"]
side_ground = ["door", "blank*"]
side_upper = ["blank*", "window"]
